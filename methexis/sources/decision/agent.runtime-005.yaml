id: agent.runtime-005
revision: sha256:a82c2597c56bd64a2c827f22dc1c29bfcc3366787205448234ac6f83badaac12
payload:
  kind: decision
  content: |-
    The first real Agent Backend is a locally installed Codex app-server adapter over its default stdio JSONL transport. It initializes and checks protocol-version compatibility, maps Codex Thread, Turn, and Item messages into yo-neutral Session, Turn, and Activity semantics, keeps Codex wire types private, and fails explicitly on incompatibility. yo-cli selects and wires the backend. The independent yo-backend-delegated-codex crate depends on yo-backend for bounded child-process JSONL and deferred-message mailbox mechanisms and on yo-core for the provider-neutral AgentBackend specialization. It owns Codex-specific launch policy, correlation, translation, and deterministic cleanup, while yo-core does not depend on Codex wire behavior. A deterministic fake implements the same core specialization without Codex, credentials, network access, or model nondeterminism. WebSocket and remote app-server use are deferred.

    The Codex app-server adapter declares backend_managed_state continuation: Yo persists transcript, semantic events, correlation, and a versioned locator, while Codex owns model-visible conversation state. Resume verifies the Codex thread identity and emits no Yo replay delta or replay reference.

  kind: decision
  content: Knowledge RevisionId is lowercase SHA-256 over an unambiguous length-delimited representation of schema, KnowledgeId, kind, owner, canonical body, sorted exact Source pins, and every closed relation type with sorted targets. CRLF and bare CR normalize to LF; path, YAML order or formatting, generation time, and original line endings are excluded while all other body bytes remain meaningful.

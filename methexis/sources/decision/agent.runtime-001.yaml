revision: sha256:1ddc96b67f71dd2dae90856da7dd2313ef7ac339a1e390227bc36bd5b33b2292
payload:
  kind: decision
  content: The shared agent engine is named yo-core and owns only frontend-independent agent execution semantics; yo-tui owns UI behavior, yo-cli owns the product entry point, process-wide lifecycle policy, and top-level wiring, and a future GUI reuses yo-core without yo-tui. Shared use alone does not qualify code for yo-core. The initial monolith kept session, command, event, configuration, and backend concerns together while their semantic boundaries stabilized. A later crate split is admitted only at a concrete independently changing architectural boundary, not from shared use alone. The accepted backend split consists of the provider-neutral yo-backend foundation, the yo-core semantic specialization, and flat concrete managed, Codex, and Grok backend crates; concrete backends may depend on the foundation and yo-core, while yo-core and the foundation never depend on a concrete backend. Other protocol, adapter, or utility extraction still requires an independent consumer, independently changing host protocol or process lifecycle, or release boundary.

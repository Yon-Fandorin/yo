id: agent.runtime-001
revision: sha256:90d8ac42eb1a12ea40ca69726c4839c4294fab551e437b64d34705e600902a89
payload:
  kind: decision
  content: The shared agent engine is named yo-core and owns only frontend-independent agent execution semantics; yo-tui owns UI behavior, yo-cli owns the product entry point, process-wide lifecycle policy, top-level wiring, and concrete Backend and Model Connector composition. Shared use alone does not qualify code for yo-core. The accepted Backend split leaves provider-neutral backend contracts, replay types, and opaque provider-private envelopes in yo-backend and concrete managed, Codex, and Grok adapters in flat crates that depend on yo-core, never the reverse. The accepted Model Connector split leaves only provider-neutral Connector ports, shared Connector semantic types, and the closed api_dialect-to-Connector identity registry in yo-core; flat concrete OpenAI Responses, OpenAI Chat Completions, and Kimi Connector crates depend on yo-core, may depend on yo-backend only for its neutral replay contract, never depend on one another, and yo-core never depends on them. A narrow shared transport crate is admitted only for bounded HTTP and SSE byte mechanics used by multiple concrete Connectors and may own no dialect or semantic policy. Other extractions still require an independently changing protocol, process lifecycle, consumer, or release boundary.

id: methexis.context-model.build-identity
revision: sha256:1b5e549989439fd3ad09e70f7f01a1377053a69988be6fc2b65e5b8c5e63d81c
payload:
  kind: decision
  content: A ContextBuild identity binds the exact context Checkpoint identity and hash, stable authority-basis commit, selected Knowledge and relations, freshness observations, anchors, candidate input, compiler, tokenizer and budget. Trusted-active resolution and an explicit activation-review-only prospective resolution of that same exact Checkpoint intentionally derive the same BuildId because authority observation mode does not change the compiled semantic payload. Each operation result and consuming review plan records the mode outside BuildId and applies its own final authority guard. A prospective artifact is review-only before integration and ordinary reuse after activation independently validates that the exact Checkpoint is then active and fresh.

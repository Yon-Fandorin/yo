payload:
  kind: decision
  content: After structural validation, working-tree Fast Check evaluates each approval proposal by its explicit review basis. Canonical approval matches the exact English revision without a Projection; Projection approval additionally requires exact current Projection evidence. A stale unreferenced Projection cannot grant evidence and does not block canonical approval, while malformed records and referenced mismatches fail closed. Local evidence never grants trusted authority. Trusted ref pinning, demotion-only observations, tracked authority roots, and storage-neutral snapshots remain unchanged.

payload:
  kind: decision
  content: >-
    The initial glyph vocabulary provides explicit Rich user and assistant markers U+276F and U+23FA, and ASCII markers greater-than sign and asterisk. Rich is the compatibility default and ASCII is selected only through an explicit session appearance candidate; TERM heuristics and NO_COLOR do not select glyphs. Marker validation and layout use the existing versioned Surface grapheme-width profile, and all profiles preserve the same configured body start column.

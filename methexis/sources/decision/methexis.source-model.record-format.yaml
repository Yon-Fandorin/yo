payload:
  kind: decision
  content: Each Source is one closed typed YAML record below methexis/sources/<kind>. SourceId from record content is stable identity; path and filename are organizational hints. Kind-specific payloads own content or locators once. Code uses repository path, symbol, content hash, and an optional non-identity line hint.

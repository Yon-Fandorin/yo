payload:
  kind: decision
  content: The first Yo-managed Model Connector implements the explicit openai-responses API dialect over HTTPS with SSE streaming. It is provider-neutral, supports configured OpenRouter and QwenCloud bindings without Provider-specific backend or connector types, receives one credential already resolved for the exact Provider-and-Account pair, appends only the responses path to a normalized base URL, sends bearer authorization, rejects cross-origin redirects, enforces finite HTTP/SSE deadlines plus incremental and cumulative bounds, and translates text, reasoning metadata, function calls, completion, failure, and usage into connector-neutral observations. A semantic Responses terminal event is mandatory. SSE events without a data field are transport framing and may be ignored. After a valid terminal, every data payload fails except at most one exact data [DONE] sentinel with no declared event name; it must be the final data payload, cannot replace a terminal or repeat, and may be followed only by non-data framing and stream end. The connector never probes or silently falls back to Chat Completions. Concrete Provider endpoints, model IDs, and tokenizer profiles remain catalog configuration and conformance evidence rather than connector identity.

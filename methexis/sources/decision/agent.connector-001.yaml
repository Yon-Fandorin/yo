id: agent.connector-001
revision: sha256:9ab4453251718bec261e65300269fedc7c50e07c23bc7b1e7921f0fa7afbb137
payload:
  kind: decision
  content: >-
    The first Yo-managed model connector implements the explicit
    openai-responses protocol over HTTPS and SSE. It is generic rather than
    Qwen-specific, receives one already resolved credential, appends only the
    responses path to a normalized base URL, sends bearer authorization, rejects
    cross-origin redirects, enforces finite HTTP/SSE deadlines plus incremental
    and cumulative bounds, and translates text, reasoning metadata, function calls, completion, failure,
    and usage into connector-neutral observations. It never probes or silently
    falls back to Chat Completions. The QwenCloud Token Plan is a configured
    provider binding using its compatible-mode v1 base URL and qwen3.8-max,
    not another backend type or connector implementation.

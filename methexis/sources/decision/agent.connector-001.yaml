id: agent.connector-001
revision: sha256:cb5d5e5d2550dc87992247e9d3b9ae422623e9cd23dcffb4a9d1475fe0393d45
payload:
  kind: decision
  content: The first Yo-managed Model Connector implements the explicit openai-responses API dialect over HTTPS with SSE streaming. It is provider-neutral, supports configured OpenRouter and QwenCloud bindings without Provider-specific backend or connector types, receives one credential already resolved for the exact Provider-and-Account pair, appends only the responses path to a normalized base URL, sends bearer authorization, rejects cross-origin redirects, enforces finite transport-progress and event-delivery deadlines plus incremental and cumulative bounds, and applies a non-resetting absolute request deadline only when the agent supplies one. Agent model work defaults that absolute deadline to absent. Each request carries admitted request-local tool exposure. When the effective profile has a known hard max_output_tokens, the Connector sends a positive request-local cap no greater than it; when that profile field is absent because Yo does not know the maximum, the Connector omits the wire output-limit field rather than guessing a number. Enabled exposure is valid only under local-tools/v1 and sends the frozen registry's function definitions and tool choice; disabled exposure omits both, is mandatory under no-tools/v1 and for connection verification, and preserves exact semantic replay without changing the durable binding policy. The connector translates text, reasoning metadata, function calls, completion, failure, and usage into connector-neutral observations. A semantic Responses terminal event is mandatory. SSE events without a data field are transport framing and may be ignored. After a valid terminal, every data payload fails except at most one exact data [DONE] sentinel with no declared event name; it must be the final data payload, cannot replace a terminal or repeat, and may be followed only by non-data framing and stream end. The connector never probes or silently falls back to Chat Completions. Concrete Provider endpoints, model IDs, tokenizer profiles, and runtime deadline policy remain outside connector identity.

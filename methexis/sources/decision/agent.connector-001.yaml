id: agent.connector-001
revision: sha256:194ef0c41bde7e296bfc6228bd7caa4d03d8d94c2a051e593cf6d9fc4138d68e
payload:
  kind: decision
  content: The first Yo-managed Model Connector implements the explicit openai-responses API dialect over HTTPS with SSE streaming. It is provider-neutral, supports configured OpenRouter and QwenCloud bindings without Provider-specific backend or connector types, receives one credential already resolved for the exact Provider-and-Account pair, appends only the responses path to a normalized base URL, sends bearer authorization, rejects cross-origin redirects, enforces finite transport-progress and event-delivery deadlines plus incremental and cumulative bounds, and applies a non-resetting absolute request deadline only when the agent supplies one. Agent model work defaults that absolute deadline to absent. The connector translates text, reasoning metadata, function calls, completion, failure, and usage into connector-neutral observations. A semantic Responses terminal event is mandatory. SSE events without a data field are transport framing and may be ignored. After a valid terminal, every data payload fails except at most one exact data [DONE] sentinel with no declared event name; it must be the final data payload, cannot replace a terminal or repeat, and may be followed only by non-data framing and stream end. The connector never probes or silently falls back to Chat Completions. Concrete Provider endpoints, model IDs, tokenizer profiles, and runtime deadline policy remain outside connector identity.

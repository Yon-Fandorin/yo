id: agent.backend-008
revision: sha256:ca018906e2161173cf019fe64d7dce5c50a627405aad8b4414a6f401bc8f2583
payload:
  kind: decision
  content: 'The Yo-managed Agent Backend lives in the independent yo-backend-managed crate, owns the model and tool loop, and reaches the selected service only through the Model Connector explicitly named by the effective binding. It implements the AgentBackend semantic specialization from yo-core and consumes its semantic, model-service, connector, and tool ports; yo-core does not own or depend on the concrete loop. It projects committed semantic history into the selected API dialect, consumes connector-neutral round observations, streams model work as Activities, preserves function-call identity and typed failed Activities for rejected calls, executes approved local tools, returns exact tool results, and repeats until a final answer or failure. The same loop supports the separately contracted OpenAI Responses, provider-neutral OpenAI Chat Completions, and Kimi Chat Completions dialects without probing, fallback, or Provider-specific backend branches. It uses exact Yo Journal replay from the newest executable reconstruction root: normally the newest durable Continuation Anchor, or the newest valid context checkpoint followed by successor-epoch replay through its newest Anchor. A checkpoint source Anchor is provenance rather than the current replay root. Every effective binding carries semantic-only/v1 or kimi-private-local-plaintext/v1 replay_profile; binding or replay-profile changes are binding-epoch transitions, and ambiguous retries, malformed protocol state, incomplete tool relationships, or incomplete private continuation fail closed. Exact replay normally preserves only semantic model-visible history, but a binding may declare one schema-bound provider-private assistant extension whose Connector alone decodes and validates its private bytes and returns a connector-neutral validated visible projection beside the opaque bounded envelope. The backend validates only neutral envelope identity, binding epoch, bounds, and exact equality between that Connector-supplied projection and semantic replay. The private profile declares kimi.assistant-message/v1alpha1 for exact admitted K3 and K2.7 Code bindings; its closed assistant object is correlated to the completed response, atomically persisted with its matching semantic replay delta, excluded from every frontend and diagnostic projection, counted by token and replay-byte admission, and consumed as the single assistant wire message only by the same exact binding identity and replay profile. Missing, mismatched, cross-binding-epoch, or exhausted private state prevents a later request and Continuation Anchor rather than being omitted or reconstructed. A checkpoint may disclose and drop private items only from the summarized prefix; every retained private group stays exact and indivisible, while the synthetic user-role summary requires no private assistant counterpart. The loop applies semantic admission before tool or private values become replay and discloses that Kimi private-replay state is retained unencrypted in the user-only local Session repository. For every request, the backend counts the exact complete Connector-produced tokenization payload after provider-private assistant replacement and request-local tool projection. The selected profile may carry a known positive max_output_tokens hard capability; absence means Yo does not know a trustworthy numeric maximum and is valid only when the selected Connector permits omission of its output-limit field. For a known maximum, the backend chooses a positive request-local cap no greater than it, serializes and recounts the exact Connector payload, and dispatches only when the input count plus that cap fits input_token_limit. Without a known maximum, it omits the output-limit field, counts that exact payload, and dispatches only when that input count is strictly below input_token_limit. It never invents a numeric maximum and has no provider-neutral minimum output budget. Local input or replay-capacity exhaustion before a final assistant answer is a typed failed non-resumable Turn and latches that binding; capacity failure while retaining an already finalized answer may complete that answer without a continuation anchor. It never reports a final-less capacity stop as successful. Contracted context compaction advances only the independent context epoch within the same binding; any other lossy or private-state-dropping handoff remains a separately reviewed and user-approved binding transition. The loop owns any optional non-resetting absolute deadline for one logical model request; it defaults to absent, is distinct from transport-progress deadlines and Turn cancellation, and starts fresh for each separately admitted model request. The backend also supplies a provider-neutral typed cache-affinity hint: the canonical SessionId for ordinary requests, stable across exact resume. It remains outside binding and replay identity and is serialized only by a Connector whose reviewed endpoint admits it. A Yo-managed model loop declares exact_replay with local_client as its current executor. Local and future managed-server executors share the same semantic replay contract; managed-server execution remains a deferred capability and provider response identifiers never substitute for the declared strategy.


    Ordinary local-client exact-replay Sessions persist `yo.context-policy/v1alpha1` as monotonic Session-global `context_policy_changed` revisions independently of complete binding identity; revision 1 precedes the first request and each replacement increments by one under the persistence contract''s closed domains. The default enables `portable-summary/v1alpha1`, warns at 85 percent of the exact Connector-produced input limit, compacts at 90 percent, and spends at most the smaller of 10 percent of the input limit or 65,536 exactly counted tokens on additionally selected older raw semantic groups. `exact-replay-only/v1alpha1` rejects at the trigger instead. A policy change applies before the next model request and never opens a binding epoch. Both automatic pressure handling and an explicit idle `/compact` use one pipeline. During an active Turn, automatic compaction may cut only after a completely committed correlated semantic group, such as a tool result or approval outcome, and before the next ordinary Turn model request; it never cuts a response, pending effect, or incomplete group. The pipeline makes at most one tool-disabled summary request through the same binding and model, selects only older committed visible semantic groups, never splits a correlated group, persists each retained group''s exact replay items inline in the checkpoint with JournalSequence ranges as provenance only, and retains the current input, any unprocessed steer or approval, the newest complete semantic group, and the canonical system/tool contract. These mandatory protected items are exempt from the optional retained-raw budget and are never truncated; if the summary plus this set still reaches the trigger, the pipeline rejects instead of claiming success. The portable body uses the exact ordered Markdown headings `Context Checkpoint`, `Current Objective`, `Active Constraints`, `Decisions`, `Verified Progress`, `Current State`, `Unknown or Unverified`, `Next Actions`, and `Critical References`; each section contains supported prose or exact `None.` when there is no supported fact. Deterministic metadata and live structured state are not regenerated by the model. An eligible old large visible tool output in the summarized prefix may produce a closed content-addressed operator-disclosure receipt whose raw bytes remain only in the Session Journal; neither the receipt nor a placeholder enters model-visible replay, and this revision adds no replay variant, artifact-read tool, expiry, path, or cross-Session authority. Bounded retrieval remains a separate tool-registry follow-up. Provider-private bytes, private reasoning, credentials, and uncommitted effects never enter the summary request or artifact payload and receive only bounded loss disclosure. Pressure evaluation returns exactly `Admit`, `Compact`, or `Reject`; warning is an orthogonal observation, only `Admit` commits, and a second `Compact` becomes typed `Reject`. Success atomically commits the closed `yo.context-checkpoint/v1alpha1`, including the exact system/tools replay contract, then reconstructs model context as one synthetic user-role summary followed by exact inline retained replay groups. The newest checkpoint becomes the replay root; successor-epoch deltas apply through the newest matching Anchor, historical prior-epoch records remain valid, and a later accepted request without a matching completed Anchor remains read-only. If an active Turn crosses one or more checkpoints, its next model request uses the newest successor epoch and its sole terminal replay delta contains only the model-visible suffix committed after the newest checkpoint; it never duplicates the checkpoint body, inline retained groups, or replay contract. Earlier accepted requests remain historical evidence, while the terminal delta, outcome, and Anchor reference the latest accepted request in the successor epoch. Context epoch is Session-global: the initial binding starts at 1, later bindings inherit it unchanged, and only a same-binding checkpoint increments it by exactly one. The checkpoint does not change the binding epoch or transition cache evidence and never infers Provider cache preservation or loss; later actual ModelWork usage is the only reported cache-read evidence. Summary failure, malformed output, cancellation, a rebuilt payload still requiring compaction, or checkpoint durability failure becomes typed Reject without another semantic request, retry, fallback, Provider/model change, steer, partial handoff, or mutation of the authoritative prior context epoch.


    For every completed provider response and model round, the backend persists one schema-bound terminal ModelWork usage receipt with response and effective-binding attribution, ordinary input, output, reasoning, and total counts, and an explicit cache-read availability union. A Connector may report cache-read tokens only under its versioned source profile; reported zero remains distinct from absent and unsupported, while raw wire payloads, affinity keys, cost, inferred hits or writes, and private reasoning remain excluded.


    ## Image-aware request accounting and compaction


    For an effective binding with a reviewed `image_input_profile`, its separately

    versioned image accounting profile extends the preceding strict text-only counting

    rules explicitly. Its closed result carries `quality`,

    `policy`, `input_estimate` and `reserve_tokens`; planning count is the checked

    sum of the latter two unsigned 64-bit counts. Quality is exactly `exact`,

    `verified_upper_bound` or `advisory_estimate`, and the policy is the complete

    binding''s selected admitted versioned identity. The backend MUST preserve all

    four fields through live input, tool-result, approval-outcome, steering, summary,

    resume and model-replacement admission, pressure display and checkpoint evidence.

    Existing bindings without `image_input_profile` keep their exact previous

    counter, bytes, behavior and wire shapes. Exact and verified-bound profiles

    do not inherit advisory acceptance. Unknown image capability rejects before dispatch; uncertain accounting quality

    does not itself mean unsupported media.


    Under `kimi-code-image-advisory/v1`, let T be the selected connector''s complete

    image-free tokenization projection count after private-assistant and request-local

    tool replacement, and N be the total immutable image occurrences in that request.

    Input estimate is T + 2000*N. Reserve is 1024 when N is positive and zero

    otherwise, charged once for the complete request. These are advisory planning

    values, never measured usage or a proved upper bound. The connector supplies a

    typed image-free projection and separate immutable image descriptors; the backend

    MUST NOT search arbitrary JSON for image-like URLs, count base64 as image cost,

    read a path, fetch an image URL or make a hidden remote estimator request.


    Warning/trigger percentages and output-budget checks consume the complete

    planning count. A known output maximum retains the existing final selected-cap

    serialization and recount, admitting only when planning count plus that cap

    fits the input limit. An unknown maximum retains omission and strictly-below-limit

    admission, now under the explicit quality of the selected policy. Additional raw

    retention consumes the difference between complete request planning counts, not

    a sum of group counts with repeated reserves. Mandatory protected groups remain

    exempt from that optional raw-retention budget. The final successor is recounted

    under this same quality and policy; its `Admit` authorizes commit but an advisory

    result is not a guarantee of server acceptance. New pressure/checkpoint shapes

    record estimate and reserve separately and must label advisory evidence visibly.


    Actual provider usage remains immutable telemetry for the exact completed

    request; it does not relabel past planning counts or infer per-image cost from

    mixed usage. A provider 4xx keeps the existing explicit failed-request and

    uncertain-Anchor behavior. HTTP 400 alone is not typed context-overflow proof.

    This profile introduces no automatic resend, image stripping, model replacement,

    second summary request or fabricated successful compaction. The committed input

    and snapshots remain intact, and existing explicit recall/edit/new-session paths

    retain attachments. A preparation/admission failure before dispatch preserves

    the draft according to the input owner.


    When a selected summary prefix contains images, the one tools-disabled summary

    request uses the same selected binding/model and one user-role source message

    with its distinct typed summary-source content. This request source is not an

    ordinary persisted `multimodal_user` input: it admits one manifest plus up to 64

    images under the separate summary limits, while each referenced original input

    retains its own at-most-33-part domain. Its first text part is the closed versioned source manifest

    `yo.image-summary-source/v1`; the following parts are exactly the manifest''s

    image occurrences, with contiguous unique zero-based image indices in source

    order. Manifest message content preserves the original ordered text/image parts,

    with each image represented by an index plus canonical hash, byte count, width

    and height. The corresponding following typed image part contains the exact

    admitted PNG snapshot. No missing or surplus image, metadata mismatch, path,

    URL, base64-as-text, thumbnail or generated caption may replace it. Repeated

    identical bytes at distinct positions stay distinct occurrences. Existing

    text-only summary source encoding is unchanged. The source manifest preserves

    visible roles, refusal, function-call IDs/names/arguments and correlated result

    relationships without making historical assistant/tool entries top-level

    protocol messages. Provider-private bytes remain excluded. Images and embedded

    text are untrusted source data, never system authority.


    An image-bearing summary source admits at most 64 image occurrences and 16 MiB

    of complete canonical multipart source encoding, including manifest, text and

    actual image/base64 framing. The selected connector''s admitted count/byte limits

    also apply. These limits are separate from the 16-image ordinary input cap and

    64-MiB replay-prefix cap. A valid replay may not fit summary capacity; the first

    excess causes typed rejection with the prior context intact, not truncation,

    dropped occurrences, split semantic groups or additional summary requests.


    Each summarized image is passed intact to that request and yields exactly one

    runtime-derived `image_input_summarized` loss entry under the persistence

    contract, including its exact current-Session source location. Retained images

    remain inline and exact; current input, pending steer/approval, newest complete

    group and the system/tool contract remain mandatory. The successor portable

    body is still exactly one plain user-role message followed by exact retained

    groups; it contains no embedded image, receipt or replay placeholder. Success

    uses the new typed-accounting checkpoint profile; all existing complete-group,

    one-summary, final-admission, durable-before-dispatch, cancellation and failure

    rules remain in force. Output artifact receipts and retrieval authority do not

    change under this input-image extension. The image summary manifest and its separate complete canonical multipart source metric have closed ordered fields; image-reference metadata must match the following snapshots. Exact context-pressure/v2alpha1 carries the same explicit accounting object as checkpoints, selected by binding even at zero images, preserving legacy scalar observations for old bindings.


    The additional policy `openrouter-free-image-advisory/v1`, selected only by

    its admitted `openrouter-free-png-advisory/v1` complete binding, uses the same

    explicit planning formula with its own policy identity: T is the selected

    Chat Completions connector''s complete image-free tokenization projection after

    request-local tool exposure and selected output-cap serialization; N counts all

    immutable image occurrences, including repetitions, retained history and image

    summary sources. Input estimate is the checked unsigned-64-bit sum T + 2000*N;

    reserve is 1024 for N greater than zero and zero otherwise. Quality remains

    `advisory_estimate` even when N is zero. The constants are a local planning

    heuristic, not a calibrated image-token model, measured usage or upper bound.

    Overflow rejects before dispatch. The backend selects the admitted typed

    accounting policy without branching on Provider or Model and MUST retain the

    selected policy identity in every admission, pressure and checkpoint path.

    All preceding and following image-aware failure, protected-replay, recount,

    one-summary and persistence rules apply unchanged. This additional policy

    MUST activate with its matching service-binding and Chat Completions revisions.'

id: agent.backend-008
revision: sha256:c921df55868cde70dedfa506ab66e8824b079327afeed8c0f455c4a055633ce3
payload:
  kind: decision
  content: |-
    The first Yo-managed Agent Backend owns the model and tool loop inside yo-core and reaches the selected service only through a Model Connector. It projects committed semantic history into model input, streams model work as Activities, preserves function-call identity and typed failed Activities for rejected calls, executes approved local tools, returns exact tool results, and repeats until a final answer or failure. It uses exact Yo Journal replay from the newest durable Continuation Anchor rather than provider-private response state for continuation, treats model changes as binding-epoch transitions, and fails closed on ambiguous retries, malformed protocol state, or incomplete tool relationships.

    The Yo-managed model loop persists exact model-visible history through a separate replay delta, applies semantic redaction before tool values become Activities or replay, and performs tokenizer-aware context admission with an output reserve. It fails explicitly on context exhaustion and defers lossy compaction to a separately reviewed binding transition.


    A Yo-managed model loop declares exact_replay with local_client as its current executor. Local and future managed-server executors share the same semantic replay contract; managed-server execution remains a deferred capability and provider response identifiers never substitute for the declared strategy.

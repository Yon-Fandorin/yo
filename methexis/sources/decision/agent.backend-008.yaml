payload:
  kind: decision
  content: 'The Yo-managed Agent Backend owns the model and tool loop inside yo-core and reaches the selected service only through the Model Connector explicitly named by the effective binding. It projects committed semantic history into the selected API dialect, consumes connector-neutral round observations, streams model work as Activities, preserves function-call identity and typed failed Activities for rejected calls, executes approved local tools, returns exact tool results, and repeats until a final answer or failure. The same loop supports the separately contracted OpenAI Responses, provider-neutral OpenAI Chat Completions, and Kimi Chat Completions dialects without probing, fallback, or Provider-specific backend branches. It uses exact Yo Journal replay from the newest durable Continuation Anchor, requires every effective binding to carry semantic-only/v1 or kimi-private-local-plaintext/v1 replay_profile, treats binding or replay-profile changes as binding-epoch transitions, and fails closed on ambiguous retries, malformed protocol state, incomplete tool relationships, or incomplete private continuation. Exact replay normally preserves only semantic model-visible history, but a binding may declare one schema-bound provider-private assistant extension whose Connector owns lossless validation and request projection. The private profile declares kimi.assistant-message/v1alpha1 for exact admitted K3 and K2.7 Code bindings; its closed assistant object is correlated to the completed response, atomically persisted with its matching semantic replay delta, excluded from every frontend and diagnostic projection, counted by token and replay-byte admission, and consumed as the single assistant wire message only by the same exact binding identity and replay profile. Missing, mismatched, cross-epoch, or exhausted private state prevents a later request and Continuation Anchor rather than being omitted or reconstructed. The loop applies semantic admission before tool or private values become replay and discloses that Kimi private-replay state is retained unencrypted in the user-only local Session repository. For every request, the backend counts the exact complete Connector-produced tokenization payload after provider-private assistant replacement and request-local tool projection. That count is admitted only when it is less than or equal to input_token_limit minus max_output_tokens; a greater count fails before dispatch. It fails explicitly on context exhaustion and defers lossy compaction or private-state-dropping handoff to a separately reviewed and user-approved binding transition. The loop owns any optional non-resetting absolute deadline for one logical model request; it defaults to absent, is distinct from transport-progress deadlines and Turn cancellation, and starts fresh for each separately admitted model request. The backend also supplies a provider-neutral typed cache-affinity hint: the canonical SessionId for ordinary requests, stable across exact resume. It remains outside binding and replay identity and is serialized only by a Connector whose reviewed endpoint admits it. A Yo-managed model loop declares exact_replay with local_client as its current executor. Local and future managed-server executors share the same semantic replay contract; managed-server execution remains a deferred capability and provider response identifiers never substitute for the declared strategy.'

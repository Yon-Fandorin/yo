id: agent.backend-008
revision: sha256:aa6da37d2d86de94b62e070294e04bc156051d8f66c878338926d13fd505a4bc
payload:
  kind: decision
  content: |-
    The Yo-managed Agent Backend lives in the independent yo-backend-managed crate, owns the model and tool loop, and reaches the selected service only through the Model Connector explicitly named by the effective binding. It implements the AgentBackend semantic specialization from yo-core and consumes its semantic, model-service, connector, and tool ports; yo-core does not own or depend on the concrete loop. It projects committed semantic history into the selected API dialect, consumes connector-neutral round observations, streams model work as Activities, preserves function-call identity and typed failed Activities for rejected calls, executes approved local tools, returns exact tool results, and repeats until a final answer or failure. The same loop supports the separately contracted OpenAI Responses, provider-neutral OpenAI Chat Completions, and Kimi Chat Completions dialects without probing, fallback, or Provider-specific backend branches. It uses exact Yo Journal replay from the newest durable Continuation Anchor, requires every effective binding to carry semantic-only/v1 or kimi-private-local-plaintext/v1 replay_profile, treats binding or replay-profile changes as binding-epoch transitions, and fails closed on ambiguous retries, malformed protocol state, incomplete tool relationships, or incomplete private continuation. Exact replay normally preserves only semantic model-visible history, but a binding may declare one schema-bound provider-private assistant extension whose Connector alone decodes and validates its private bytes and returns a connector-neutral validated visible projection beside the opaque bounded envelope. The backend validates only neutral envelope identity, binding epoch, bounds, and exact equality between that Connector-supplied projection and semantic replay. The private profile declares kimi.assistant-message/v1alpha1 for exact admitted K3 and K2.7 Code bindings; its closed assistant object is correlated to the completed response, atomically persisted with its matching semantic replay delta, excluded from every frontend and diagnostic projection, counted by token and replay-byte admission, and consumed as the single assistant wire message only by the same exact binding identity and replay profile. Missing, mismatched, cross-epoch, or exhausted private state prevents a later request and Continuation Anchor rather than being omitted or reconstructed. The loop applies semantic admission before tool or private values become replay and discloses that Kimi private-replay state is retained unencrypted in the user-only local Session repository. For every request, the backend counts the exact complete Connector-produced tokenization payload after provider-private assistant replacement and request-local tool projection. The selected profile may carry a known positive max_output_tokens hard capability; absence means Yo does not know a trustworthy numeric maximum and is valid only when the selected Connector permits omission of its output-limit field. For a known maximum, the backend chooses a positive request-local cap no greater than it, serializes and recounts the exact Connector payload, and dispatches only when the input count plus that cap fits input_token_limit. Without a known maximum, it omits the output-limit field, counts that exact payload, and dispatches only when the input count is strictly below input_token_limit. It never invents a numeric maximum and has no provider-neutral minimum output budget. Local input or replay-capacity exhaustion before a final assistant answer is a typed failed non-resumable Turn and latches that binding; capacity failure while retaining an already finalized answer may complete that answer without a continuation anchor. It never reports a final-less capacity stop as successful. It defers lossy compaction or private-state-dropping handoff to a separately reviewed and user-approved binding transition. The loop owns any optional non-resetting absolute deadline for one logical model request; it defaults to absent, is distinct from transport-progress deadlines and Turn cancellation, and starts fresh for each separately admitted model request. The backend also supplies a provider-neutral typed cache-affinity hint: the canonical SessionId for ordinary requests, stable across exact resume. It remains outside binding and replay identity and is serialized only by a Connector whose reviewed endpoint admits it. A Yo-managed model loop declares exact_replay with local_client as its current executor. Local and future managed-server executors share the same semantic replay contract; managed-server execution remains a deferred capability and provider response identifiers never substitute for the declared strategy.

    Ordinary local-client exact-replay Sessions use versioned `summarize-older-semantic-history/v1` context management by default unless the caller persistently selects `exact-replay-only/v1` for immutable or byte-exact work. The selected strategy is part of the versioned binding identity, and changing it opens a successor binding epoch before another request is accepted. Before every model request, an exact Connector input count at or above 90 percent of `input_token_limit` permits at most one tool-disabled summary request through the same selected binding. It summarizes only an older visible semantic prefix, retains the newest complete semantic groups plus current input and system/tool contract, excludes provider-private bytes, private reasoning, credentials, and uncommitted effects, and never splits a function call from its result. After the bounded summary succeeds, the backend must rebuild and recount the exact payload and require the same strategy to return Admit before it durably commits the transition. Only after that commit may it dispatch through the successor lossy-handoff epoch. Summary failure or another Compact result becomes typed Reject without retry, fallback, Provider/model change, steer, or partial handoff; the old Journal and epoch remain authoritative.

    For every completed provider response and model round, the backend persists one schema-bound terminal ModelWork usage receipt with response and effective-binding attribution, ordinary input, output, reasoning, and total counts, and an explicit cache-read availability union. A Connector may report cache-read tokens only under its versioned source profile; reported zero remains distinct from absent and unsupported, while raw wire payloads, affinity keys, cost, inferred hits or writes, and private reasoning remain excluded.

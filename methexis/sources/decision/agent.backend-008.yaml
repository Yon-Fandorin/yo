payload:
  kind: decision
  content: The Yo-managed Agent Backend owns the model and tool loop inside yo-core and reaches the selected service only through the Model Connector explicitly named by the effective binding. It projects committed semantic history into the selected API dialect, consumes connector-neutral round observations, streams model work as Activities, preserves function-call identity and typed failed Activities for rejected calls, executes approved local tools, returns exact tool results, and repeats until a final answer or failure. The same loop supports the separately contracted OpenAI Responses and OpenAI Chat Completions dialects without probing, fallback, or Provider-specific backend types. It uses exact Yo Journal replay from the newest durable Continuation Anchor rather than provider-private response state for continuation, treats binding changes as binding-epoch transitions, and fails closed on ambiguous retries, malformed protocol state, or incomplete tool relationships. The loop persists exact model-visible history through a separate replay delta, applies semantic redaction before tool values become Activities or replay, and performs tokenizer-aware context admission with an output reserve. It fails explicitly on context exhaustion and defers lossy compaction to a separately reviewed binding transition. The loop owns any optional non-resetting absolute deadline for one logical model request; it defaults to absent, is distinct from transport-progress deadlines and Turn cancellation, and starts fresh for each separately admitted model request. A Yo-managed model loop declares exact_replay with local_client as its current executor. Local and future managed-server executors share the same semantic replay contract; managed-server execution remains a deferred capability and provider response identifiers never substitute for the declared strategy.

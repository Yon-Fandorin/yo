payload:
  kind: decision
  content: |-
    Stored Session discovery precedes executable continuation. New Sessions record a descriptor containing a full UUIDv7 Session ID, workspace-host identity, host-normalized workspace path, and start time. Every supported physical Session record atomically carries a bounded discovery summary with that descriptor, a writer-assigned updated Unix-millisecond timestamp, an optional binding epoch, and an optional latest valid Continuation Anchor JournalSequence, and, under the explicit fork extension, an optional executable initial-fork seed sequence. The timestamp is an envelope fact assigned immediately before append and becomes durable only with that envelope; the other summary fields are recomputable from the committed Journal prefix. Readers validate the last complete envelope through a bounded tail read rather than scanning the complete log or consulting a mutable side index. The Journal wins on detected disagreement and continuation revalidates the hinted reconstruction root. The default list and resume picker select the current host and workspace. --all adds other and unknown workspaces and alone displays the workspace column; --details exposes record schema, continuation eligibility, and full path. A future explicitly supported descriptor-less format would appear with unknown workspace metadata; rejected development formats are not readable Sessions. UPDATED is the last valid envelope's recorded durable timestamp. Quarantine and summary disagreement override eligibility; otherwise eligible means a supported summary identifies a valid Anchor or initial seed; unavailable requires validated absence of executable reconstruction, quarantine or corruption; absent legacy hints are unknown rather than proof of unavailability. It does not promise backend or transport reachability. Unavailable picker entries are dimmed, while direct UUID opens supported read-only history and may offer an explicit fork. `yo` starts a Session and `yo --continue` fails rather than starting when no eligible current-workspace candidate exists. The local read-only CLI grammar consists of listing with `yo session [--all] [--details]`, archived inspection with `yo session SESSION_ID [--view chat|transcript|request] [--ascii]`, Transcript-only selectors `--limit N` for positive N and `--content none|preview|full`, and the independent `yo usage SESSION_ID [--ascii]`; Chat is the Session-view default and Usage is not a Session view. `--ascii` changes glyphs only. Both direct-read commands capture one durable point-in-time projection through the local non-creating Session reader and never subscribe, write, repair, acquire a writer lease, create storage, allocate or resume a Session, or start a backend. A missing or unreadable Session and any fatal projection error preserve typed diagnostics on stderr and emit no partial stdout. A marker seen with an independently established active writer bounds the snapshot before the guarded append; without an established writer it quarantines the Session. Executable continuation remains separately gated by the newest valid Anchor, checkpoint or complete initial fork seed.

    ## Initial fork continuation hints

    A supported discovery summary MAY additionally contain positive
    `initial_fork_seed_journal_sequence`, naming a complete child bootstrap seed.
    It is eligible evidence only when the same durable prefix has a valid initial
    fork binding and no child accepted request after the seed. The sole writer
    MUST omit this hint as soon as a later accepted child request appears; a complete
    child Anchor then supplies ordinary continuation evidence. An uncertain later
    accepted suffix MUST NOT regain seed eligibility after a failed Turn or restart.
    The hint is part of the same checksummed physical envelope, not a second index.

    A bounded tail read may classify a supported positive Anchor or valid initial
    seed hint as `eligible`, subject to quarantine and summary-consistency precedence.
    A frozen legacy summary with neither hint cannot distinguish checkpoint-only,
    initial-seed, empty or uncertain histories and is `unknown`, not proof of
    unavailability. `unavailable` requires quarantine, established corruption, or
    validated evidence that no executable reconstruction exists. Unknown entries
    remain inspectable and receive continuation-time evaluation. Listing MUST NOT
    scan the full Journal or start a backend merely to upgrade an unknown entry.

    Executable direct resume validates the complete initial child seed and binding
    when no newer completed child Anchor or checkpoint supersedes it. A valid
    checkpoint-only root remains supported under the same continuation contract. No
    ancestor repository, skill catalog or backend request audit is fetched to
    reconstruct an inline exact seed. Failure or an uncertain accepted suffix opens
    history read-only and never resends source or child work. `--continue` may
    select an eligible supported initial-seed hint using the same deterministic
    ordering as an Anchor hint; it must still pass executable validation before
    publication or backend work. Neither inspection nor a positive hint
    independently grants executable continuation. Tree projection remains bounded
    read-only discovery. Historical fork selection is governed separately by the
    continuation-lineage contract and does not extend this owner's closed archived
    CLI grammar or grant executable eligibility.

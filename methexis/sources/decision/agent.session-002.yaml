id: agent.session-002
revision: sha256:3ffff21d3a46821f9f4fce131655f66023f13144f7f5f244f988929a1702a8b9
payload:
  kind: decision
  content: Stored Session discovery precedes executable continuation. New Sessions record a descriptor containing a full UUIDv7 Session ID, workspace-host identity, host-normalized workspace path, and start time. Each durable Journal envelope atomically carries a recomputable bounded discovery summary with its durable timestamp, binding epoch, and valid-anchor presence; readers use a validated tail summary rather than a full scan or mutable side index. The Journal wins on detected disagreement and continuation revalidates the anchor. The default list and resume picker select the current host and workspace. --all adds other and unknown workspaces and alone displays the workspace column; --details exposes record schema, continuation eligibility, and full path. Legacy unknown-workspace Sessions remain available through --all and direct UUID. UPDATED is the last valid durable-envelope timestamp. Quarantine and summary disagreement override eligibility; otherwise eligible means a supported summary identifies a valid anchor, unavailable means supported evidence proves none, and unknown means bounded evidence is unavailable. It does not promise backend or transport reachability. Unavailable picker entries are dimmed, while direct UUID opens read-only history and may offer an explicit fork. `yo` starts a Session and `yo --continue` fails rather than starting when no eligible current-workspace candidate exists. Stored-session views are durable archival projections, not live-tail merged frontend views. A marker seen with an independently established active writer bounds the snapshot before the guarded append; without an established writer it quarantines the Session. The view never subscribes, writes, repairs, acquires a writer lease, or starts a backend. Executable continuation remains separately gated by the Continuation Anchor.

id: agent.session-002
revision: sha256:6fdab82cf5b838017ce0f85b17a99430da97b42ed9bc5d310a80bf5f69fd9352
payload:
  kind: decision
  content: Stored Session discovery precedes executable continuation. New Sessions record a descriptor containing a full UUIDv7 Session ID, workspace-host identity, host-normalized workspace path, and start time. Every supported physical Session record atomically carries a bounded discovery summary with that descriptor, a writer-assigned updated Unix-millisecond timestamp, an optional binding epoch, and an optional latest valid Continuation Anchor JournalSequence. The timestamp is an envelope fact assigned immediately before append and becomes durable only with that envelope; the other summary fields are recomputable from the committed Journal prefix. Readers validate the last complete envelope through a bounded tail read rather than scanning the complete log or consulting a mutable side index. The Journal wins on detected disagreement and continuation revalidates the referenced anchor. The default list and resume picker select the current host and workspace. --all adds other and unknown workspaces and alone displays the workspace column; --details exposes record schema, continuation eligibility, and full path. A future explicitly supported descriptor-less format would appear with unknown workspace metadata; rejected development formats are not readable Sessions. UPDATED is the last valid envelope's recorded durable timestamp. Quarantine and summary disagreement override eligibility; otherwise eligible means a supported summary identifies a valid anchor, unavailable means supported evidence proves none, and unknown means bounded evidence is unavailable. It does not promise backend or transport reachability. Unavailable picker entries are dimmed, while direct UUID opens supported read-only history and may offer an explicit fork. `yo` starts a Session and `yo --continue` fails rather than starting when no eligible current-workspace candidate exists. The local read-only CLI grammar consists of listing with `yo session [--all] [--details]`, archived inspection with `yo session SESSION_ID [--view chat|transcript|request] [--ascii]`, Transcript-only selectors `--limit N` for positive N and `--content none|preview|full`, and the independent `yo usage SESSION_ID [--ascii]`; Chat is the Session-view default and Usage is not a Session view. `--ascii` changes glyphs only. Both direct-read commands capture one durable point-in-time projection through the local non-creating Session reader and never subscribe, write, repair, acquire a writer lease, create storage, allocate or resume a Session, or start a backend. A missing or unreadable Session and any fatal projection error preserve typed diagnostics on stderr and emit no partial stdout. A marker seen with an independently established active writer bounds the snapshot before the guarded append; without an established writer it quarantines the Session. Executable continuation remains separately gated by the Continuation Anchor.

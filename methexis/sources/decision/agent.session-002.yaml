id: agent.session-002
revision: sha256:a8bc8794a88abaa186895595f4851bbf1f1b58fc6e625e9ba22df3324b8b4b20
payload:
  kind: decision
  content: Stored Session discovery precedes executable continuation. New Sessions record a descriptor containing a full UUIDv7 Session ID, workspace-host identity, host-normalized workspace path, and start time. Every supported physical Session record atomically carries a bounded discovery summary with that descriptor, a writer-assigned updated Unix-millisecond timestamp, an optional binding epoch, and an optional latest valid Continuation Anchor JournalSequence. The timestamp is an envelope fact assigned immediately before append and becomes durable only with that envelope; the other summary fields are recomputable from the committed Journal prefix. Readers validate the last complete envelope through a bounded tail read rather than scanning the complete log or consulting a mutable side index. The Journal wins on detected disagreement and continuation revalidates the referenced anchor. The default list and resume picker select the current host and workspace. --all adds other and unknown workspaces and alone displays the workspace column; --details exposes record schema, continuation eligibility, and full path. A future explicitly supported descriptor-less format would appear with unknown workspace metadata; rejected development formats are not readable Sessions. UPDATED is the last valid envelope's recorded durable timestamp. Quarantine and summary disagreement override eligibility; otherwise eligible means a supported summary identifies a valid anchor, unavailable means supported evidence proves none, and unknown means bounded evidence is unavailable. It does not promise backend or transport reachability. Unavailable picker entries are dimmed, while direct UUID opens supported read-only history and may offer an explicit fork. `yo` starts a Session and `yo --continue` fails rather than starting when no eligible current-workspace candidate exists. Stored-session views are durable archival projections, not live-tail merged frontend views. A marker seen with an independently established active writer bounds the snapshot before the guarded append; without an established writer it quarantines the Session. The view never subscribes, writes, repairs, acquires a writer lease, or starts a backend. Executable continuation remains separately gated by the Continuation Anchor.

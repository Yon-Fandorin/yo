payload:
  kind: decision
  content: The reusable selection panel accepts ordered non-selectable section rows, section-owned non-selectable status rows, and selectable entry rows. Navigation and acceptance skip sections, statuses, and disabled entries. Filtering retains each matching entry's owning section and removes empty sections. A fitted viewport pins the selected entry's owning section when its natural header is outside the window, never duplicates a naturally visible header, and never orphans a following section header. Sections render as regular neutral labels without bold. Only the selected marker and selected primary label use the appearance profile's resolved focus accent without bold; selected detail remains muted. A provider may render a typed current entry inline as Model (current) without a leading separator or separate status column.

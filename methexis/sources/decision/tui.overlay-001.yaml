revision: sha256:65e8ef9fd3132d421a4b6aa1a5c7e1e46f5bb3a54e68f8d0d755645fac0197df
payload:
  kind: decision
  content: >-
    The first reusable overlay presentation component is a pure selectable panel based on Rib's prompt completion panel. It receives validated semantic entries and resolved binding hints, owns selected-identity viewport fitting and presentation, and returns typed navigation outcomes without discovering candidates or executing effects. Entries have unique opaque identities and typed enabled or disabled availability; disabled rows are dimmed, skipped by navigation, and never accepted. A snapshot-level interaction gate independently marks the panel fresh or pending replacement; pending preserves entries, selected identity, and styling while consuming acceptance gestures without a receipt. Unchanged destination geometry keeps the viewport stable, while resize follows normal fitting and hiding rules. Title status is typed as static or activity presentation rather than inferred from text. The full prompt-width muted frame shows a title, current keymap-derived hints, an appearance-resolved selected marker and accent row, optional detail, and hidden counts. Narrow fitting removes detail before grapheme-safe primary truncation, the selected enabled identity remains visible, and insufficient geometry hides the panel atomically.

payload:
  kind: decision
  content: The reusable selection panel accepts ordered non-selectable section rows, section-owned non-selectable status rows, and selectable entry rows. Navigation and acceptance skip sections, statuses, and disabled entries. Filtering retains the owning section for every matching entry and removes empty sections. Sections render as bold labels, statuses as muted text, and a provider may render a typed current entry inline as Model (current) without a leading separator or separate status column.

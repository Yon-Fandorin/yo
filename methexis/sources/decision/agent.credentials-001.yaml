id: agent.credentials-001
revision: sha256:9cc39a8af1abe06d5ae15a1d88b912018c5ed396983b32263fce62c01f2267f9
payload:
  kind: decision
  content: API credentials remain separate and resolve only by exact ProviderId and AccountId. Capture occurs only for effective bindings declaring an external credential requirement; Local Codex needs no file. The store prepares an exact-pair mutation by reserving an independently generated opaque revision before changing bytes, so a private recovery journal can durably bind the planned revision to an operation. Commit uses that prepared expected-and-planned CAS, no-follow regular-file validation, current-user ownership, no group/world permissions, exclusive same-directory mode-0600 temporary creation, durable atomic publication, concurrent-winner re-read, and exact idempotent recognition. Credential revisions may appear only in the private recovery journal and internal store API, never in user-visible outcomes, general logs, Session Journal, audits, or binding evidence. Secrets never enter environment, arguments, diagnostics, journals, review artifacts, or child processes. Interactive setup uses controlling-TTY no-echo input. Non-interactive external connect accepts only a credential-file path paired with explicit yes authorization; it captures one current-user-owned no-follow regular file with owner-only mode, bounded stable bytes, and exact single-terminal-line-ending handling without modifying the source. Reload, failover, keychain, and TenantId are deferred.

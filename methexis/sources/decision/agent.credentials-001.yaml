id: agent.credentials-001
revision: sha256:df2bf50c8cee5491dd7b895385de7463d8a566ccec756b7fe6523a86d776496f
payload:
  kind: decision
  content: API credentials live in a dedicated permission-restricted local file separate from ordinary settings and are resolved by the exact ProviderId and AccountId pair selected by the effective model binding. Provider and Account are credential namespace coordinates only; the credential file does not own endpoint, model, connector, API dialect, or display routing policy. The first process opens the file once with no-follow semantics, admits only a regular-file handle, verifies identity, current-user ownership, permissions, and a metadata-stable bounded read on that exact handle during startup through an injected credential-store boundary. Environment variables are not a credential source, connectors receive only the opaque resolved secret required for their request, and secrets never enter display, diagnostics, debug output, Session Journal records, Request Audit data, command-line arguments, or child-process environments. Tenant selection, refresh, rotation, failover, interactive login, and keychain integration are deferred; a future caller-owned tenant scope remains outside the first credential schema.

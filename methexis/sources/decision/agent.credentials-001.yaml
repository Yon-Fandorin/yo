id: agent.credentials-001
revision: sha256:17ffd481e980ffd3cd0ed5fc79822a4c2a4e5383ed8341b00d192915461bd122
payload:
  kind: decision
  content: >-
    API credentials live in a dedicated permission-restricted local file
    separate from ordinary settings and are resolved by stable AccountId.
    The first process opens it once with no-follow semantics, admits only a
    regular-file handle, verifies identity, current-user ownership, permissions,
    and a metadata-stable bounded
    read on that exact handle during startup through
    an injected credential-store boundary. Environment variables are not a
    credential source, connectors receive only the resolved secret required
    for their request, and secrets never enter display, diagnostics, debug
    output, Session Journal records, or Request Audit data. Tenant account
    management, refresh, rotation, and interactive login are deferred.

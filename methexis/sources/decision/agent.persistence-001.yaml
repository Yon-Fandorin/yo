id: agent.persistence-001
revision: sha256:2b30e95c91540ce3cdda40087841196e60d8fe2f4679c10270c5cbba4b2369a9
payload:
  kind: decision
  content: |-
    The UUIDv7-only, descriptor-aware semantic Session Journal and checksummed physical Session-record envelope remain yo's initial public-format candidates, both named version 1. Before the first public release, this decision replaces the immediately preceding structured-input semantic v1 with one closed anchored-session semantic v1. Every semantic commit requires the exact `format: anchored-session` discriminator, while preserving the existing UUIDv4 SubmissionId, exact UserInput text, and ordered typed workspace and skill reference occurrences. Every persisted command, event, exchange, binding, accepted request, resumable outcome, and Anchor carries a required positive JournalSequence assigned only by the sole semantic writer at commit time. Descriptor and normalized message persistence records structurally omit it. Explicit semantic sequences are Session-unique and strictly increasing but may have gaps where live text updates were normalized into bounded message records; codec, recovery, snapshots, retries, and remote transports never allocate, fill, or renumber them. The monotonic commit cutoff is the semantic boundary covered after the commit and cannot precede an explicit sequence. Every sequence newly introduced by an incremental commit is greater than the preceding cutoff; complete snapshots may only restate the exact sequence values of the prefix they replace. Recovery rebuilds a non-persistent sequence-to-record index and fails closed on duplicate or decreasing sequences, incremental sequences inside the preceding cutoff, backward or undersized cutoffs, and missing or wrong-kind correlation targets. Storage-only ReplaySequence remains a separate internal coordinate for normalized records within semantic payloads, while RepositorySequence orders physical Session-record appends. The replacement adds one general backend_exchange_observed record and exactly five continuation-specific records: backend_binding_opened, backend_binding_closed, backend_request_accepted, backend_resumable_outcome, and continuation_anchor. The general record distinguishes request, response, notification, server request, retry, and terminal outcome by direction, payload schema, correlation JournalSequence, optional backend identity, and Request Audit detail availability without storing payload. A root request, notification, or server request owns one Session-unique UUIDv4 operation ID; StartTurn and SteerTurn requests reuse their SubmissionId, while other roots receive a writer-assigned ID. Correlated responses, retries, and terminal outcomes reuse that ID and follow a closed same-epoch kind-and-direction edge matrix, while notifications remain roots. A binding open records a positive monotonic epoch, backend kind and version, versioned binding, model, and Session-locator identities, and whether it is initial, exact replay, or lossy handoff together with its source Anchor and known cache state. Replacement closes the prior epoch before opening the next; process restart retains an open epoch, native resume verifies its recorded binding identity, and a mismatch must transition epochs before another request is accepted. An accepted request records its open epoch, positive Turn identity, the exact SubmissionId as stable yo operation identity, the matching outbound exchange JournalSequence, and one versioned opaque backend request identity. A completed resumable outcome records its epoch and Turn, references the latest accepted request for that Turn, has exact status completed, and stores a separate versioned outcome identity only when the backend provides one. The writer never invents an outcome identity. Failed and interrupted Turns do not produce an outcome or Anchor. Turn completion, the resumable outcome, and the Continuation Anchor occur in order in one semantic commit. The Anchor refers backward by semantic JournalSequence to the accepted request and outcome, identifies the epoch, and sets its committed boundary to the outcome sequence; its own JournalSequence is projected into physical discovery. Backend kind, payload schema, and identity schemas are non-empty ASCII bounded to 128 bytes; versions and opaque locator or identity values are non-empty UTF-8 bounded to 4096 bytes. The shared codec validates field shape, bounds, ordering, and correlation but never interprets backend-specific values; the selected backend adapter owns that interpretation. Recovery and snapshots preserve and revalidate the complete graph and never synthesize an Anchor from a completed Turn, discovery summary, wire payload, or Request Audit detail. The physical yo.session-record/v1 shape remains unchanged because its CRC32C already binds the exact semantic payload and discovery summary. The previous structured-input and string-input semantic v1 shapes, summary-less physical v1, legacy numeric-v1, semantic v2 through v4, and physical v2 and v3 remain unreadable development data with no migration, dual reader, or compatibility shim. Any further pre-release same-tag replacement requires another explicit SOT decision accepting its data impact; after the first public release, evolution preserves published versions or supplies an explicitly reviewed compatibility or migration contract.

    Before the first public release, the closed anchored-session semantic Journal /v1 is replaced by a second explicitly reviewed /v1 revision. Existing backend correlation records remain payload-free, while a separate bounded model_replay_delta carries exact provider-neutral replay content and is referenced by a completed resumable outcome. Failed outcomes persist a required nullable typed code, replay is admitted only after semantic redaction, and context exhaustion fails explicitly without silent truncation or compaction.


    Before public release, the anchored-session semantic Journal /v1 is explicitly replaced again so every backend binding records exact_replay(local_client or managed_server) or backend_managed_state. Replay deltas and replay_delta_sequence are required only for exact replay and forbidden for backend-managed state; both strategies retain payload-free resumable outcomes and atomic Continuation Anchors.


    Before public release, the continuation-strategy-aware anchored-session semantic Journal /v1 is explicitly extended so a replay message may carry visible content and an optional independent visible refusal. This is an additive extension of the same format generation: every refusal-absent preceding record is also a valid current record, while mixed top-level format discriminators still fail closed. Refusal is valid only for assistant messages. Absence means no refusal; presence requires a non-null UTF-8 JSON string, including the valid empty string, while null and non-string values fail closed. Content and refusal are each bounded over decoded UTF-8 octets before the existing canonical encoded delta and prefix bounds apply. The new reader accepts every preceding record, while a preceding closed-shape reader rejects a new refusal-bearing record. Therefore downgrade remains possible only for Sessions that have not persisted refusal; no migration, dual write, or downgrade shim is provided. The physical envelope and all other semantic records remain unchanged.


    Before public release, the same anchored-session semantic Journal /v1 is additively extended again with replay-profile evidence and one closed provider_private_assistant item. Absent replay_profile remains the preceding semantic-only/v1 form; exact kimi-private-local-plaintext/v1 declares kimi.assistant-message/v1alpha1. That item carries the matching epoch and a closed assistant object with exact assistant role, required reasoning string, required string-or-null content, and optional non-empty ordered function-tool calls. It immediately follows and must project exactly to one generic assistant/function-call group, then replaces that group only in the exact Kimi private-replay wire projection used by admitted K3 and K2.7 Code bindings. The complete encoded item counts inside the existing 16 MiB delta and 64 MiB prefix limits. A source Anchor containing private replay cannot open a different exact-replay binding unless a reviewed lossless converter preserves it; otherwise the transition is lossy_handoff. The physical yo.session-record/v1 envelope, fields, discovery, checksum domain, and checksum preimage remain unchanged because they already bind the exact semantic payload bytes. Current readers accept preceding and extended records in one Session and snapshots preserve both; preceding semantic readers reject the new item or replay-profile field. This asymmetric pre-release downgrade impact is accepted without migration, dual write, omission, or shim.


    Replay-prefix or model-context capacity exhaustion discovered before a final assistant answer is accepted is encoded as a typed failed Turn with no model replay delta, resumable outcome, or Continuation Anchor. Only cumulative replay-application capacity discovered after one complete valid final answer, including its valid declared provider-private extension, may preserve a completed but non-resumable Turn without those continuation records.

    Before public release, anchored-session semantic Journal /v1 is additively extended with one bounded `context_compaction_handoff` record. It identifies the source epoch and Anchor boundary, exact versioned context strategy, input limit and pre/post exact token counts, exact visible summary, retained semantic boundary, dropped provider-private schema/presence/byte count without hidden bytes, and successor epoch. A successful transition atomically commits the old binding close, handoff, and successor lossy-handoff binding open before any successor request; summary failure or another Compact decision commits none of them. Existing history remains immutable. The physical envelope and checksum remain unchanged; the current reader accepts preceding records, while a preceding reader rejects the new record. No migration, dual write, or compatibility shim is provided.

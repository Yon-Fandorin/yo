schema: methexis.source/v1alpha1
id: agent.persistence-001
revision: sha256:f4ca4b7609b98d56467507322bfdbb2127cdeac104429b84c44e4d75a10d43cb
payload:
  kind: decision
  content: "The UUIDv7-only, descriptor-aware semantic Session Journal and checksummed physical Session-record envelope remain yo's initial public-format candidates, both named version 1. Before the first public release, this decision replaces the immediately preceding structured-input semantic v1 with one closed anchored-session semantic v1. Every semantic commit requires the exact `format: anchored-session` discriminator, while preserving the existing UUIDv4 SubmissionId, exact UserInput text, and ordered typed workspace and skill reference occurrences. Every persisted command, event, exchange, binding, accepted request, resumable outcome, and Anchor carries a required positive JournalSequence assigned only by the sole semantic writer at commit time. Descriptor and normalized message persistence records structurally omit it. Explicit semantic sequences are Session-unique and strictly increasing but may have gaps where live text updates were normalized into bounded message records; codec, recovery, snapshots, retries, and remote transports never allocate, fill, or renumber them. The monotonic commit cutoff is the semantic boundary covered after the commit and cannot precede an explicit sequence. Every sequence newly introduced by an incremental commit is greater than the preceding cutoff; complete snapshots may only restate the exact sequence values of the prefix they replace. Recovery rebuilds a non-persistent sequence-to-record index and fails closed on duplicate or decreasing sequences, incremental sequences inside the preceding cutoff, backward or undersized cutoffs, and missing or wrong-kind correlation targets. Storage-only ReplaySequence remains a separate internal coordinate for normalized records within semantic payloads, while RepositorySequence orders physical Session-record appends. The replacement adds one general backend_exchange_observed record and exactly five continuation-specific records: backend_binding_opened, backend_binding_closed, backend_request_accepted, backend_resumable_outcome, and continuation_anchor. The general record distinguishes request, response, notification, server request, retry, and terminal outcome by direction, payload schema, correlation JournalSequence, optional backend identity, and Request Audit detail availability without storing payload. A root request, notification, or server request owns one Session-unique UUIDv4 operation ID; StartTurn and SteerTurn requests reuse their SubmissionId, while other roots receive a writer-assigned ID. Correlated responses, retries, and terminal outcomes reuse that ID and follow a closed same-epoch kind-and-direction edge matrix, while notifications remain roots. A binding open records a positive monotonic epoch, backend kind and version, versioned binding, model, and Session-locator identities, and whether it is initial, exact replay, or lossy handoff together with its source Anchor and known cache state. Replacement closes the prior epoch before opening the next; process restart retains an open epoch, native resume verifies its recorded binding identity, and a mismatch must transition epochs before another request is accepted. An accepted request records its open epoch, positive Turn identity, the exact SubmissionId as stable yo operation identity, the matching outbound exchange JournalSequence, and one versioned opaque backend request identity. A completed resumable outcome records its epoch and Turn, references the latest accepted request for that Turn, has exact status completed, and stores a separate versioned outcome identity only when the backend provides one. The writer never invents an outcome identity. Failed and interrupted Turns do not produce an outcome or Anchor. Turn completion, the resumable outcome, and the Continuation Anchor occur in order in one semantic commit. The Anchor refers backward by semantic JournalSequence to the accepted request and outcome, identifies the epoch, and sets its committed boundary to the outcome sequence; its own JournalSequence is projected into physical discovery. Backend kind, payload schema, and identity schemas are non-empty ASCII bounded to 128 bytes; versions and opaque locator or identity values are non-empty UTF-8 bounded to 4096 bytes. The shared codec validates field shape, bounds, ordering, and correlation but never interprets backend-specific values; the selected backend adapter owns that interpretation. Recovery and snapshots preserve and revalidate the complete graph and never synthesize an Anchor from a completed Turn, discovery summary, wire payload, or Request Audit detail. The physical yo.session-record/v1 shape remains unchanged because its CRC32C already binds the exact semantic payload and discovery summary. The previous structured-input and string-input semantic v1 shapes, summary-less physical v1, legacy numeric-v1, semantic v2 through v4, and physical v2 and v3 remain unreadable development data with no migration, dual reader, or compatibility shim. Any further pre-release same-tag replacement requires another explicit SOT decision accepting its data impact; after the first public release, evolution preserves published versions or supplies an explicitly reviewed compatibility or migration contract.\n\nBefore the first public release, the closed anchored-session semantic Journal /v1 is replaced by a second explicitly reviewed /v1 revision. Existing backend correlation records remain payload-free, while a separate bounded model_replay_delta carries exact provider-neutral replay content and is referenced by a completed resumable outcome. Failed outcomes persist a required nullable typed code, replay is admitted only after semantic redaction, and context exhaustion fails explicitly without silent truncation or compaction.\n\n\nBefore public release, the anchored-session semantic Journal /v1 is explicitly replaced again so every backend binding records exact_replay(local_client or managed_server) or backend_managed_state. Replay deltas and replay_delta_sequence are required only for exact replay and forbidden for backend-managed state; both strategies retain payload-free resumable outcomes and atomic Continuation Anchors.\n\n\nBefore public release, the continuation-strategy-aware anchored-session semantic Journal /v1 is explicitly extended so a replay message may carry visible content and an optional independent visible refusal. This is an additive extension of the same format generation: every refusal-absent preceding record is also a valid current record, while mixed top-level format discriminators still fail closed. Refusal is valid only for assistant messages. Absence means no refusal; presence requires a non-null UTF-8 JSON string, including the valid empty string, while null and non-string values fail closed. Content and refusal are each bounded over decoded UTF-8 octets before the existing canonical encoded delta and prefix bounds apply. The new reader accepts every preceding record, while a preceding closed-shape reader rejects a new refusal-bearing record. Therefore downgrade remains possible only for Sessions that have not persisted refusal; no migration, dual write, or downgrade shim is provided. The physical envelope and all other semantic records remain unchanged.\n\n\nBefore public release, the same anchored-session semantic Journal /v1 is additively extended again with replay-profile evidence and one closed provider_private_assistant item. Absent replay_profile remains the preceding semantic-only/v1 form; exact kimi-private-local-plaintext/v1 declares kimi.assistant-message/v1alpha1. That item carries the matching epoch and a closed assistant object with exact assistant role, required reasoning string, required string-or-null content, and optional non-empty ordered function-tool calls. It immediately follows and must project exactly to one generic assistant/function-call group, then replaces that group only in the exact Kimi private-replay wire projection used by admitted K3 and K2.7 Code bindings. The complete encoded item counts inside the existing 16 MiB delta and 64 MiB prefix limits. A source Anchor containing private replay cannot open a different exact-replay binding unless a reviewed lossless converter preserves it; otherwise the transition is lossy_handoff. The physical yo.session-record/v1 envelope, fields, discovery, checksum domain, and checksum preimage remain unchanged because they already bind the exact semantic payload bytes. Current readers accept preceding and extended records in one Session and snapshots preserve both; preceding semantic readers reject the new item or replay-profile field. This asymmetric pre-release downgrade impact is accepted without migration, dual write, omission, or shim.\n\n\nReplay-prefix or model-context capacity exhaustion discovered before a final assistant answer is accepted is encoded as a typed failed Turn with no model replay delta, resumable outcome, or Continuation Anchor. Only cumulative replay-application capacity discovered after one complete valid final answer, including its valid declared provider-private extension, may preserve a completed but non-resumable Turn without those continuation records.\n\nBefore public release, the unimplemented `context_compaction_handoff` proposal is replaced by closed `context_policy_changed` and `context_checkpoint` records. Policy revision starts at 1 before the first accepted request, increments by one, and freezes enabled state, the two exact strategies, ordered warning/trigger integer domains, and portable-only retained-raw bounds. Accepted requests, replay deltas, resumable outcomes, and Anchors gain required context_epoch fields. Context epoch starts at 1, is Session-global, is inherited unchanged by later bindings, and advances by exactly one only when the sole writer atomically commits a valid same-binding checkpoint. The checkpoint's closed fields bind exact source Anchor and boundary, previous/successor epochs, current policy revision and strategy, input limit and counts, the exact system/tools replay contract, a bounded portable body, retained groups with exact inline replay items and provenance-only JournalSequence ranges, operator-disclosure-only content-addressed receipts, closed loss variants, and the exact summary usage receipt. Receipts and placeholders never enter replay. It emits no binding close/open, cache inference, replay receipt variant, artifact-read tool, expiry, path, or cross-Session authority. Success reconstructs model input as one synthetic user message plus the exact inline retained-group items; private replay may be disclosed and dropped only from the summarized prefix, while retained private groups remain exact and indivisible across a same-binding context-epoch increment because their binding epoch is unchanged. An active-Turn checkpoint may occur only between complete correlated semantic groups and before the next accepted request. The newest checkpoint is the reconstruction root and its source Anchor is provenance; recovery then applies successor-epoch deltas through the newest matching Anchor, measures replay bounds against that reconstructed context, preserves historical prior-epoch records, and rejects only late superseded-epoch records, gaps, duplicates, regressions, direct cross-binding checkpoint application, and cross-boundary replay. A Turn that spans a checkpoint completes with one terminal successor-epoch replay delta containing only the model-visible suffix committed after the newest checkpoint; that delta omits the already checkpointed replay contract, synthetic body, and retained groups, while its outcome and Anchor reference the latest accepted request in that epoch. Earlier requests in the Turn remain valid historical records in their original epochs. A replacement binding seeds from a successor Anchor whose lineage includes the checkpoint, or directly from a checkpoint with no later accepted request through an exclusive `source_checkpoint_sequence`; it never reuses the pre-checkpoint provenance Anchor as raw replay. A checkpoint with no later accepted request remains resumable; a later accepted request without a completed Anchor stays uncertain and read-only. Failure commits no checkpoint. The physical envelope and checksum remain unchanged. The current reader rejects the displaced handoff and mixed graphs; a preceding reader rejects the new record or fields. Existing history without the displaced record stays byte-identical; no migration, dual write, downgrade, or shim exists.\n\nBefore public release, the same anchored-session semantic Journal /v1 is additively extended with exact transition mode backend_native_model_rebind. It may seed a successor backend-managed-state epoch only from the same delegated Host and verified authenticated account after the adapter creates a distinct state-preserving native-fork locator, applies the selected exact Host model solely through a live advertised mutation capability on that candidate, and confirms the candidate's exact binding, model, and locator identities. The source epoch remains open and executable throughout preparation. Atomic publication alone closes it and opens the successor; unsupported capability, stale inventory, account drift, a reused locator, missing or mismatched confirmation, or publication failure leaves the source epoch and locator unchanged while the unbound candidate is discarded or quarantined. The transition records cache unknown and never claims semantic replay, cache restoration, cross-account portability, or applicability to a different Host. It names the newest source Anchor when the source epoch has accepted work; omission is valid only for a live source epoch with no accepted backend request, and a source checkpoint is forbidden. Existing records remain byte-identical and readable, while preceding readers reject the new transition value; there is no migration, dual write, downgrade shim, or private host mutation fallback.\n\nThe existing semantic and physical v1 envelopes are additively extended with nested yo.structured-input/v2 for host-resolved StartTurn and SteerTurn only. Frozen v1 inputs and their model text remain unchanged. The closed v2 object adds one exact required instruction snapshot of at most 262144 UTF-8 bytes tied to its sole selected skill. The canonical Knowledge freezes body validation and model framing, separates visible text from user-role model input, and requires identical request, token-accounting and native-replay content without asset reads during recovery. Activity responses remain v1. Live callers cannot supply pre-resolved snapshots; the execution host validates all references before resolving the same selected entry atomically. Old readers reject v2 without migration, downgrade or data reset.\n\n## Initial child-fork seed profile\n\nBefore public release, the existing semantic Journal envelope is additively\nextended by the closed sequenced record `initial_fork_seed` with profile\n`yo.session-fork-seed/v1`. Existing non-fork record and envelope bytes remain unchanged. Fork continuation\nhints use the explicit checksummed discovery extension specified below. A preceding reader MUST reject this unknown record or\ninitial-binding mode; there is no migration, dual write, downgrade, implicit\nempty-child fallback or deletion of existing data.\n\nThe record has exactly `type`, `journal_sequence`, `profile`,\n`parent_session_id`, `source`, `seed`, and `history`. The child SessionId is the\ncontaining descriptor's UUIDv7 and MUST differ from `parent_session_id`. There\nis exactly one fork seed, in the child's initial atomic bootstrap, before its\nfirst binding and before any accepted child request. Root Sessions omit this\nrecord. Its presence with no valid first binding, or a first fork binding with\nno valid seed, is non-executable corruption rather than a normal empty Session.\n\n`source` is a closed tagged union. `empty` contains only `kind: empty` and\nproves only that an explicitly confirmed empty fork was requested. `anchor`,\n`checkpoint` and `initial_fork` contain `kind`, `binding_epoch`,\n`context_epoch`, `record_sequence`, `journal_boundary`, and `binding`. All\nepochs/sequences are positive integers qualified by `parent_session_id`. For an\nanchor, `journal_boundary` equals that Anchor's existing resumable-outcome\nboundary, which precedes its own `record_sequence`. For a checkpoint-only\nsource, `journal_boundary` equals the checkpoint record sequence and\n`context_epoch` is its successor context epoch. The captured durable cutoff\nMUST cover the source record itself in every case. For `initial_fork`,\n`record_sequence` names the immediate parent's complete initial seed,\n`journal_boundary` is the complete durable cutoff of the selected\nreconstruction, and the binding/context epochs name its effective owner at that\npoint. Recovery validates the initial bootstrap and any subsequent exact\nownership-mapping transitions; a parent epoch is never equated with the new\nchild epoch. `binding` freezes the source backend kind/version, binding\nidentity, model identity, continuation strategy, replay profile, and locator\nusing their existing validated bounded wire encodings. An anchor names the\nexact valid parent Anchor; a checkpoint names the valid checkpoint effective at\nthe selected complete point, with no uncertain accepted request within that\nreconstruction. An `initial_fork` source names a valid non-empty parent initial\nseed with no later accepted request within the selected reconstruction,\nincluding its verified effective binding derived from that seed. It is not an\nempty source or the grandparent provenance Anchor. Construction validates these\nvalues against one captured parent reconstruction. An older selected\nreconstruction is admitted only by the explicit historical selection rules in\nthe continuation-lineage contract; selecting it does not make the parent's\nlater uncertain state executable. The selected logical cutoff and effective\nownership MUST remain bound to that frozen validated capture; a raw source\nsequence is not an immutable selection. Recovery consumes child-owned inline\nbytes and MUST NOT fetch or revalidate the parent by path or by bare sequence.\n\nA non-empty `initial_fork` source may seed either an exact-replay child or a\nnative child with verified exact-boundary evidence. The child must persist the\ncomplete selected reconstruction; unchanged private payloads and ultimate origin\ncoordinates follow the same lossless import rules. Repeated seed-only forks\nare validated and flattened without ancestor reads. A child initialized by an\nempty fork has no inherited context to reproduce; forking it is an explicitly\nconfirmed empty fork, not fabricated non-empty reconstruction. Tests must fork\nan exact seed-only child again before any accepted request, delete both ancestors,\nand recover byte-identical model input from the newest child.\n\n`seed` is a closed tagged union:\n\n- `empty` contains only `kind: empty`; source and history MUST also be empty.\n- `exact_replay` contains `kind`, `contract`, ordered `items`, `item_origins`,\n  and `groups`, using the\n  existing lossless model-replay encodings. It freezes the complete reconstructed\n  context, not merely the most recent delta. The existing 4096-item, per-item,\n  1MiB contract and 64MiB complete-prefix bounds apply. Required provider-private items retain exact payload\n  bytes. Their source qualification and validated child ownership are carried\n  separately by the lossless import mapping below.\n- `backend_native` contains `kind`, `source_boundary_evidence`, and\n  `candidate_binding`. The boundary evidence is a bounded versioned identity\n  whose supported schema asserts the exact source coordinate named above; an\n  unknown schema cannot confer continuation authority. Candidate binding uses\n  the existing validated binding fields and MUST match the first child binding,\n  same verified account and host, exact target model and distinct locator.\n  No semantic replay items, cache-restoration claim, or source-locator reuse is\n  permitted in this variant.\n\n`history` is an ordered array of at most 4096 source-qualified entries and at\nmost 16MiB of encoded JSON. An entry contains exactly `source_session_id`,\n`source_coordinate`, and `record`. `source_coordinate` is a closed union:\n`{kind: journal, sequence}` for a sequenced semantic record, or\n`{kind: message, activity_id, part, ordinal}` for a snapshot-normalized message\nrecord without its own JournalSequence. `activity_id` uses the existing bounded\nActivityRef encoding qualified by the source Session; `part` is `reset`,\n`segment`, or `ended`; `ordinal` is the zero-based occurrence index of that part\nin the captured normalized source message. This coordinate is archival only,\nnot a new source JournalSequence or a child admission identity.\n\nThe exact allowed record tags are `command_committed`, `event_committed`,\n`message_reset`, `message_segment`, and `message_ended`. Allowed commands are\n`start_turn`, `steer_turn`, `interrupt_turn`, and `respond_to_activity`, preserving\ntheir existing closed input/response wire variants. Allowed events are\n`session_created`, `turn_started`, `activity_started`, `activity_updated`,\n`activity_finished`, and `turn_finished`. Message records preserve their existing\nclosed reset, segment and ended encodings, including final-segment presence.\nAll other record/command/event tags are forbidden here, in particular descriptor,\nbackend exchange/request/outcome/correlation, binding, replay delta, context\npolicy/checkpoint, fork seed, Request Audit, usage receipt, usage aggregate, and\ncompaction command records. Visible activity text may contain an inert usage\nnotice; it never contributes to child usage accounting.\n\nConstruction first takes the parent's already validated inherited-history array\nverbatim, then appends only the parent's own allowed archival records in the\nnormalizer's stable source order through the selected reconstruction boundary.\nFor an Anchor this includes eligible message normalization through its committed\noutcome boundary; for a checkpoint-only source it includes only committed\narchival material at or before the checkpoint record. No later complete record,\nuncommitted segment, pending submission, or accepted uncertain suffix is copied.\nAt repeated forks ultimate source qualifiers remain unchanged; only new parent\nrecords are appended. There is no merge by timestamp, filename, activity number\nalone, or child sequence. Duplicate composite source coordinates are rejected,\nnot silently deduplicated. Sequenced coordinates increase strictly within each\nsource; normalized message parts retain their source order and message terminal\ninvariants. Embedded Session/activity identities and sequenced record numbers\nMUST agree with their qualifiers. Bounds apply after this complete flattening.\n\nHistory records are interpreted only by an isolated archived transcript\nprojection and never enter child command/event recovery, request, usage,\nreplay, input admission, or Anchor correlation. Input v2 snapshots remain exact\narchival bytes and trigger no asset reads. The first excess unit rejects the\nfork; no inherited visible history or required model context is silently dropped.\nThe complete seed is additionally subject to existing commit/envelope bounds.\n\n### Lossless import ownership and retained groups\n\n`exact_replay` additionally requires `item_origins` and `groups`.\n`item_origins` has exactly one entry per ordered item. An origin entry contains\nexactly `original`, `imported_from`, and `source_binding`. `original` contains\n`session_id`, `binding_epoch`, `context_epoch`, `record_sequence`, and\n`item_index`; it identifies the record that first produced that exact item.\n`imported_from` has the same fields and identifies the immediate parent's\nvalidated delta, checkpoint retained group, or initial seed location used for\nthis fork. Both source records are qualified by SessionId; `item_index` is a\nzero-based index into that record's ordered reconstructed items. `source_binding`\nfreezes the original item's exact binding identity, model identity, and replay\nprofile. Every field is bounded by the existing identity/value domains; origin\narrays are subject to the same 4096-item and whole-record bounds as `items`.\nOrigins are correlation metadata only and never become model-visible input.\n\nEach group has exactly `first_item` and `end_item`, defining a nonempty half-open\nrange in `items`. Groups form an ordered gap-free nonoverlapping partition and\nretain the existing complete semantic-group rules, including tool-call/result\nand required private-item association. Source policy or system/tool contract\nis not manufactured as a new source user command. An item synthesized by a\nsource checkpoint uses that checkpoint's Session/epoch/sequence as its original\ncoordinate. Creation checks origins, group boundaries and exact bytes against\nthe captured source reconstruction before publishing the child.\n\nThe import is an explicit, validated lossless ownership mapping: item payload\nbytes and ultimate `original` qualification never change, while the child\nowns the imported baseline under its initial binding epoch 1 and context epoch\n1. Source epochs are not fed into the child's existing equality checks. During\nrecovery, fork import validation first establishes the source/target exact\nbinding and replay-profile match, then registers the imported groups as the\nchild binding's initial baseline. Only that registered baseline may enter the\nchild replay accumulator. Ordinary child deltas retain their existing epoch\nand accepted-request checks and contain only newly accepted child items, never\ncopies of the inherited baseline. No synthetic child request or Anchor is\ncreated to satisfy an epoch validator.\n\nA checkpoint's `retained_groups` remains an ordered array admitting either its\nunchanged local group shape `{first_sequence,last_sequence,items}` or the new\nclosed import group shape `{profile,fork_seed_sequence,group_index,items}`.\nThe latter profile is exactly `yo.fork-retained-group/v1`; its seed sequence is\na real earlier child JournalSequence and its zero-based group index selects one\ncomplete immutable group from that child's seed. `items` MUST equal that entire\nseed group byte-for-byte, with origins resolved from the same seed. Missing\nseeds, split groups, duplicate group indexes, changed payloads or wrong-profile\nreferences fail closed. Imported groups precede locally produced groups;\nimport indexes increase strictly, and local ranges retain their existing\nstrict range ordering. `first_retained_sequence`, when present, is the child\nseed sequence if the first retained group is imported, otherwise the first\nlocal sequence. Comparing two imported groups uses seed sequence plus group\nindex rather than rejecting their shared seed sequence as a duplicate range.\nThese changes do not relax ordinary local-group correlation or epoch checks.\n\nCheckpoint construction and recovery validate import groups against their\ncurrent effective child owner epoch and exact binding/profile. That owner is\nderived from the child initial-fork record and any subsequently verified exact\nbinding-transition seed, never from a parent epoch or an unchecked metadata\nnumber. Context-epoch advancement preserves the registered import and original\nbytes for retained groups. Imported groups summarized out of context follow the\nexisting explicitly disclosed summary/private-loss rules; they are not later\nrestored from archival history. Retained private groups remain exact and\nindivisible. A subsequent exact binding replacement must carry the registered\norigins and import references with the reconstructed context and verify the\nsame effective identity/profile before assigning its new owner epoch. An\nincompatible target still requires the separately authorized lossy-handoff\npath; it cannot suppress, relabel or silently drop imported private items.\n\nForking a child flattens its current reconstructed context. Existing ultimate\n`original` coordinates and all item bytes are retained; `imported_from` is\nrebound to the immediate parent's authoritative source location, and the new\nchild receives its own validated epoch-1 import. Old fork records are not\nrecursively nested, nor are original qualifications replaced by the immediate\nparent's UUID. New child-local items acquire their own original coordinates.\nA complete child snapshot retains the seed and any import metadata required by\nits current checkpoint/transition graph. Parent and grandparent repositories\nare never recovery dependencies. Tests MUST cover source epoch 3 into child\nepoch 1, a second-generation fork, retained-private checkpoint recovery, an\nexact-compatible replacement, incompatible model/private-profile rejection,\nand deletion of every ancestor while the child reconstructs identical input.\n\nAn `exact_replay` replacement may instead use the positive\n`source_initial_fork_sequence`, mutually exclusive with\n`source_anchor_sequence` and `source_checkpoint_sequence`. This coordinate\nnames the complete initial exact seed in the same child Session, and is valid\nonly while that seed remains the current reconstruction root with no intervening\naccepted child request or checkpoint. Recovery MUST verify the complete chain\nfrom the initial child binding through every exact replacement to the immediately\npreceding closed source epoch; the seed's epoch-1 origin does not substitute for\nthat current source owner. The replacement preserves the exact replay contract,\ncompatible effective binding identity and private profile, ordered item bytes,\nregistered origins, and import references. Its transition seed transfers those\nsame validated imports to the newly opened owner epoch without changing their\noriginal coordinates or payloads. Missing chain links, stale source owners,\nwrong-Session or wrong-kind seeds, changed imports, incompatible private profiles,\nand any intervening accepted request or checkpoint reject this source path.\n`initial`, `initial_fork`, `lossy_handoff`, and `backend_native_model_rebind`\nforbid `source_initial_fork_sequence`; this adds no lossy source eligibility.\nTests MUST cover two consecutive seed-only exact replacements followed by\nrestart and another child fork, preserving exact items and origins after deleting\nall ancestor repositories, and reject each invalid source condition above.\n\nThe first `backend_binding_opened` uses a new closed `initial_fork` transition\nwith exactly `mode` and `fork_seed_sequence`. It requires epoch 1 and an earlier\nseed in the same initial child commit. Existing prior-epoch close requirements\nremain unchanged for replacement transitions, and no parent epoch is counted\nas a prior child epoch. Initial child context epoch is 1; inherited source\ncontext epochs are provenance. A complete initial exact seed is a reconstruction\nroot before the first child accepted request, just as a complete checkpoint may\nbe a root without a later Anchor. Child replay appends only newly accepted child\ndeltas to that seed and respects subsequent child checkpoints. An uncertain\naccepted suffix remains read-only and is never resent.\n\nThe first publication stores the descriptor, seed, first binding and any\nrequired initial context policy together. A complete snapshot preserves their\nexact child JournalSequences and bytes. Duplicates, late seeds, wrong-source\nkinds, reused native locators, candidate/initial-binding disagreement,\nsource-private incompatibility, malformed inline replay or incomplete bootstrap\nfail closed. Parent disappearance after complete publication does not prevent\nmanaged replay or archival inherited-history display; a missing native backend\nlocator retains the existing explicit continuation-failure behavior.\n\n### Bounded discovery checksum extension\n\nThe existing closed discovery object MAY contain\n`initial_fork_seed_journal_sequence` as a positive integer; explicit null, zero,\nunknown fields and noncanonical values are rejected. Omission retains exactly\nthe frozen legacy fields and checksum preimage. Presence appends two fields to\nthe end of the existing discovery checksum preimage: the UTF-8 bytes\n`yo.initial-fork-discovery/v1`, then the sequence as eight-byte big-endian u64.\nBoth use the existing length-prefixed `append_field` encoding. The envelope and\nchecksum schema labels remain their existing v1 values before public release;\npreceding closed readers reject the additional field. No omitted-field marker\nis appended for a legacy record, preserving its exact checksum bytes.\n\nThe hint is emitted only for a fully published executable initial child seed\nwith no later accepted child request; later appends recompute and omit it when\nthat condition ceases to hold. It is not parent lineage or a synthetic Anchor.\nReaders recompute it against semantic state during executable recovery and fail\nclosed on disagreement. The history-discovery contract defines eligibility and\nlegacy unknown classification; no full-log scan is added to listing. Tree\nviewing still needs a separately bounded parent-provenance projection and is\nnot completed merely by this continuation hint.\n\n## Immutable input-image persistence extension\n\nThe image-input extension is additive inside the existing semantic and physical\nJournal envelopes. Existing `yo.structured-input/v1` and `/v2`, string-content\nreplay messages and `yo.context-checkpoint/v1alpha1` retain their exact closed\nshapes, bytes and meanings. A preceding reader rejects the new input, replay\nvariant or checkpoint profile rather than omitting image data. No migration,\ndual write, automatic downgrade, re-normalization or empty-input fallback is\nprovided. This extension changes no global physical journal-line limit.\n\nAn image-bearing StartTurn or SteerTurn uses `yo.structured-input/v3` under\nthe input owner's closed occurrence grammar. Its model replay is the new closed\nitem `{kind: multimodal_user, parts}`, preserving legacy `message.content` as a\nstring. Ordered parts are exactly `{type: text, text}` or\n`{type: image, snapshot}`. The snapshot has exactly `profile` with value\n`yo.input-image-rgba8-triangle/v1`, `mime_type` with value `image/png`, `width`,\n`height`, `byte_length`, `sha256`, and `data_base64`, using the coordinated\ninput wire profile's closed encoding. It binds the same admitted immutable PNG\nbytes across the structured input and model replay; source display metadata\nis not part of this snapshot. Input images are user message parts only in this\nextension; assistant refusals, function calls,\nfunction results and provider-private items keep their existing closed shapes.\nAt most 16 image occurrences and 33 ordered text/image parts are permitted per\nsource input and its replay message. Empty text spans are omitted. Duplicate\nimage bytes at distinct positions remain distinct occurrences. Exact skill\nframing is appended to the final text part, or becomes one new final text part\nwhen the input ends with an image; it never crosses a later image to modify an\nearlier span. Old text-only input framing is unchanged.\n\nEvery snapshot is at most 9 MiB of canonical PNG; their sum per input is also\nat most 9 MiB, charged per occurrence. Transmitted dimensions are positive, at\nmost 2048 per side and at most 2,097,152 pixels together. These are admitted\nsnapshot bounds, not the distinct compressed-source/decode bounds. New structured\ninput remains bounded by 16 MiB of complete canonical JSON. A complete replay\ndelta remains bounded by 16 MiB, and the reconstructed replay prefix remains\nbounded by 64 MiB and 4096 items. JSON escaping, base64 expansion, skill text,\nframing and all other items count toward the applicable complete encoded bound;\nper-image validity never bypasses whole-container admission. The writer checks\nthe first excess occurrence or encoded byte before retaining it. A malformed,\nunknown-profile, hash/length/dimension-inconsistent or over-budget snapshot\nrejects the whole container before its semantic commit, never just one part.\n\nQueue/dequeue, snapshots, journal recovery, retained checkpoint groups, exact\nbinding replacement and initial child seeds preserve the admitted bytes and\nordered roles/parts. No path, source EXIF, original file, skill catalog, provider\nresponse, thumbnail or new normalization result can substitute for those bytes.\nOriginal filename, format, dimensions and source digest may exist only as\nnon-model-visible input display metadata under the input owner's closed bounds;\nfilesystem paths and source EXIF are excluded from retained image snapshots.\nA display thumbnail is derived presentation, not model or replay authority.\n\n### Image-aware checkpoint and loss profile\n\nThe new exact `yo.context-checkpoint/v2alpha1` profile retains the existing\ncheckpoint field, group, graph, epoch, source, policy, usage and commit rules,\nexcept for the explicitly replaced accounting fields and added loss variant\nbelow. It MUST omit `input_tokens_before` and `input_tokens_after` and instead\nrequire `accounting_before` and `accounting_after`. Each is a closed object\ncontaining exactly `quality`, `policy`, `input_estimate`, and `reserve_tokens`.\nQuality is exactly `exact`, `verified_upper_bound`, or `advisory_estimate`;\npolicy is the selected model-service's admitted versioned accounting identity;\nthe two counts are unsigned 64-bit JSON integers and their sum must not overflow.\nUnknown policy, incompatible quality or unavailable policy evidence rejects the\ncheckpoint. Both objects describe the complete requests on their respective\nsides under the same selected binding and accounting policy, including the final\nselected output cap in their tokenization projections. Counts and reserve remain\nseparate; policy planning uses their checked sum. Legacy scalar fields never\nacquire advisory meaning. The summary's measured usage remains solely in the\nunchanged `summary_usage` receipt, not in either planning count.\n\nOnly this new profile additionally admits the closed loss object with exactly\n`kind: image_input_summarized`, `content_hash`, `byte_count`, `width`, `height`,\n`source_context_epoch`, and `source`. Content hash is exactly `sha256:` followed\nby 64 lowercase hexadecimal digits and names the admitted PNG bytes; byte count\nis positive and at most 9 MiB, and dimensions obey the normalized snapshot\nbounds above. Source epoch is a positive unsigned 64-bit integer. `source` is\none of these closed objects, with no optional or unknown fields:\n\n- `{kind: replay_delta, sequence, item_index, part_index}`;\n- `{kind: retained_checkpoint, sequence, group_index, item_index, part_index}`;\n- `{kind: initial_fork_seed, sequence, group_index, item_index, part_index}`.\n\nEvery sequence is a positive unsigned 64-bit JournalSequence naming a validated\nauthoritative record in the current Session. For `replay_delta`, `item_index`\nindexes that record's inline replay items. For `retained_checkpoint`, group and\nitem index select its retained group and that group's inline items. For\n`initial_fork_seed`, group index selects the seed's immutable group partition\nand item index is local to that group's half-open item range. Indices are\nunsigned 32-bit integers inside their actual bounded arrays, whose item/group\ncounts cannot exceed 4096. Part index is zero-based across all ordered text and\nimage parts of the selected source message, within its at-most-33-part domain;\nit MUST identify an image. Source context epoch is the effective epoch\nestablished by the named local record, not automatically this checkpoint's\nprevious epoch. A retained old occurrence does not acquire a later epoch merely\nbecause it is summarized. Ultimate ancestor qualifications remain separate fork\nprovenance and MUST NOT replace this local source coordinate.\n\nThe image losses, considered in their order in `losses`, MUST equal the exact\nordered image occurrence set of the summarized source: exactly one per\noccurrence, with no missing, extra, duplicate or retained occurrence. The source\ncoordinate and hash/length/dimensions MUST match that occurrence in the validated\nsource reconstruction. Equal image bytes at distinct coordinates require\nseparate entries. The runtime derives this evidence before dispatch/commit; the\nmodel never authors source coordinates or loss receipts. The complete canonical\nJSON array of image-loss entries is at most 64 KiB and contains at most 64\nentries; check the first excess entry and encoded byte. Existing other loss\nvariants and their bounds remain unchanged. Image bytes, filenames, paths and\nunbounded diagnostics are not loss fields.\n\nThe checkpoint's raw-artifact prohibition gains only the narrow exception for\nvalidated admitted input-image snapshots inside exact inline retained groups.\nThis exception admits neither raw output artifacts nor image bytes in portable\nprose, receipt/loss objects, arbitrary files or new retrieval authority. Mandatory\nprotected semantic groups keep all their image occurrences intact. Summarized\nimages leave successor replay only with their whole summarized groups and the\nvalidated image-loss entries, while original journal bytes remain unchanged.\nThe 64-MiB bound applies to the reconstructed portable body plus retained replay\nand successor deltas; it is not a complete checkpoint or physical-line cap.\n\nRecovery validates both legacy and new profiles without changing an existing\nrecord's shape or accounting meaning. Missing accounting quality/policy, malformed\nimage mapping, inconsistent hash or budget excess rejects according to the\nexisting pipeline stage before dispatch or checkpoint commit. Checkpoint failure\npreserves the prior authoritative context and epoch; no silent image removal,\nnew Anchor or partial checkpoint is permitted. Image-containing v3 input occurrences and their inherited archival UserInput retain bounded host-observed source_byte_length outside neutral replay snapshots. Checkpoint format follows its owning binding epoch accounting profile: an image-profile binding always uses v2alpha1 including zero-image requests and after images are summarized away; recovery rejects a legacy scalar checkpoint under that binding, preserves older valid checkpoints under their original binding epochs, and recounts a rebuilt request under a changed binding without relabeling old evidence. The new v3 occurrence, multimodal_user replay, canonical PNG snapshot, image-loss and pressure forms are closed and reject unknown, duplicate, null or noncanonical fields under their exact bounded domains; image losses append in source order without reordering existing loss entries."

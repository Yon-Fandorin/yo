schema: methexis.source/v1alpha1
id: agent.persistence-001
revision: sha256:8da60416212c5f52fe5c9be856534dcadbe06311e760372020cbf2393ee06885
payload:
  kind: decision
  content: |-
    The UUIDv7-only, descriptor-aware semantic Session Journal and checksummed physical Session-record envelope remain yo's initial public-format candidates, both named version 1. Before the first public release, this decision replaces the immediately preceding structured-input semantic v1 with one closed anchored-session semantic v1. Every semantic commit requires the exact `format: anchored-session` discriminator, while preserving the existing UUIDv4 SubmissionId, exact UserInput text, and ordered typed workspace and skill reference occurrences. Every persisted command, event, exchange, binding, accepted request, resumable outcome, and Anchor carries a required positive JournalSequence assigned only by the sole semantic writer at commit time. Descriptor and normalized message persistence records structurally omit it. Explicit semantic sequences are Session-unique and strictly increasing but may have gaps where live text updates were normalized into bounded message records; codec, recovery, snapshots, retries, and remote transports never allocate, fill, or renumber them. The monotonic commit cutoff is the semantic boundary covered after the commit and cannot precede an explicit sequence. Every sequence newly introduced by an incremental commit is greater than the preceding cutoff; complete snapshots may only restate the exact sequence values of the prefix they replace. Recovery rebuilds a non-persistent sequence-to-record index and fails closed on duplicate or decreasing sequences, incremental sequences inside the preceding cutoff, backward or undersized cutoffs, and missing or wrong-kind correlation targets. Storage-only ReplaySequence remains a separate internal coordinate for normalized records within semantic payloads, while RepositorySequence orders physical Session-record appends. The replacement adds one general backend_exchange_observed record and exactly five continuation-specific records: backend_binding_opened, backend_binding_closed, backend_request_accepted, backend_resumable_outcome, and continuation_anchor. The general record distinguishes request, response, notification, server request, retry, and terminal outcome by direction, payload schema, correlation JournalSequence, optional backend identity, and Request Audit detail availability without storing payload. A root request, notification, or server request owns one Session-unique UUIDv4 operation ID; StartTurn and SteerTurn requests reuse their SubmissionId, while other roots receive a writer-assigned ID. Correlated responses, retries, and terminal outcomes reuse that ID and follow a closed same-epoch kind-and-direction edge matrix, while notifications remain roots. A binding open records a positive monotonic epoch, backend kind and version, versioned binding, model, and Session-locator identities, and whether it is initial, exact replay, or lossy handoff together with its source Anchor and known cache state. Replacement closes the prior epoch before opening the next; process restart retains an open epoch, native resume verifies its recorded binding identity, and a mismatch must transition epochs before another request is accepted. An accepted request records its open epoch, positive Turn identity, the exact SubmissionId as stable yo operation identity, the matching outbound exchange JournalSequence, and one versioned opaque backend request identity. A completed resumable outcome records its epoch and Turn, references the latest accepted request for that Turn, has exact status completed, and stores a separate versioned outcome identity only when the backend provides one. The writer never invents an outcome identity. Failed and interrupted Turns do not produce an outcome or Anchor. Turn completion, the resumable outcome, and the Continuation Anchor occur in order in one semantic commit. The Anchor refers backward by semantic JournalSequence to the accepted request and outcome, identifies the epoch, and sets its committed boundary to the outcome sequence; its own JournalSequence is projected into physical discovery. Backend kind, payload schema, and identity schemas are non-empty ASCII bounded to 128 bytes; versions and opaque locator or identity values are non-empty UTF-8 bounded to 4096 bytes. The shared codec validates field shape, bounds, ordering, and correlation but never interprets backend-specific values; the selected backend adapter owns that interpretation. Recovery and snapshots preserve and revalidate the complete graph and never synthesize an Anchor from a completed Turn, discovery summary, wire payload, or Request Audit detail. The physical yo.session-record/v1 shape remains unchanged because its CRC32C already binds the exact semantic payload and discovery summary. The previous structured-input and string-input semantic v1 shapes, summary-less physical v1, legacy numeric-v1, semantic v2 through v4, and physical v2 and v3 remain unreadable development data with no migration, dual reader, or compatibility shim. Any further pre-release same-tag replacement requires another explicit SOT decision accepting its data impact; after the first public release, evolution preserves published versions or supplies an explicitly reviewed compatibility or migration contract.

    Before the first public release, the closed anchored-session semantic Journal /v1 is replaced by a second explicitly reviewed /v1 revision. Existing backend correlation records remain payload-free, while a separate bounded model_replay_delta carries exact provider-neutral replay content and is referenced by a completed resumable outcome. Failed outcomes persist a required nullable typed code, replay is admitted only after semantic redaction, and context exhaustion fails explicitly without silent truncation or compaction.


    Before public release, the anchored-session semantic Journal /v1 is explicitly replaced again so every backend binding records exact_replay(local_client or managed_server) or backend_managed_state. Replay deltas and replay_delta_sequence are required only for exact replay and forbidden for backend-managed state; both strategies retain payload-free resumable outcomes and atomic Continuation Anchors.


    Before public release, the continuation-strategy-aware anchored-session semantic Journal /v1 is explicitly extended so a replay message may carry visible content and an optional independent visible refusal. This is an additive extension of the same format generation: every refusal-absent preceding record is also a valid current record, while mixed top-level format discriminators still fail closed. Refusal is valid only for assistant messages. Absence means no refusal; presence requires a non-null UTF-8 JSON string, including the valid empty string, while null and non-string values fail closed. Content and refusal are each bounded over decoded UTF-8 octets before the existing canonical encoded delta and prefix bounds apply. The new reader accepts every preceding record, while a preceding closed-shape reader rejects a new refusal-bearing record. Therefore downgrade remains possible only for Sessions that have not persisted refusal; no migration, dual write, or downgrade shim is provided. The physical envelope and all other semantic records remain unchanged.


    Before public release, the same anchored-session semantic Journal /v1 is additively extended again with replay-profile evidence and one closed provider_private_assistant item. Absent replay_profile remains the preceding semantic-only/v1 form; exact kimi-private-local-plaintext/v1 declares kimi.assistant-message/v1alpha1. That item carries the matching epoch and a closed assistant object with exact assistant role, required reasoning string, required string-or-null content, and optional non-empty ordered function-tool calls. It immediately follows and must project exactly to one generic assistant/function-call group, then replaces that group only in the exact Kimi private-replay wire projection used by admitted K3 and K2.7 Code bindings. The complete encoded item counts inside the existing 16 MiB delta and 64 MiB prefix limits. A source Anchor containing private replay cannot open a different exact-replay binding unless a reviewed lossless converter preserves it; otherwise the transition is lossy_handoff. The physical yo.session-record/v1 envelope, fields, discovery, checksum domain, and checksum preimage remain unchanged because they already bind the exact semantic payload bytes. Current readers accept preceding and extended records in one Session and snapshots preserve both; preceding semantic readers reject the new item or replay-profile field. This asymmetric pre-release downgrade impact is accepted without migration, dual write, omission, or shim.


    Replay-prefix or model-context capacity exhaustion discovered before a final assistant answer is accepted is encoded as a typed failed Turn with no model replay delta, resumable outcome, or Continuation Anchor. Only cumulative replay-application capacity discovered after one complete valid final answer, including its valid declared provider-private extension, may preserve a completed but non-resumable Turn without those continuation records.

    Before public release, the unimplemented `context_compaction_handoff` proposal is replaced by closed `context_policy_changed` and `context_checkpoint` records. Policy revision starts at 1 before the first accepted request, increments by one, and freezes enabled state, the two exact strategies, ordered warning/trigger integer domains, and portable-only retained-raw bounds. Accepted requests, replay deltas, resumable outcomes, and Anchors gain required context_epoch fields. Context epoch starts at 1, is Session-global, is inherited unchanged by later bindings, and advances by exactly one only when the sole writer atomically commits a valid same-binding checkpoint. The checkpoint's closed fields bind exact source Anchor and boundary, previous/successor epochs, current policy revision and strategy, input limit and counts, the exact system/tools replay contract, a bounded portable body, retained groups with exact inline replay items and provenance-only JournalSequence ranges, operator-disclosure-only content-addressed receipts, closed loss variants, and the exact summary usage receipt. Receipts and placeholders never enter replay. It emits no binding close/open, cache inference, replay receipt variant, artifact-read tool, expiry, path, or cross-Session authority. Success reconstructs model input as one synthetic user message plus the exact inline retained-group items; private replay may be disclosed and dropped only from the summarized prefix, while retained private groups remain exact and indivisible across a same-binding context-epoch increment because their binding epoch is unchanged. An active-Turn checkpoint may occur only between complete correlated semantic groups and before the next accepted request. The newest checkpoint is the reconstruction root and its source Anchor is provenance; recovery then applies successor-epoch deltas through the newest matching Anchor, measures replay bounds against that reconstructed context, preserves historical prior-epoch records, and rejects only late superseded-epoch records, gaps, duplicates, regressions, direct cross-binding checkpoint application, and cross-boundary replay. A Turn that spans a checkpoint completes with one terminal successor-epoch replay delta containing only the model-visible suffix committed after the newest checkpoint; that delta omits the already checkpointed replay contract, synthetic body, and retained groups, while its outcome and Anchor reference the latest accepted request in that epoch. Earlier requests in the Turn remain valid historical records in their original epochs. A replacement binding seeds from a successor Anchor whose lineage includes the checkpoint, or directly from a checkpoint with no later accepted request through an exclusive `source_checkpoint_sequence`; it never reuses the pre-checkpoint provenance Anchor as raw replay. A checkpoint with no later accepted request remains resumable; a later accepted request without a completed Anchor stays uncertain and read-only. Failure commits no checkpoint. The physical envelope and checksum remain unchanged. The current reader rejects the displaced handoff and mixed graphs; a preceding reader rejects the new record or fields. Existing history without the displaced record stays byte-identical; no migration, dual write, downgrade, or shim exists.

    Before public release, the same anchored-session semantic Journal /v1 is additively extended with exact transition mode backend_native_model_rebind. It may seed a successor backend-managed-state epoch only from the same delegated Host and verified authenticated account after the adapter creates a distinct state-preserving native-fork locator, applies the selected exact Host model solely through a live advertised mutation capability on that candidate, and confirms the candidate's exact binding, model, and locator identities. The source epoch remains open and executable throughout preparation. Atomic publication alone closes it and opens the successor; unsupported capability, stale inventory, account drift, a reused locator, missing or mismatched confirmation, or publication failure leaves the source epoch and locator unchanged while the unbound candidate is discarded or quarantined. The transition records cache unknown and never claims semantic replay, cache restoration, cross-account portability, or applicability to a different Host. It names the newest source Anchor when the source epoch has accepted work; omission is valid only for a live source epoch with no accepted backend request, and a source checkpoint is forbidden. Existing records remain byte-identical and readable, while preceding readers reject the new transition value; there is no migration, dual write, downgrade shim, or private host mutation fallback.

    The existing semantic and physical v1 envelopes are additively extended with nested yo.structured-input/v2 for host-resolved StartTurn and SteerTurn only. Frozen v1 inputs and their model text remain unchanged. The closed v2 object adds one exact required instruction snapshot of at most 262144 UTF-8 bytes tied to its sole selected skill. The canonical Knowledge freezes body validation and model framing, separates visible text from user-role model input, and requires identical request, token-accounting and native-replay content without asset reads during recovery. Activity responses remain v1. Live callers cannot supply pre-resolved snapshots; the execution host validates all references before resolving the same selected entry atomically. Old readers reject v2 without migration, downgrade or data reset.

    ## Initial child-fork seed profile

    Before public release, the existing semantic Journal envelope is additively
    extended by the closed sequenced record `initial_fork_seed` with profile
    `yo.session-fork-seed/v1`. Existing non-fork record and envelope bytes remain unchanged. Fork continuation
    hints use the explicit checksummed discovery extension specified below. A preceding reader MUST reject this unknown record or
    initial-binding mode; there is no migration, dual write, downgrade, implicit
    empty-child fallback or deletion of existing data.

    The record has exactly `type`, `journal_sequence`, `profile`,
    `parent_session_id`, `source`, `seed`, and `history`. The child SessionId is the
    containing descriptor's UUIDv7 and MUST differ from `parent_session_id`. There
    is exactly one fork seed, in the child's initial atomic bootstrap, before its
    first binding and before any accepted child request. Root Sessions omit this
    record. Its presence with no valid first binding, or a first fork binding with
    no valid seed, is non-executable corruption rather than a normal empty Session.

    `source` is a closed tagged union. `empty` contains only `kind: empty` and
    proves only that an explicitly confirmed empty fork was requested. `anchor`,
    `checkpoint` and `initial_fork` contain `kind`, `binding_epoch`,
    `context_epoch`, `record_sequence`, `journal_boundary`, and `binding`. All
    epochs/sequences are positive integers qualified by `parent_session_id`. For an
    anchor, `journal_boundary` equals that Anchor's existing resumable-outcome
    boundary, which precedes its own `record_sequence`. For a checkpoint-only
    source, `journal_boundary` equals the checkpoint record sequence and
    `context_epoch` is its successor context epoch. The captured durable cutoff
    MUST cover the source record itself in every case. For `initial_fork`,
    `record_sequence` names the immediate parent's complete initial seed,
    `journal_boundary` is the complete durable cutoff of the selected
    reconstruction, and the binding/context epochs name its effective owner at that
    point. Recovery validates the initial bootstrap and any subsequent exact
    ownership-mapping transitions; a parent epoch is never equated with the new
    child epoch. `binding` freezes the source backend kind/version, binding
    identity, model identity, continuation strategy, replay profile, and locator
    using their existing validated bounded wire encodings. An anchor names the
    exact valid parent Anchor; a checkpoint names the valid checkpoint effective at
    the selected complete point, with no uncertain accepted request within that
    reconstruction. An `initial_fork` source names a valid non-empty parent initial
    seed with no later accepted request within the selected reconstruction,
    including its verified effective binding derived from that seed. It is not an
    empty source or the grandparent provenance Anchor. Construction validates these
    values against one captured parent reconstruction. An older selected
    reconstruction is admitted only by the explicit historical selection rules in
    the continuation-lineage contract; selecting it does not make the parent's
    later uncertain state executable. The selected logical cutoff and effective
    ownership MUST remain bound to that frozen validated capture; a raw source
    sequence is not an immutable selection. Recovery consumes child-owned inline
    bytes and MUST NOT fetch or revalidate the parent by path or by bare sequence.

    A non-empty `initial_fork` source may seed either an exact-replay child or a
    native child with verified exact-boundary evidence. The child must persist the
    complete selected reconstruction; unchanged private payloads and ultimate origin
    coordinates follow the same lossless import rules. Repeated seed-only forks
    are validated and flattened without ancestor reads. A child initialized by an
    empty fork has no inherited context to reproduce; forking it is an explicitly
    confirmed empty fork, not fabricated non-empty reconstruction. Tests must fork
    an exact seed-only child again before any accepted request, delete both ancestors,
    and recover byte-identical model input from the newest child.

    `seed` is a closed tagged union:

    - `empty` contains only `kind: empty`; source and history MUST also be empty.
    - `exact_replay` contains `kind`, `contract`, ordered `items`, `item_origins`,
      and `groups`, using the
      existing lossless model-replay encodings. It freezes the complete reconstructed
      context, not merely the most recent delta. The existing 4096-item, per-item,
      1MiB contract and 64MiB complete-prefix bounds apply. Required provider-private items retain exact payload
      bytes. Their source qualification and validated child ownership are carried
      separately by the lossless import mapping below.
    - `backend_native` contains `kind`, `source_boundary_evidence`, and
      `candidate_binding`. The boundary evidence is a bounded versioned identity
      whose supported schema asserts the exact source coordinate named above; an
      unknown schema cannot confer continuation authority. Candidate binding uses
      the existing validated binding fields and MUST match the first child binding,
      same verified account and host, exact target model and distinct locator.
      No semantic replay items, cache-restoration claim, or source-locator reuse is
      permitted in this variant.

    `history` is an ordered array of at most 4096 source-qualified entries and at
    most 16MiB of encoded JSON. An entry contains exactly `source_session_id`,
    `source_coordinate`, and `record`. `source_coordinate` is a closed union:
    `{kind: journal, sequence}` for a sequenced semantic record, or
    `{kind: message, activity_id, part, ordinal}` for a snapshot-normalized message
    record without its own JournalSequence. `activity_id` uses the existing bounded
    ActivityRef encoding qualified by the source Session; `part` is `reset`,
    `segment`, or `ended`; `ordinal` is the zero-based occurrence index of that part
    in the captured normalized source message. This coordinate is archival only,
    not a new source JournalSequence or a child admission identity.

    The exact allowed record tags are `command_committed`, `event_committed`,
    `message_reset`, `message_segment`, and `message_ended`. Allowed commands are
    `start_turn`, `steer_turn`, `interrupt_turn`, and `respond_to_activity`, preserving
    their existing closed input/response wire variants. Allowed events are
    `session_created`, `turn_started`, `activity_started`, `activity_updated`,
    `activity_finished`, and `turn_finished`. Message records preserve their existing
    closed reset, segment and ended encodings, including final-segment presence.
    All other record/command/event tags are forbidden here, in particular descriptor,
    backend exchange/request/outcome/correlation, binding, replay delta, context
    policy/checkpoint, fork seed, Request Audit, usage receipt, usage aggregate, and
    compaction command records. Visible activity text may contain an inert usage
    notice; it never contributes to child usage accounting.

    Construction first takes the parent's already validated inherited-history array
    verbatim, then appends only the parent's own allowed archival records in the
    normalizer's stable source order through the selected reconstruction boundary.
    For an Anchor this includes eligible message normalization through its committed
    outcome boundary; for a checkpoint-only source it includes only committed
    archival material at or before the checkpoint record. No later complete record,
    uncommitted segment, pending submission, or accepted uncertain suffix is copied.
    At repeated forks ultimate source qualifiers remain unchanged; only new parent
    records are appended. There is no merge by timestamp, filename, activity number
    alone, or child sequence. Duplicate composite source coordinates are rejected,
    not silently deduplicated. Sequenced coordinates increase strictly within each
    source; normalized message parts retain their source order and message terminal
    invariants. Embedded Session/activity identities and sequenced record numbers
    MUST agree with their qualifiers. Bounds apply after this complete flattening.

    History records are interpreted only by an isolated archived transcript
    projection and never enter child command/event recovery, request, usage,
    replay, input admission, or Anchor correlation. Input v2 snapshots remain exact
    archival bytes and trigger no asset reads. The first excess unit rejects the
    fork; no inherited visible history or required model context is silently dropped.
    The complete seed is additionally subject to existing commit/envelope bounds.

    ### Lossless import ownership and retained groups

    `exact_replay` additionally requires `item_origins` and `groups`.
    `item_origins` has exactly one entry per ordered item. An origin entry contains
    exactly `original`, `imported_from`, and `source_binding`. `original` contains
    `session_id`, `binding_epoch`, `context_epoch`, `record_sequence`, and
    `item_index`; it identifies the record that first produced that exact item.
    `imported_from` has the same fields and identifies the immediate parent's
    validated delta, checkpoint retained group, or initial seed location used for
    this fork. Both source records are qualified by SessionId; `item_index` is a
    zero-based index into that record's ordered reconstructed items. `source_binding`
    freezes the original item's exact binding identity, model identity, and replay
    profile. Every field is bounded by the existing identity/value domains; origin
    arrays are subject to the same 4096-item and whole-record bounds as `items`.
    Origins are correlation metadata only and never become model-visible input.

    Each group has exactly `first_item` and `end_item`, defining a nonempty half-open
    range in `items`. Groups form an ordered gap-free nonoverlapping partition and
    retain the existing complete semantic-group rules, including tool-call/result
    and required private-item association. Source policy or system/tool contract
    is not manufactured as a new source user command. An item synthesized by a
    source checkpoint uses that checkpoint's Session/epoch/sequence as its original
    coordinate. Creation checks origins, group boundaries and exact bytes against
    the captured source reconstruction before publishing the child.

    The import is an explicit, validated lossless ownership mapping: item payload
    bytes and ultimate `original` qualification never change, while the child
    owns the imported baseline under its initial binding epoch 1 and context epoch
    1. Source epochs are not fed into the child's existing equality checks. During
    recovery, fork import validation first establishes the source/target exact
    binding and replay-profile match, then registers the imported groups as the
    child binding's initial baseline. Only that registered baseline may enter the
    child replay accumulator. Ordinary child deltas retain their existing epoch
    and accepted-request checks and contain only newly accepted child items, never
    copies of the inherited baseline. No synthetic child request or Anchor is
    created to satisfy an epoch validator.

    A checkpoint's `retained_groups` remains an ordered array admitting either its
    unchanged local group shape `{first_sequence,last_sequence,items}` or the new
    closed import group shape `{profile,fork_seed_sequence,group_index,items}`.
    The latter profile is exactly `yo.fork-retained-group/v1`; its seed sequence is
    a real earlier child JournalSequence and its zero-based group index selects one
    complete immutable group from that child's seed. `items` MUST equal that entire
    seed group byte-for-byte, with origins resolved from the same seed. Missing
    seeds, split groups, duplicate group indexes, changed payloads or wrong-profile
    references fail closed. Imported groups precede locally produced groups;
    import indexes increase strictly, and local ranges retain their existing
    strict range ordering. `first_retained_sequence`, when present, is the child
    seed sequence if the first retained group is imported, otherwise the first
    local sequence. Comparing two imported groups uses seed sequence plus group
    index rather than rejecting their shared seed sequence as a duplicate range.
    These changes do not relax ordinary local-group correlation or epoch checks.

    Checkpoint construction and recovery validate import groups against their
    current effective child owner epoch and exact binding/profile. That owner is
    derived from the child initial-fork record and any subsequently verified exact
    binding-transition seed, never from a parent epoch or an unchecked metadata
    number. Context-epoch advancement preserves the registered import and original
    bytes for retained groups. Imported groups summarized out of context follow the
    existing explicitly disclosed summary/private-loss rules; they are not later
    restored from archival history. Retained private groups remain exact and
    indivisible. A subsequent exact binding replacement must carry the registered
    origins and import references with the reconstructed context and verify the
    same effective identity/profile before assigning its new owner epoch. An
    incompatible target still requires the separately authorized lossy-handoff
    path; it cannot suppress, relabel or silently drop imported private items.

    Forking a child flattens its current reconstructed context. Existing ultimate
    `original` coordinates and all item bytes are retained; `imported_from` is
    rebound to the immediate parent's authoritative source location, and the new
    child receives its own validated epoch-1 import. Old fork records are not
    recursively nested, nor are original qualifications replaced by the immediate
    parent's UUID. New child-local items acquire their own original coordinates.
    A complete child snapshot retains the seed and any import metadata required by
    its current checkpoint/transition graph. Parent and grandparent repositories
    are never recovery dependencies. Tests MUST cover source epoch 3 into child
    epoch 1, a second-generation fork, retained-private checkpoint recovery, an
    exact-compatible replacement, incompatible model/private-profile rejection,
    and deletion of every ancestor while the child reconstructs identical input.

    An `exact_replay` replacement may instead use the positive
    `source_initial_fork_sequence`, mutually exclusive with
    `source_anchor_sequence` and `source_checkpoint_sequence`. This coordinate
    names the complete initial exact seed in the same child Session, and is valid
    only while that seed remains the current reconstruction root with no intervening
    accepted child request or checkpoint. Recovery MUST verify the complete chain
    from the initial child binding through every exact replacement to the immediately
    preceding closed source epoch; the seed's epoch-1 origin does not substitute for
    that current source owner. The replacement preserves the exact replay contract,
    compatible effective binding identity and private profile, ordered item bytes,
    registered origins, and import references. Its transition seed transfers those
    same validated imports to the newly opened owner epoch without changing their
    original coordinates or payloads. Missing chain links, stale source owners,
    wrong-Session or wrong-kind seeds, changed imports, incompatible private profiles,
    and any intervening accepted request or checkpoint reject this source path.
    `initial`, `initial_fork`, `lossy_handoff`, and `backend_native_model_rebind`
    forbid `source_initial_fork_sequence`; this adds no lossy source eligibility.
    Tests MUST cover two consecutive seed-only exact replacements followed by
    restart and another child fork, preserving exact items and origins after deleting
    all ancestor repositories, and reject each invalid source condition above.

    The first `backend_binding_opened` uses a new closed `initial_fork` transition
    with exactly `mode` and `fork_seed_sequence`. It requires epoch 1 and an earlier
    seed in the same initial child commit. Existing prior-epoch close requirements
    remain unchanged for replacement transitions, and no parent epoch is counted
    as a prior child epoch. Initial child context epoch is 1; inherited source
    context epochs are provenance. A complete initial exact seed is a reconstruction
    root before the first child accepted request, just as a complete checkpoint may
    be a root without a later Anchor. Child replay appends only newly accepted child
    deltas to that seed and respects subsequent child checkpoints. An uncertain
    accepted suffix remains read-only and is never resent.

    The first publication stores the descriptor, seed, first binding and any
    required initial context policy together. A complete snapshot preserves their
    exact child JournalSequences and bytes. Duplicates, late seeds, wrong-source
    kinds, reused native locators, candidate/initial-binding disagreement,
    source-private incompatibility, malformed inline replay or incomplete bootstrap
    fail closed. Parent disappearance after complete publication does not prevent
    managed replay or archival inherited-history display; a missing native backend
    locator retains the existing explicit continuation-failure behavior.

    ### Bounded discovery checksum extension

    The existing closed discovery object MAY contain
    `initial_fork_seed_journal_sequence` as a positive integer; explicit null, zero,
    unknown fields and noncanonical values are rejected. Omission retains exactly
    the frozen legacy fields and checksum preimage. Presence appends two fields to
    the end of the existing discovery checksum preimage: the UTF-8 bytes
    `yo.initial-fork-discovery/v1`, then the sequence as eight-byte big-endian u64.
    Both use the existing length-prefixed `append_field` encoding. The envelope and
    checksum schema labels remain their existing v1 values before public release;
    preceding closed readers reject the additional field. No omitted-field marker
    is appended for a legacy record, preserving its exact checksum bytes.

    The hint is emitted only for a fully published executable initial child seed
    with no later accepted child request; later appends recompute and omit it when
    that condition ceases to hold. It is not parent lineage or a synthetic Anchor.
    Readers recompute it against semantic state during executable recovery and fail
    closed on disagreement. The history-discovery contract defines eligibility and
    legacy unknown classification; no full-log scan is added to listing. Tree
    viewing still needs a separately bounded parent-provenance projection and is
    not completed merely by this continuation hint.

    ## Immutable input-image persistence extension

    The image-input extension is additive inside the existing semantic and physical
    Journal envelopes. Existing `yo.structured-input/v1` and `/v2`, string-content
    replay messages and `yo.context-checkpoint/v1alpha1` retain their exact closed
    shapes, bytes and meanings. A preceding reader rejects the new input, replay
    variant or checkpoint profile rather than omitting image data. No migration,
    dual write, automatic downgrade, re-normalization or empty-input fallback is
    provided. This extension changes no global physical journal-line limit.

    An image-bearing StartTurn or SteerTurn uses `yo.structured-input/v3` under
    the input owner's closed occurrence grammar. Its model replay is the new closed
    item `{kind: multimodal_user, parts}`, preserving legacy `message.content` as a
    string. Ordered parts are exactly `{type: text, text}` or
    `{type: image, snapshot}`. The snapshot has exactly `profile` with value
    `yo.input-image-rgba8-triangle/v1`, `mime_type` with value `image/png`, `width`,
    `height`, `byte_length`, `sha256`, and `data_base64`, using the coordinated
    input wire profile's closed encoding. It binds the same admitted immutable PNG
    bytes across the structured input and model replay; source display metadata
    is not part of this snapshot. Input images are user message parts only in this
    extension; assistant refusals, function calls,
    function results and provider-private items keep their existing closed shapes.
    At most 16 image occurrences and 33 ordered text/image parts are permitted per
    source input and its replay message. Empty text spans are omitted. Duplicate
    image bytes at distinct positions remain distinct occurrences. Exact skill
    framing is appended to the final text part, or becomes one new final text part
    when the input ends with an image; it never crosses a later image to modify an
    earlier span. Old text-only input framing is unchanged.

    Every snapshot is at most 9 MiB of canonical PNG; their sum per input is also
    at most 9 MiB, charged per occurrence. Transmitted dimensions are positive, at
    most 2048 per side and at most 2,097,152 pixels together. These are admitted
    snapshot bounds, not the distinct compressed-source/decode bounds. New structured
    input remains bounded by 16 MiB of complete canonical JSON. A complete replay
    delta remains bounded by 16 MiB, and the reconstructed replay prefix remains
    bounded by 64 MiB and 4096 items. JSON escaping, base64 expansion, skill text,
    framing and all other items count toward the applicable complete encoded bound;
    per-image validity never bypasses whole-container admission. The writer checks
    the first excess occurrence or encoded byte before retaining it. A malformed,
    unknown-profile, hash/length/dimension-inconsistent or over-budget snapshot
    rejects the whole container before its semantic commit, never just one part.

    Queue/dequeue, snapshots, journal recovery, retained checkpoint groups, exact
    binding replacement and initial child seeds preserve the admitted bytes and
    ordered roles/parts. No path, source EXIF, original file, skill catalog, provider
    response, thumbnail or new normalization result can substitute for those bytes.
    Original filename, format, dimensions and source digest may exist only as
    non-model-visible input display metadata under the input owner's closed bounds;
    filesystem paths and source EXIF are excluded from retained image snapshots.
    A display thumbnail is derived presentation, not model or replay authority.

    ### Image-aware checkpoint and loss profile

    The new exact `yo.context-checkpoint/v2alpha1` profile retains the existing
    checkpoint field, group, graph, epoch, source, policy, usage and commit rules,
    except for the explicitly replaced accounting fields and added loss variant
    below. It MUST omit `input_tokens_before` and `input_tokens_after` and instead
    require `accounting_before` and `accounting_after`. Each is a closed object
    containing exactly `quality`, `policy`, `input_estimate`, and `reserve_tokens`.
    Quality is exactly `exact`, `verified_upper_bound`, or `advisory_estimate`;
    policy is the selected model-service's admitted versioned accounting identity;
    the two counts are unsigned 64-bit JSON integers and their sum must not overflow.
    Unknown policy, incompatible quality or unavailable policy evidence rejects the
    checkpoint. Both objects describe the complete requests on their respective
    sides under the same selected binding and accounting policy, including the final
    selected output cap in their tokenization projections. Counts and reserve remain
    separate; policy planning uses their checked sum. Legacy scalar fields never
    acquire advisory meaning. The summary's measured usage remains solely in the
    unchanged `summary_usage` receipt, not in either planning count.

    Only this new profile additionally admits the closed loss object with exactly
    `kind: image_input_summarized`, `content_hash`, `byte_count`, `width`, `height`,
    `source_context_epoch`, and `source`. Content hash is exactly `sha256:` followed
    by 64 lowercase hexadecimal digits and names the admitted PNG bytes; byte count
    is positive and at most 9 MiB, and dimensions obey the normalized snapshot
    bounds above. Source epoch is a positive unsigned 64-bit integer. `source` is
    one of these closed objects, with no optional or unknown fields:

    - `{kind: replay_delta, sequence, item_index, part_index}`;
    - `{kind: retained_checkpoint, sequence, group_index, item_index, part_index}`;
    - `{kind: initial_fork_seed, sequence, group_index, item_index, part_index}`.

    Every sequence is a positive unsigned 64-bit JournalSequence naming a validated
    authoritative record in the current Session. For `replay_delta`, `item_index`
    indexes that record's inline replay items. For `retained_checkpoint`, group and
    item index select its retained group and that group's inline items. For
    `initial_fork_seed`, group index selects the seed's immutable group partition
    and item index is local to that group's half-open item range. Indices are
    unsigned 32-bit integers inside their actual bounded arrays, whose item/group
    counts cannot exceed 4096. Part index is zero-based across all ordered text and
    image parts of the selected source message, within its at-most-33-part domain;
    it MUST identify an image. Source context epoch is the effective epoch
    established by the named local record, not automatically this checkpoint's
    previous epoch. A retained old occurrence does not acquire a later epoch merely
    because it is summarized. Ultimate ancestor qualifications remain separate fork
    provenance and MUST NOT replace this local source coordinate.

    The image losses, considered in their order in `losses`, MUST equal the exact
    ordered image occurrence set of the summarized source: exactly one per
    occurrence, with no missing, extra, duplicate or retained occurrence. The source
    coordinate and hash/length/dimensions MUST match that occurrence in the validated
    source reconstruction. Equal image bytes at distinct coordinates require
    separate entries. The runtime derives this evidence before dispatch/commit; the
    model never authors source coordinates or loss receipts. The complete canonical
    JSON array of image-loss entries is at most 64 KiB and contains at most 64
    entries; check the first excess entry and encoded byte. Existing other loss
    variants and their bounds remain unchanged. Image bytes, filenames, paths and
    unbounded diagnostics are not loss fields.

    The checkpoint's raw-artifact prohibition gains only the narrow exception for
    validated admitted input-image snapshots inside exact inline retained groups.
    This exception admits neither raw output artifacts nor image bytes in portable
    prose, receipt/loss objects, arbitrary files or new retrieval authority. Mandatory
    protected semantic groups keep all their image occurrences intact. Summarized
    images leave successor replay only with their whole summarized groups and the
    validated image-loss entries, while original journal bytes remain unchanged.
    The 64-MiB bound applies to the reconstructed portable body plus retained replay
    and successor deltas; it is not a complete checkpoint or physical-line cap.

    Recovery validates both legacy and new profiles without changing an existing
    record's shape or accounting meaning. Missing accounting quality/policy, malformed
    image mapping, inconsistent hash or budget excess rejects according to the
    existing pipeline stage before dispatch or checkpoint commit. Checkpoint failure
    preserves the prior authoritative context and epoch; no silent image removal,
    new Anchor or partial checkpoint is permitted. Image-containing v3 input occurrences and their inherited archival UserInput retain bounded host-observed source_byte_length outside neutral replay snapshots. Checkpoint format follows its owning binding epoch accounting profile: an image-profile binding always uses v2alpha1 including zero-image requests and after images are summarized away; recovery rejects a legacy scalar checkpoint under that binding, preserves older valid checkpoints under their original binding epochs, and recounts a rebuilt request under a changed binding without relabeling old evidence. The new v3 occurrence, multimodal_user replay, canonical PNG snapshot, image-loss and pressure forms are closed and reject unknown, duplicate, null or noncanonical fields under their exact bounded domains; image losses append in source order without reordering existing loss entries. The closed persisted RespondToActivity grammar additionally admits a payload-free `secret_input_submitted` receipt for an exact request. The process-local live secret response is not serializable and must be replaced only after successful backend command return, which may merely stage an intermediate answer, and before engine or Journal commit; the codec rejects it, and every live dispatcher rejects a constructed or recovered receipt regardless of origin. Existing variants and envelopes keep their bytes, and preceding readers reject the new discriminator without downgrade, placeholder input, reset or migration.

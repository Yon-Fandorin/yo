id: agent.persistence-001
revision: sha256:77882dbeaed4e00ab2af2de7f2bfdbd282fa5269619910c153c82412e549688b
payload:
  kind: decision
  content: >-
    The UUIDv7-only, descriptor-aware semantic Session Journal and checksummed
    physical Session-record envelope are yo's initial public-format candidates,
    both named version 1. The semantic v1 shape remains unchanged. Before the
    first public release, this decision replaces the immediately preceding,
    summary-less physical yo.session-record/v1 shape with a closed physical v1
    shape that requires a discovery object on every record. The discovery object
    contains the Session descriptor, writer-assigned updated Unix milliseconds,
    optional binding epoch, and an optional Continuation Anchor JournalSequence.
    The record's existing CRC32C binds these discovery fields in the same explicit
    checksum preimage as the schema, Session identity, RepositorySequence, kind,
    and exact payload bytes. The replaced summary-less physical v1, legacy
    numeric-v1, semantic v2 through v4, and physical v2 and v3 all fail closed
    before semantic admission; there is no migration, dual reader, or compatibility
    shim for development data. Rejection fixtures may remain only as evidence of
    this boundary, not as legacy parsers or models. Recovery reads only formats
    explicitly supported by an accepted compatibility contract. This contract
    governs only Session Journal and Session-record persistence; other persistent
    formats, including workspace Host identity, remain under their own owning
    contracts. Any further pre-release replacement under the same tag requires
    another explicit SOT decision that accepts its data impact; after the first
    public release, evolution preserves published versions or supplies an
    explicitly reviewed compatibility or migration contract.

payload:
  kind: decision
  content: 'Editable Chat offers a prompt-local built-in slash-command palette when the draft contains one non-whitespace slash token and the cursor is at the draft end. The initial catalog is `/help`, `/model`, and `/exit` in stable declared order, with prefix filtering, local acceptance, and no agent dispatch. Each command module owns its stable identity, invocation token, description, and typed effect boundary. One registry composes references to those definitions and their display order only, validates unique identities and invocation tokens at composition, and fails closed on collision; it does not re-declare user-facing metadata or implement command behavior. The palette, exact built-in parser, and help projection enumerate that registry. A logically active palette consumes known, partial, and unknown slash submissions locally: an exact registered invocation may run without a presented frame, while a partial or unknown submission without a visible acceptable choice preserves the draft and reports a local no-match outcome. Only Esc that dismisses a concretely visible palette arms the exact unchanged draft for one ordinary submission that bypasses command parsing; an edit clears that escape and rescans, while an unpresented or hidden slot does not claim Esc. An outstanding Activity remains pending across `/help` and `/model` and owns ordinary escaped submission; `/exit` is a deliberate process-lifecycle exception that may terminate that Activity but is never its response. Successful local effect or picker admission consumes the exact command draft, while local validation failure preserves it. Every eligible query revision that changes the matching snapshot refreshes the shared prompt-overlay slot, whose presentation synchronization prevents movement or acceptance from running ahead of a committed matching frame. `/help` emits the registry-derived local summary, `/model` delegates idle switching or active-Turn next-Turn reservation to the model-selection owner, and `/exit` reaches the existing runner exit boundary.'

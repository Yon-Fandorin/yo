payload:
  kind: decision
  content: An explicitly attached image is immutable frontend-independent user input, distinct from a workspace path reference, Markdown image output, or a URL. A bounded cancellable preparation service reads each selected static PNG or JPEG once, rejects animation, applies orientation, normalizes RGBA8 and size under yo.input-image-rgba8-triangle/v1, and freezes the resulting PNG bytes and their digest, dimensions, length, and profile. Whole-input admission validates every ordered image and existing workspace/skill reference before dispatch, preserves the draft on rejection, and transfers only the exact submitted snapshot on acceptance. Repeated images remain distinct ordered occurrences; queue, recall, replay, resume and fork use the same admitted bytes without reopening source paths. Existing text-only input, reference admission and skill selection semantics remain unchanged. Frontends use bounded digest-bound thumbnails, disclose normalization, and cannot claim original pixel or color-profile fidelity. Unknown selected-model or delegated-host image capability rejects before dispatch independently of uncertain token accounting. Managed requests additionally require an explicitly selected versioned image input and accounting profile; delegated adapters must preserve the exact common ordered input under their separately reviewed protocol and selected-model capability contracts. Canonical input/replay/checkpoint encodings and historical image-loss records remain owned by persistence and the model loop, and activation is coordinated across those owners. Every structured input image occurrence separately retains its host-observed positive source_byte_length up to4MiB, preserving the original compressed-size charge through queue, recall, editing and inherited input history; the8MiB aggregate counts these occurrences, never normalized PNG lengths or reopened paths. Replay-only images cannot invent source-byte evidence for a new editable occurrence. Image-containing structured-input/v3 has an exact closed ordered occurrence grammar with source byte evidence and bounded optional display metadata; legacy input profiles remain byte-compatible.

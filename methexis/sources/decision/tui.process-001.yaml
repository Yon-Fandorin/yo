payload:
  kind: decision
  content: The private yo-cli process host owns one irreversible Unix termination coordinator whose packed atomic phase and signal bits linearize delivery, lends one closure-scoped cleanup lease to repeatable UI sessions, default-terminates while idle, restores exact prior dispositions only through explicit idle shutdown, and permanently retires after shutdown or partial failure.

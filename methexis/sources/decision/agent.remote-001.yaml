id: agent.remote-001
revision: sha256:f17c28be3d6456bd08a3579d26f12ec6600c91d2a581436ac3a43cc2adf835ad
payload:
  kind: decision
  content: Remote-machine use is an architectural constraint. Local execution is the in-process placement of the same Yo Host contract used remotely, not a separate local-only design. A Yo Host owns the Session Engine, the host component that coordinates Session command processing and lifecycle, together with the workspace, Agent Backend, tools, Session Journal, and Session Repository; a Frontend sends intents and consumes projections without owning host paths, processes, PTYs, or operating-system signal policy. The Yo Session Protocol is transport-independent, versioned, ordered, capability-aware, and supports reconnect from a journal sequence while work continues after client disconnect. A reconnect range that crosses a durable gap carries the explicit gap and the first complete recovery snapshot instead of claiming a continuous suffix; without that snapshot, the Host reports that durable history remains unavailable. The initial local Journal reader remains a concrete capability and does not introduce a shared local-and-remote interface before a real remote reader exists. Its boundary does not expose synchronization primitives, storage representation, or borrowed guards. When a real remote reader provides a second implementation, the common interface is extracted only from behavior actually shared with the local reader while preserving sequence, suffix, and gap semantics. WebSocket is the first remote transport so terminal and future browser or Tauri frontends can share it; gRPC may be added later without changing session meaning. This contract constrains a future remote capability and does not authorize implementing a remote protocol before a real remote consumer exists. Remote bind requires explicit activation, authenticated encrypted transport, and no unauthenticated external default. A remote Yo Host is distinct from a local Host connecting directly to a remote delegated-agent target.

id: agent.remote-001
revision: sha256:053c6ea0be4cdc7c27ba6fdcb331fbc061682785e15b540653ecd0508a8548c7
payload:
  kind: decision
  content: Remote-machine use is an architectural constraint. Local execution is the in-process placement of the same Yo Host contract used remotely, not a separate local-only design. A Yo Host owns the Session Engine, the host component that coordinates Session command processing and lifecycle, together with the workspace, Agent Backend, tools, Session Journal, and Session Repository; a Frontend sends intents and consumes projections without owning host paths, processes, PTYs, or operating-system signal policy. The Yo Session Protocol is transport-independent, versioned, ordered, capability-aware, and supports reconnect from a journal sequence while work continues after client disconnect. A reconnect range that crosses a durable gap carries the explicit gap and the first complete recovery snapshot instead of claiming a continuous suffix; without that snapshot, the Host reports that durable history remains unavailable. WebSocket is the first remote transport so terminal and future browser or Tauri frontends can share it; gRPC may be added later without changing session meaning. This contract constrains a future remote capability and does not authorize implementing a remote protocol before a real remote consumer exists. Remote bind requires explicit activation, authenticated encrypted transport, and no unauthenticated external default. A remote Yo Host is distinct from a local Host connecting directly to a remote delegated-agent target.

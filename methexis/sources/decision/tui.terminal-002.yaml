payload:
  kind: decision
  content: Each repeatable terminal session uses compensating cleanup registered before mutation and one explicit restoration path for normal, failure, panic, and typed termination exits; after cleanup it returns a structured acknowledgment to the process host, while best-effort Drop never replaces reportable cleanup.

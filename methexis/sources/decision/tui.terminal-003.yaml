payload:
  kind: decision
  content: Ctrl+Z requests job-control suspension rather than session exit; after terminal restoration closes the current process-host cleanup lease, a termination selected at that lease boundary wins over suspension, otherwise the host performs the default stop and SIGCONT opens a fresh lease that transactionally reacquires the same presenter, preserves application state, and forces a full redraw.

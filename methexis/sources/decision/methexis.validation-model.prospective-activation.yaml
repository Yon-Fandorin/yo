id: methexis.validation-model.prospective-activation
revision: sha256:ae88d290a885aa8b29df5942470eb656f45904042afbe1812a8f204b1abb6c46
payload:
  kind: decision
  content: The staged activation gate remains the only pre-integration authority transition check. A separate explicit review-only operation may validate the same exact activation request, proposed Checkpoint, canonical active record, trusted develop basis, predecessor, approval closure, Source freshness, and registered artifact lineage to compile a prospective ContextBuild for an immutable activation review packet. It must label every result prospective, capture and final-revalidate all proposal and trusted inputs, reject caller refs, arbitrary trees, inference and fallback, and grant no approval, activation or general context eligibility. Ordinary check and context operations remain unchanged; the staged gate still runs before integration and ordinary full check still runs after trusted integration.

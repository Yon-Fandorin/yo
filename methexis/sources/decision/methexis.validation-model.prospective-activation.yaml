id: methexis.validation-model.prospective-activation
revision: sha256:39dc7573028bde28c751733184caf9f557c47171b989dd6cf78a859722b83767
payload:
  kind: decision
  content: The staged activation gate remains the only pre-integration authority transition check. A separate explicit review-only operation may validate the same exact activation request, proposed Checkpoint, canonical active record, trusted develop basis, predecessor, approval closure, Source freshness, and registered artifact lineage to compile a prospective ContextBuild for an immutable activation review packet. It must label every result prospective, capture and final-revalidate all proposal and trusted inputs, reject caller refs, arbitrary trees, inference and fallback, and grant no approval, activation or general context eligibility. Ordinary check and context operations remain unchanged; the staged gate still runs before integration and ordinary full check still runs after trusted integration. The new path must remain disabled until its enabling contracts are active and its implementation, protocol family, and CONTRIBUTING workflow adoption have all completed the existing ordinary review and integration path. It must never review, approve, or activate any enabling change, and its first eligible input is a later independent activation candidate.

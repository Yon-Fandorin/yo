payload:
  kind: decision
  content: Approval status is a derived axis separate from context eligibility, with the closed labels draft and approved. Consumers evaluate it independently from eligibility, and approval alone never implies context eligibility. Exact label derivation remains owned by the exact-revision approval and current-record contracts rather than being redefined here.

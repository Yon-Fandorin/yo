revision: sha256:4fce4175ba7677de0194790b53efa61af6bbc15dfe3786f1a88ce6487316fb89
payload:
  kind: decision
  content: One ordered durable Session Journal is the semantic replay source for Session history and views. It records backend-neutral Session, Turn, and Activity events plus bounded payload-free Request correlation and availability records. Stable operation identity, accepted-request identity, correlated resumable outcome, backend kind and version, observation boundary, exchange kind and direction, payload schema identity, and the versioned backend Session locator required for continuation belong to those Journal records and are not Request detail. Backend-specific Request Audit detail, including request payloads, headers, and revision or attempt evidence, is a logically distinct optional diagnostic domain under the same Session Repository lifecycle. It never becomes semantic authority and its absence never blocks Journal replay or Continuation Anchor validation. Requests, responses, notifications, server-initiated requests, retries, and terminal outcomes remain distinguishable through correlation records even when detail is unavailable. Semantic meaning is committed at capture time rather than reconstructed solely from an old backend payload. Missing, unsupported, volatile, or unpersisted detail remains explicit. Redaction occurs before any durable detail admission; credentials, complete environment variables, private reasoning payloads, and other prohibited raw values never enter durable storage, and removal remains explicit when it affects interpretation. Until that admission boundary is implemented, Request detail remains process-local and volatile.

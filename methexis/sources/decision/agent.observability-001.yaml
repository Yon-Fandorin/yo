id: agent.observability-001
revision: sha256:fa05b630596ab274ec6d9cb22c0c83d8cd97be1be5a1b60b81326de2869f740f
payload:
  kind: decision
  content: |-
    One ordered durable Session Journal is the semantic replay source for Session history and views, while a process-local Live Projection owns only the uncommitted tail needed for responsive streaming. Backend transport deltas update the Live Projection immediately but never become replay authority by themselves. The Session worker is the sole writer owner; frontends consume read-only views that merge the durable prefix with the live tail by stable item identity. Exact text is accumulated without interpretation or whitespace changes into immutable ordered message segments. Agent-message segments are forced at 16 KiB of UTF-8 text, one second of uncommitted age, a non-text ordering boundary, or message termination. Tool-output segments use 64 KiB and the same one-second age, non-text ordering-boundary, and termination rules. Size splits preserve valid UTF-8, and joining the segments reproduces the exact original text. Segment boundaries are persistence detail rather than message meaning. Every runtime-observed message termination is sealed by a typed MessageEnded outcome that distinguishes completed, interrupted, and failed outcomes and carries the exact segment count and total UTF-8 byte count needed to validate reconstruction. When durable append is available, the final non-empty tail and MessageEnded are one atomic physical commit, so the complete message is not duplicated. When durable append is unavailable, the same final tail and MessageEnded are published atomically as explicitly volatile Live Projection state. That volatile terminal seal never becomes replay authority or a Continuation Anchor; a later complete Session snapshot includes the sealed message and becomes authoritative only after durable publication. Recovery seals a durably recorded message with no terminal record as an explicitly interrupted partial message before later durable events are accepted. The Journal also records backend-neutral Session, Turn, and Activity events plus bounded, payload-free Request correlation and availability records. Stable operation identity, accepted-request identity, correlated resumable outcome, backend kind and version, observation boundary, exchange kind and direction, payload schema identity, and the versioned backend Session locator required for continuation belong to Journal records and are not Request detail. Requests, responses, notifications, server-initiated requests, retries, and terminal outcomes remain distinguishable even when detail is unavailable. Backend-specific Request Audit detail, including request payloads, headers, and revision or attempt evidence, is a logically distinct optional diagnostic domain under the same Session Repository lifecycle. It never becomes semantic authority, and its absence never blocks Journal replay, Continuation Anchor validation, or unrelated semantic records. Semantic meaning is committed at capture time rather than reconstructed solely from an old backend payload. Missing, unsupported, volatile, or unpersisted detail remains explicit. Redaction occurs before durable Request-detail admission and is represented explicitly whenever removal affects interpretation; credentials, complete environment variables, private reasoning payloads, and other prohibited raw values never enter durable Request Audit storage. A schema-bound provider-private replay item is instead payload-bearing semantic replay and may be committed only under jointly defined source, validation, bounds, binding, durable-schema, request-projection, and visibility-exclusion rules. It is atomically paired with adjacent visible replay and never copied into message segments, Activities, correlation, Live Projection, Transcript, Request Audit, discovery, errors, logs, or diagnostics. Until the Request-detail admission boundary exists, Request detail remains process-local and volatile.

    The durable Session Journal keeps payload-free backend correlation separate from bounded payload-bearing replay deltas. Replay content is admitted only after semantic validation, preserves exact message and tool relationships plus any binding-declared private extension, and is committed atomically with the completed outcome and Continuation Anchor.

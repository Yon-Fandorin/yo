id: agent.observability-001
revision: sha256:fe059cda915ec669896783bdb87a72b4d304b3677be937b6c8abb1e9c52c7156
payload:
  kind: decision
  content: |-
    One ordered durable Session Journal is the semantic replay source for Session history and views, while a process-local Live Projection owns only the uncommitted tail needed for responsive streaming. Backend transport deltas update the Live Projection immediately but never become replay authority by themselves. The Session worker is the sole writer owner; frontends consume read-only views that merge the durable prefix with the live tail by stable item identity. Exact text is accumulated without interpretation or whitespace changes into immutable ordered message segments. Agent-message segments are forced at 16 KiB of UTF-8 text, one second of uncommitted age, a non-text ordering boundary, or message termination. Tool-output segments use 64 KiB and the same one-second age, non-text ordering-boundary, and termination rules. Size splits preserve valid UTF-8, and joining the segments reproduces the exact original text. Segment boundaries are persistence detail rather than message meaning. Every runtime-observed message termination is sealed by a typed MessageEnded outcome that distinguishes completed, interrupted, and failed outcomes and carries the exact segment count and total UTF-8 byte count needed to validate reconstruction. When durable append is available, the final non-empty tail and MessageEnded are one atomic physical commit, so the complete message is not duplicated. When durable append is unavailable, the same final tail and MessageEnded are published atomically as explicitly volatile Live Projection state. That volatile terminal seal never becomes replay authority or a Continuation Anchor; a later complete Session snapshot includes the sealed message and becomes authoritative only after durable publication. Recovery seals a durably recorded message with no terminal record as an explicitly interrupted partial message before later durable events are accepted. The Journal also records backend-neutral Session, Turn, and Activity events plus bounded, payload-free Request correlation and availability records. Stable operation identity, accepted-request identity, correlated resumable outcome, backend kind and version, observation boundary, exchange kind and direction, payload schema identity, and the versioned backend Session locator required for continuation belong to Journal records and are not Request detail. Requests, responses, notifications, server-initiated requests, retries, and terminal outcomes remain distinguishable even when detail is unavailable. Backend-specific Request Audit detail, including request payloads, headers, and revision or attempt evidence, is a logically distinct optional diagnostic domain under the same Session Repository lifecycle. It never becomes semantic authority, and its absence never blocks Journal replay, Continuation Anchor validation, or unrelated semantic records. Semantic meaning is committed at capture time rather than reconstructed solely from an old backend payload. Missing, unsupported, volatile, or unpersisted detail remains explicit. Redaction occurs before durable Request-detail admission and is represented explicitly whenever removal affects interpretation; credentials, complete environment variables, private reasoning payloads, and other prohibited raw values never enter durable Request Audit storage. A schema-bound provider-private replay item is instead payload-bearing semantic replay and may be committed only under jointly defined source, validation, bounds, binding, durable-schema, request-projection, and visibility-exclusion rules. It is atomically paired with adjacent visible replay and never copied into message segments, Activities, correlation, Live Projection, Transcript, Request Audit, discovery, errors, logs, or diagnostics. Until the Request-detail admission boundary exists, Request detail remains process-local and volatile.

    The durable Session Journal keeps payload-free backend correlation separate from bounded payload-bearing replay deltas. Replay content is admitted only after semantic validation, preserves exact message and tool relationships plus any binding-declared private extension, and is committed atomically with the completed outcome and Continuation Anchor. The worker captures a complete backend-neutral nonsecret interview batch and accepted answers at semantic capture time, bounded to a 1-MiB batch, without old wire or Audit reconstruction. Unsubmitted working copies use a separate typed editable repository, not the Journal or continuation authority, with 256-KiB records, current-user 0700/0600 no-symlink admission, exclusive-lease revision compare-and-swap, complete synchronized same-directory atomic publication and explicit conflict, schema, size and storage failures. Edits save within one second and at navigation, submission and graceful exit; crash recovery exposes only the last durable copy. Secret values remain excluded from durable storage and the v1 profiles remain nonsecret-only; incomplete capture cannot claim complete recovery. Complete interview capture and final accepted answers map only to the actual typed UserInputRequest/UserInputResponse Activities and their existing authoritative TextSnapshots under the unchanged event/message Journal grammar. The closed yo.interview-capture/v1 profile is interpreted only with matching typed request/response and committed core correlation evidence; identical bytes in ordinary model or tool text remain literal and cannot create a capture. No synthetic ModelWork or new Activity/event/journal kind is introduced. Editable data use the closed yo.interview-working-copy/v1 profile with distinct UUIDv4 copy identity, positive-u64 CAS generation, full-file canonical encoded byte bounds, exact batch references and distinct live Activity-response versus new-StartTurn submission evidence; no model accepted-request record is invented for RespondToActivity. Every ordered accepted answer carries its genuine question request and completed response Activity correlation, and all answer values must equal the backend-neutral projection of the corresponding committed answering command. Reanswered questions use their latest successful answering response, never navigation or an older response. Final accepted capture is admitted only after the aggregate final response write succeeds and every ordered answer correlation is validated; missing or mismatched earlier-answer evidence rejects complete capture. Secret or mixed interviews use closed capture and working-copy v2 profiles while nonsecret v1 bytes remain unchanged. V2 persists public questions and answers, exact response correlations, and only structural submitted or re-entry-required markers for secret rows; it never persists a secret value, hash or length and forbids the ordinary new-conversation submission path. After successful backend command acceptance, including an intermediate staging return, a live command secret is replaced with a payload-free receipt before engine or Journal commit, and exact correlation rather than value comparison validates its final accepted-answer seal. Adapters may retain each earlier secret only in process memory, bound to its originating ActivityRequestRef and current secret-containing batch after that request completes, until the final aggregate response attempt; a newly dispatched live secret still requires its exact request to be outstanding, and navigation back to a secret question discards only that question's previous retained value and requires a new live receipt, while final write success or failure, cancellation or Turn termination discards all retained values; Yo diagnostics cannot reproduce backend text after secret dispatch.

    Native secret interaction observation retains only public call arguments, destination disclosure, a payload-free response receipt, echo-screened visible assistant output and terminal Turn outcome. The backend first prepares without sending; the worker commits that receipt before a later poll may start transport, making it a conservative crash-safe Session-wide continuation barrier. No model bytes stream or persist before exact raw-secret byte-echo exclusion, no value-bearing ToolResult, active suffix, replay delta, checkpoint, audit detail or diagnostic is recorded, and recovery never reconstructs, resends, rebinds or falls back across the barrier.

    Native ordinary single-question requests and answered/unanswered responses use genuine correlated UserInputRequest/UserInputResponse Activities. ActivityQuestion remains readable presentation, not a batch capture, model-call correlation or live recovery proof. An explicit unanswered response keeps readable no-answer provenance and must never fabricate an interview answer seal or accepted-answer batch. Completed model replay independently preserves original function call/result identity; snapshots and drafts cannot reconstruct it.

    ## Closed local failure-context settlement

    The sole failed-Turn exception to completed replay settlement is
    `yo.local-failure-context/v1`, owned by the persistence contract. The managed
    backend supplies typed pre-dispatch local argument semantic-admission rejection,
    explicit successful cleanup and no-dispatch evidence; core MUST also validate
    the exact binding/profile, no-secret-barrier condition and current Turn's latest
    closed active source. The writer MUST atomically commit the Failed Turn event,
    any nonempty exact replay suffix, local failure-settlement outcome and Anchor.
    Its preserved replay MUST contain no rejected arguments, partial response group
    or private replay. It MUST invent no Provider terminal outcome; already committed
    public partial message and Activity history remains visible as partial history. The Turn remains Failed in Journal history
    and live observation. Existing successful settlement remains unchanged.

    The latest failed accepted-request coordinate and earlier preserved semantic
    boundary are different evidence and MUST remain distinct. The outcome names the
    latest accepted request, while its closed settlement source identifies the
    current Turn's cumulative suffix root and latest verified closed boundary
    (including committed steering after its closed group), or the exact
    latest active checkpoint when its successor suffix is empty. Core MUST retain
    the validated replay bytes directly, never reconstruct them from Transcript,
    ToolOutput, Activity presentation, Request Audit or rejected request bytes.
    The source MUST include a previously closed semantic group, either directly or
    in its active checkpoint root; its final boundary MAY be committed steering.
    Exact accepted steering in that validated source MUST be preserved, including an
    input-only successor suffix over an eligible active checkpoint. The checkpoint's exact replay contract, portable body and
    retained groups apply once; its suffix is never duplicated or replaced by an
    empty delta. The Anchor's journal boundary still names its settlement outcome.

    Transactional publication is the only transition from process-local candidate
    to durable continuation authority. A failed append or invalid proposal MUST
    publish no partial continuation chain and MUST block later public runtime poll
    and dispatch, including direct StartTurn. Recovery after an incomplete physical
    append keeps the previously committed history and ordinary uncertain-request
    read-only behavior; it MUST NOT infer settlement or reuse an older Anchor.
    Successful publication permits pending context promotion before the next poll
    or an earlier StartTurn assembles any request. Every other failed/interrupted
    Turn remains outside resumable settlement. Local settlement itself creates no
    model/tool request and consumes no approval again.

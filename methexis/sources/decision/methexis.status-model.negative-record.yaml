  kind: decision
  content: Durable review holds and invalidations are tracked records bound to the exact affected Knowledge revision. A review hold supplies the suspect guard condition for unresolved semantic or provenance uncertainty, while a human invalidation supplies the invalid guard condition. Neither record grants approval or activation, and each supplies machine-readable evidence.

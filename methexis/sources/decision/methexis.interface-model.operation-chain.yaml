payload:
  kind: decision
  content: Methexis exposes semantic-first-ko-on-demand/v1 only for the complete minimal current-operation flow and creates no durable capability lineage. author-revision writes Source and canonical English Knowledge only; after repository-owned semantic review clears, project-review generates Korean on human request; build-review presents the English and Korean pair; prepare-approval and approve retain exact human authorization. Legacy fallback remains exact-revision approved. Agent-review procedure and evidence are owned exclusively by the repository workflow authority, not by Methexis.

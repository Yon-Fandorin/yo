payload:
  kind: decision
  content: Methexis exposes canonical-approval-on-demand-projection/v1 only for the complete flow. author-revision writes Source and English Knowledge; after semantic review, prepare-approval may bind the exact canonical revision directly, or explicit project-review and build-review may supply an optional Korean pair before Projection-backed approval. approve retains exact human authorization and never generates or switches review basis. Existing semantic-first and v1alpha1 Projection paths remain compatible. Repository workflow alone owns reviewer routing and evidence.

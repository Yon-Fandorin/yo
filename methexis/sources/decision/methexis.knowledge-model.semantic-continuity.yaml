id: methexis.knowledge-model.semantic-continuity
revision: sha256:c6f6c14f8ad5e2e7b136df4e9bac702085095d5b297c602fef53d2cb60ceec49
payload:
  kind: decision
  content: A Knowledge revision remains under the same KnowledgeId only while it answers the same semantic question and existing inbound relations still identify the same obligation. Clarifications, tighter wording, and changed outcomes for that same obligation are revisions; a changed subject or obligation that would silently change inbound meaning requires a new KnowledgeId with supersedes. Every supersession target must exist, the supersession graph must be acyclic, old and replacement units cannot be active together, and no removed ID may leave a required inbound relation unresolved. Deterministic checks own those structural guarantees, Librarian may flag overlapping anchors or similar meaning only as a possible unexplained replacement, and a human reviewer owns semantic continuity.

id: agent.storage-001
revision: sha256:4164010fda3703d828f0f52c5dcd104bbaee038518010333f00b91a089ffc086
payload:
  kind: decision
  content: A storage-neutral Session Repository owns the lifecycle of durable Session records behind one repository interface. Semantic Session Journal records and Request Audit data are logically distinct record domains inside that ownership boundary, not independent Session authorities. The initial product does not introduce a separate Request Audit repository interface or a generic append-log abstraction. The current product provides a local implementation and leaves remote storage and any later physical separation of Request Audit data as evidence-gated implementations. Replication, dual-write, and conflict resolution are not part of the local implementation. The first local implementation uses one append-only, explicitly versioned JSON Lines log per Session. It has one shared physical availability boundary, one configurable capacity ceiling, no time expiry, and no automatic deletion. It is the initial durable home for bounded payload-free Request correlation records, but durable Request detail requires a prior redaction-admission contract and implementation; until then detail remains process-local and volatile. Independent Request-detail retention or eviction is not provided by the first implementation. JSONL remains a replaceable implementation detail; compression, segmentation, indexes, SQLite projections, alternative encodings, and a separate Request Audit namespace require measured evidence. Any later storage split does not redefine Session meaning or transfer Session lifecycle coordination. Recovery streams complete lines without materializing the entire log merely to return a bounded suffix, treats an incomplete final line as an uncommitted tail, and reports corruption in any complete line. Only one writer may own a local repository root, and that root is resolved to a stable absolute location when opened. Every physical append is guarded by a durable pending marker; an append whose rollback cannot be confirmed leaves the marker in place so later readers quarantine the Session log instead of replaying an ambiguous complete line. Reopening a non-empty Session or recovering after an initial Session-state load failure requires a complete snapshot before another incremental record because the owner cannot prove that no in-memory-only gap preceded the reopen or recovery. The local repository is enabled by default and uses user-only filesystem access. On capacity or storage failure, existing records remain unchanged, durable append stops, and the active Session continues in memory. The storage owner emits a typed persistent notification to every connected frontend that distinguishes a known sequence, a known empty log, and an unknown durable cutoff. The repository does not claim a continuous durable suffix across the gap. Persistence resumes only through a complete Session snapshot after capacity is restored.

schema: methexis.source/v1alpha1
id: agent.storage-001
revision: sha256:babaa8fe5a5d034539e75fbc46cf698f639b58a0e744b86b9f088da52873eec6
payload:
  kind: decision
  content: >-
    A storage-neutral Session Repository owns the lifecycle of durable Session
    records behind one repository interface without exposing a physical layout
    as a frontend contract. Semantic Session Journal records
    and Request Audit data are logically distinct domains inside that ownership
    boundary, not independent Session authorities. The product provides the
    local implementation first; remote storage and later physical Request Audit
    separation are evidence-gated implementations. The first local
    implementation uses one append-only, explicitly versioned JSON Lines log
    per Session as a replaceable implementation detail and one writer owner for
    each repository root, which is resolved to a stable absolute location when
    opened.
    It is enabled by default, restricts its directory and files to the current
    user, has a configurable capacity ceiling, and neither expires records by
    age nor automatically deletes Sessions. One semantic commit is encoded as one
    physical repository envelope, including a command with zero or more events
    or an observation event batch, so a durable record cannot expose only half
    of that commit. JournalSequence expresses semantic replay order while
    RepositorySequence expresses physical append order; neither is derived
    from the other. Every newly written physical record carries a versioned
    CRC32C over an explicit preimage containing schema, Session identity,
    RepositorySequence, record kind, exact payload bytes, and the complete
    discovery object. The repository writer assigns the discovery timestamp
    immediately before append, derives the descriptor, binding epoch, and latest
    valid Continuation Anchor JournalSequence from the semantic prefix being
    committed, and writes the summary inside the same checksummed envelope. The
    timestamp becomes durable only when that envelope does. A read-only discovery
    port validates the last complete envelope of each Session with a bounded tail
    read and exposes storage-neutral summaries without acquiring the writer lease,
    creating storage, or exposing JSONL paths. Recovery accepts
    supported older records, validates checksummed records before admission,
    and never computes a checksum by serializing a record containing that
    checksum. Recovery
    streams complete lines, treats an incomplete final line as an uncommitted
    tail, reports corruption in any complete line, and returns a bounded suffix
    without materializing the entire log. Every append is protected by a durable
    pending marker; an append whose rollback cannot be confirmed leaves the
    marker so later readers quarantine the Session log. Reopening a non-empty
    Session or recovering after an initial state-load failure requires a
    complete snapshot before another incremental record. Message and
    tool-output segments inside semantic commits remain content-persistence
    detail rather than another Session authority. A successful durable commit
    is published to the in-memory Journal only after its append and
    required synchronization complete. Process-local presentation updates
    explicitly marked volatile are outside this durable-before-publication
    rule and never appear as durable records. If semantic work completes but
    persistence fails, the worker publishes the result as volatile, latches a
    durable gap, and does not report the semantic work as rolled back. When the
    configured ceiling or underlying storage prevents another durable append,
    existing records remain unchanged, the active Session continues in memory
    without durable appends, and the worker emits a typed persistent
    storage-pressure notification to every connected frontend that
    distinguishes a known cutoff, a known empty log, and an unknown durable
    cutoff. A known cutoff carries both the last durable JournalSequence, which
    may be absent when no semantic Journal event is durable, and the last
    RepositorySequence; neither coordinate is inferred from the other. It does
    not claim a continuous suffix across the gap.
    Persistence resumes by writing a complete
    Session snapshot after capacity returns, then accepting later incremental
    records. The repository has one shared physical availability boundary. It
    remains the initial durable home for bounded payload-free Request
    correlation records. Durable Request detail requires a prior
    redaction-admission gate; until it exists, detail remains process-local and
    volatile. It has no independent retention or eviction policy in the first
    implementation.
    The first implementation remains a synchronous single-writer path and does
    not introduce a separate Request Audit
    repository interface, generic append-log abstraction, background writer,
    generic transaction API, group commit, replication, dual-write, or conflict
    resolution. A background writer, generic transaction API, or group commit
    requires measured synchronization-latency and append-rate evidence.
    Compression, indexes, SQLite projections, alternative encodings, and
    physical Request Audit separation also require measured evidence; a later
    split cannot redefine Session meaning or move Session lifecycle
    coordination.

id: agent.storage-001
revision: sha256:62a8bf8c45912826c33350d3fb8f0b6f71b238b8efc84d98b0d5ea07ca695392
payload:
  kind: decision
  content: |-
    A storage-neutral Session Repository owns the lifecycle of durable Session records behind one repository interface without exposing a physical layout as a frontend contract. Semantic Session Journal records and Request Audit data are logically distinct domains inside that ownership boundary, not independent Session authorities. The product provides the local implementation first; remote storage and later physical Request Audit separation are evidence-gated implementations. The first local implementation uses one append-only, explicitly versioned JSON Lines log per Session as a replaceable implementation detail. Multiple processes may open the same stable absolute repository root, while each Session permits one writer owner. During migration, each new writer-capable repository instance retains a shared compatibility guard on the legacy root-exclusive writer-lock file for its lifetime. New writer-capable instances may share the guard, while a live legacy exclusive owner and any new instance exclude one another. The compatibility guard does not serialize new writers and is not acquired by the read-only discovery port. A short-lived root append coordinator serializes the capacity check and physical append so the repository-wide ceiling remains exact; it is not a process-lifetime writer lease. It is enabled by default, restricts its directory and files to the current user, has a configurable capacity ceiling, and neither expires records by age nor automatically deletes Sessions. One semantic commit is encoded as one physical repository envelope, including a command with zero or more events or an observation event batch, so a durable record cannot expose only half of that commit. JournalSequence expresses semantic replay order while RepositorySequence expresses physical append order; neither is derived from the other. Every newly written physical record carries a versioned CRC32C over an explicit preimage containing schema, Session identity, RepositorySequence, record kind, exact payload bytes, and the complete discovery object. The repository writer assigns the discovery timestamp immediately before append, derives the descriptor, binding epoch, and latest valid Continuation Anchor JournalSequence from the semantic prefix being committed, and writes the summary inside the same checksummed envelope. The timestamp becomes durable only when that envelope does. A read-only discovery port validates the last complete envelope of each Session with a bounded tail read and exposes storage-neutral summaries without acquiring the writer lease, creating storage, or exposing JSONL paths. Recovery accepts supported older records, validates checksummed records before admission, and never computes a checksum by serializing a record containing that checksum. Recovery streams complete lines, treats an incomplete final line as an uncommitted tail, reports corruption in any complete line, and returns a bounded suffix without materializing the entire log. Every append is protected by a durable pending marker; an append whose rollback cannot be confirmed leaves the marker so later readers quarantine the Session log. Reopening a non-empty Session or recovering after an initial state-load failure requires a complete snapshot before another incremental record. Message and tool-output segments inside semantic commits remain content-persistence detail rather than another Session authority. A successful durable commit is published to the in-memory Journal only after its append and required synchronization complete. Process-local presentation updates explicitly marked volatile are outside this durable-before-publication rule and never appear as durable records. If semantic work completes but persistence fails, the worker publishes the result as volatile, latches a durable gap, and does not report the semantic work as rolled back. When the configured ceiling or underlying storage prevents another durable append, existing records remain unchanged, the active Session continues in memory without durable appends, and the worker emits a typed persistent storage-pressure notification to every connected frontend that distinguishes a known cutoff, a known empty log, and an unknown durable cutoff. A known cutoff carries both the last durable JournalSequence, which may be absent when no semantic Journal event is durable, and the last RepositorySequence; neither coordinate is inferred from the other. It does not claim a continuous suffix across the gap. Persistence resumes by writing a complete Session snapshot after capacity returns, then accepting later incremental records. The repository has one shared physical availability boundary. It remains the initial durable home for bounded payload-free Request correlation records. Durable Request detail requires a prior redaction-admission gate; until it exists, detail remains process-local and volatile. It has no independent retention or eviction policy in the first implementation. The first implementation remains a synchronous single-writer path within each Session and does not introduce a separate Request Audit repository interface, generic append-log abstraction, background writer, generic transaction API, group commit, replication, dual-write, or conflict resolution. A background writer, generic transaction API, or group commit requires measured synchronization-latency and append-rate evidence. Compression, indexes, SQLite projections, alternative encodings, and physical Request Audit separation also require measured evidence; a later split cannot redefine Session meaning or move Session lifecycle coordination.

    The Session Repository keeps payload-free request correlation and bounded payload-bearing model replay as distinct semantic records in the same atomic checksummed envelope. Replay admission is redaction-gated, bounded independently from repository capacity, and an exhausted replay/context binding cannot silently truncate, summarize, or resume. The physical yo.session-record/v1 envelope, fields, discovery, checksum domain, and checksum preimage remain unchanged. Its payload may use the accepted additive provider-private item in the current pre-release semantic v1; the current reader accepts preceding and extended payloads in one physical-v1 log, a preceding semantic reader rejects the unknown item, and existing records are never rewritten. The first private item is the exact bounded kimi.assistant-message/v1alpha1 object correlated to its binding identity, replay profile, and epoch. It must project to the adjacent visible replay, is stored unencrypted in the same user-only mode-0600 repository, and is excluded from Transcript, Request trace, discovery, diagnostics, and generic frontend reads. Failed private admission rejects the complete replay delta rather than redacting or partially storing it.


    The local Session Repository executes local-client exact replay, while a future managed Session Repository may execute the identical semantic replay contract after its remote identity, boundary, digests, availability, and retention are verified. Backend-managed continuation persists correlation and locator evidence without a replay delta.

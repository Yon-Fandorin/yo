payload:
  kind: decision
  content: 'TuiSession owns one Chat-only prompt-overlay slot, while each completion or picker provider retains its own query, filtering, preview, and effect state. Opening returns a non-reusable instance token. Refresh, close, and accept must present the matching token and stale operations are rejected without changing the current panel. Refresh atomically replaces entries, preserves the selected identity when still enabled, and otherwise chooses the first enabled entry in stable order or no selection when all rows are disabled. A refresh of a previously presented instance advances a presentation revision. Until a committed frame matches the current token and revision, the slot consumes selection movement and acceptance without changing selection, issuing a receipt, or submitting the draft; a stale frame cannot release that fence. A matching visible commit restores normal overlay input, while a matching hidden-geometry commit releases the fence and makes the slot yield input. Accept is an atomic single-consumer transition: it validates the matching token and current enabled selection, irreversibly closes that instance, and returns one acceptance receipt containing the instance token and opaque entry identity. Duplicate or stale acceptance is rejected; the provider owns the product effect and any retry policy without reaccepting the closed panel. Global suspend, resize, termination, view switching, and agent-requested interaction remain higher priority; publishing an interaction closes the current slot, and automatic completion or picker providers remain blocked while it is outstanding. A user-invoked local command palette and its delegated local picker may reopen under a contract that cannot encode a selection as the Activity response and cannot answer, cancel, or consume the Activity, except that an explicitly selected process-termination command may end the Session and Activity as a named lifecycle effect. Dismissal of a concretely visible local instance restores ordinary response routing. In Chat, visibly presented overlay dismissal, movement, and acceptance precede transcript navigation, editor handling, and active-Turn interruption, including during dispatch backpressure; an instance that is unpresented or hidden yields input and cannot consume Esc. While visibly presented, the overlay suppresses the transient work-status row and is bottom-anchored directly above the unchanged prompt; closing or hiding it restores the work-status row from current state. The prompt and footer geometry remain unchanged. Unhandled ordinary input continues to the provider or editor, and modal or nested overlays remain deferred.'

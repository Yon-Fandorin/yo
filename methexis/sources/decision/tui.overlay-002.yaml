id: tui.overlay-002
revision: sha256:c08b843e1358c9449f8f464fe4bf573dc080cd2256cf8bfdae5014b45d6cb50f
payload:
  kind: decision
  content: >-
    TuiSession owns one Chat-only prompt-overlay slot, while each completion or picker provider retains its own query, filtering, preview, and effect state. Opening returns a non-reusable instance token. Refresh, close, and accept must present the matching token and stale operations are rejected without changing the current panel. Refresh atomically replaces entries, preserves the selected identity when still enabled, and otherwise chooses the first enabled entry in stable order or no selection when all rows are disabled. Accept is an atomic single-consumer transition: it validates the matching token and current enabled selection, irreversibly closes that instance, and returns one acceptance receipt containing the instance token and opaque entry identity. Duplicate or stale acceptance is rejected; the provider owns the product effect and any retry policy without reaccepting the closed panel. Global suspend, resize, termination, view switching, and agent-requested interaction remain higher priority; switching away from Chat closes the slot. In Chat, overlay dismissal, movement, and acceptance precede transcript navigation, editor handling, and active-Turn interruption, including during dispatch backpressure. While visibly presented, the overlay suppresses the transient work-status row and is bottom-anchored directly above the unchanged prompt; closing or hiding it restores the work-status row from current state. The prompt and footer geometry remain unchanged. Unhandled ordinary input continues to the provider or editor, and modal or nested overlays remain deferred.

payload:
  kind: decision
  content: The Pilot stores one KnowledgeUnit per Markdown file with closed typed YAML frontmatter that is validated as machine metadata and a canonical English Markdown body for meaning. Metadata contains schema, identity, kind, owner, exact Source pins, and typed relations without YAML merge keys or a duplicate canonical statement.

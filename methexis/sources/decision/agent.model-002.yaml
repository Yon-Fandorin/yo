payload:
  kind: decision
  content: 'Startup selection owns the generic host:<HostId> HostTarget namespace, the built-in host:codex and host:grok adapters, compact ModelTargets, canonical Provider and Account escaping, onboarding, and the three-state stored preference. HostId is a bounded lowercase ASCII identifier with interior hyphens only. Selection captures exactly invocation, one ConnectionRepository snapshot, and PolicySnapshot; config.yaml supplies no model definitions or model.startup layer. Overridable precedence is invocation, stored preference, then policy default. There is no implicit host target: when all selectable sources are absent, interactive startup enters setup before Session creation and non-interactive startup fails with connect guidance for both built-in hosts. yo connect host:codex verifies the local Codex adapter; yo connect host:grok verifies ACP initialization and the advertised cached_token method against the operator''s existing grok login without capturing or storing its token. Either local-host connection publishes only the preference HostTarget. External connect structurally admits, previews, confirms, captures the credential, and commits recoverably without a model request. The first successfully committed explicitly selected target while preference is unset becomes the stored default; grouped imports never choose one model or seed and preserve a surviving preference. Every selection path validates replay_profile before Session creation. For a new native Session, explicit --no-tools selects experimental yo.session-tool-exposure/v1alpha1, narrows the frozen registry to empty without changing the complete model binding, and is preserved by exact replay; delegated hosts and continuation invocations cannot newly apply the restriction. Resume ignores startup preference and policy default, confirms only the exact same HostTarget or binding, and requires replay evidence for any different binding.'

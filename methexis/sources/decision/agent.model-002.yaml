payload:
  kind: decision
  content: 'Startup selection owns HostTarget host:codex, compact ModelTargets, canonical Provider and Account escaping, onboarding, and the three-state stored preference. Policy has exactly two valid forms: overridable has no enforced target and an optional policy default; enforced has one enforced target, forbids override, and has no policy default. Overridable precedence is invocation, stored preference, policy default, then operator model.startup. There is no implicit Local Codex target: when all selectable sources are absent, interactive startup enters setup before Session creation and non-interactive startup fails with connect guidance. `yo connect` lets the user choose Local Codex or one external model; the first successfully verified choice while preference is unset becomes the stored default, and later connections preserve it. Resume ignores startup defaults. A different-binding override requires both target exact-replay capability and source-Anchor replay evidence or a reviewed export; otherwise it fails read-only or uses the separately approved lossy transition.'

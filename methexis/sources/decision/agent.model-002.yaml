payload:
  kind: decision
  content: Model selection includes runtime-advertised delegated-host models beside managed models. Startup and stored preference references remain HostTarget or ModelTarget; this scope introduces no public host-model target string. Selecting a host row in the picker returns an opaque typed identity containing the HostId, stable authenticated HostAccountId, exact host-reported HostModelId, and fresh catalog evidence. The host supplies real account display evidence, while display names never become routing identity. Picker rows are grouped under non-selectable Provider-or-Host and account sections; current rows use Model (current), no Automatic row is invented, and unavailable inventory is a status. Same-host native model rebind requires a distinct state-preserving candidate locator that alone is mutated and exactly confirmed. Every other Host and Managed crossing uses the confirmed transformed handoff and preserves the source binding on rejection or failure.

payload:
  kind: decision
  content: 'Startup selection owns the generic host:<HostId> HostTarget namespace, the built-in host:codex and host:grok adapters, compact ModelTargets, canonical Provider and Account escaping, onboarding, and the three-state stored preference. HostId is a bounded lowercase ASCII identifier with interior hyphens only. Selection captures exactly invocation, one ConnectionRepository snapshot, and PolicySnapshot; config.yaml supplies no model definitions or model.startup layer. Overridable precedence is invocation, stored preference, then policy default. There is no implicit host target: when all selectable sources are absent, interactive startup enters setup before Session creation and non-interactive startup fails with connect guidance for both built-in hosts. yo connect host:codex verifies the local Codex adapter; yo connect host:grok verifies ACP initialization and the advertised cached_token method against the operator''s existing grok login without capturing or storing its token. Either local-host connection publishes only the preference HostTarget. External connect structurally admits, previews, confirms, captures the credential, and commits recoverably without a model request. The first successfully committed explicitly selected target while preference is unset becomes the stored default; grouped imports never choose one model or seed and preserve a surviving preference. Every selection path validates replay_profile before Session creation. For a new native Session, explicit --no-tools selects experimental yo.session-tool-exposure/v1alpha1, narrows the frozen registry to empty without changing the complete model binding, and is preserved by exact replay; delegated hosts and continuation invocations cannot newly apply the restriction. Resume ignores startup preference and policy default, confirms only the exact same HostTarget or binding, and requires replay evidence for any different binding. An idle live native Session switches immediately through the existing replacement boundary. During an active Turn, `/model` may instead keep one invocation-local next-Turn reservation: current Activity responses and exact-turn steers remain on the old binding, a later selection before application replaces the reservation, selecting the current model cancels it, and a durable TurnFinished seals the target and starts the existing synchronous host replacement before terminal input or another Turn is admitted. Input is suspended during application. A MemoryOnly or Gap completion fails and clears the reservation visibly. Replacement failure keeps the old binding and is reported before input resumes; process exit before application discards the non-durable reservation. Stored binding activation is enforced without fallback: every new-Session invocation, stored or policy default, bare or qualified lookup, default assignment, picker acceptance, idle switch, and next-Turn switch reservation rejects a disabled ModelTarget with one typed operator-disabled reason while retaining its visible row. `yo model enable TARGET` and `yo model disable TARGET` are model-only, reversible, idempotent local commands. Disable atomically clears an exactly matching stored preference and enable never recreates it. A Session whose durable Anchor already names the exact unchanged complete binding may resume without an override while it is disabled; disable is not credential revocation and does not interrupt an admitted Turn. Any explicit resume override remains new selection and cannot choose a disabled target.'

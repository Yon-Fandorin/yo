payload:
  kind: decision
  content: 'Startup selection owns HostTarget host:codex, compact ModelTargets, canonical Provider and Account escaping, onboarding, and the three-state stored preference. It captures exactly invocation, one ConnectionRepository snapshot, and PolicySnapshot; config.yaml supplies no model definitions or model.startup layer. Overridable precedence is invocation, stored preference, then policy default. There is no implicit Local Codex target: when all selectable sources are absent, interactive startup enters setup before Session creation and non-interactive startup fails with connect guidance. yo connect lets the user choose Local Codex, a stored or catalog external model, or an explicit grouped --from definition including the exact OpenRouter discovery-seed form. External connect structurally admits, previews, confirms, captures the credential, and commits recoverably without a model request. The first successfully committed explicitly selected target while preference is unset becomes the stored default; grouped imports never choose one model, catalog seed, or OpenRouter discovery seed, preserve a surviving preference, and clear only a target removed by whole-pair replacement. Local Codex first publication and explicit default set or clear use the service-binding preference-only public CAS. Every selection path validates replay_profile before Session creation; private Kimi replay requires explicit imported or confirmed catalog evidence and omission means only semantic-only/v1. Resume ignores startup preference and policy default. A different-binding override still requires target replay capability plus source-Anchor replay evidence or a reviewed export.'

id: agent.model-002
revision: sha256:74dc2dd0f2f13327fd238bea14fbddcf95d170eaa36be86580bd1e838266bc8d
payload:
  kind: decision
  content: Users select configured models through one startup --model reference or the Rib-style /model command and grouped picker. A reference accepts Model, Provider::Model, or Provider:Account:Model and resolves only when its applicable configured coordinates produce exactly one match; absence and ambiguity fail with complete coordinate candidates. Bare Model remains scoped to the current Provider and Account, except a new Codex-default Session with no startup namespace may use one globally unique exact ModelId. Provider::Model requires one exact configured Account match, while the complete form names all coordinates. Omitting --model preserves the configured startup behavior and otherwise starts Codex. Native exact-replay bindings may use the same resolver for direct switching and resume overrides. Codex-to-native live switching and resume replacement remain deferred and must fail explicitly until the separately reviewed cross-backend replay transition exists.

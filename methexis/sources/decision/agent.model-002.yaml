payload:
  kind: decision
  content: |-
    Model selection includes runtime-advertised delegated-host models beside managed models. Startup and stored preference references remain HostTarget or ModelTarget; this scope introduces no public host-model target string. Selecting a host row in the picker returns an opaque typed identity containing the HostId, stable authenticated HostAccountId, exact host-reported HostModelId, and fresh catalog evidence. The host supplies real account display evidence, while display names never become routing identity. Picker rows are grouped under non-selectable Provider-or-Host and account sections; current rows use Model (current), no Automatic row is invented, and unavailable inventory is a status. Same-host native model rebind requires a distinct state-preserving candidate locator that alone is mutated and exactly confirmed. Every other Host and Managed crossing uses the confirmed transformed handoff and preserves the source binding on rejection or failure.

    Configured local command tools are a managed Session extension, not a model-service or account setting. A new closed yo.managed-command-binding/v1 wraps an existing legacy/complete model identity plus an execution manifest SHA-256; its entire value remains within the existing 4096-byte bound. New wrappers strictly validate nested known shapes while old top-level decoders retain their original semantics. Executable resume and exact fork require base-binding equality, exact current manifest digest and durable model projection; history remains readable on mismatch. Model replacement retains the frozen execution manifest and durable tool projection and follows the existing exact-replay and private-state eligibility rules for changing only the nested model binding. New Sessions may append admitted command definitions after the five unchanged BasicFiles tools. Existing v1 Sessions never merge configured tools. No-tools retains its empty manifest and bypasses artifact reads; delegated hosts warn once and expose no Yo command tools. Generic Journal identity grammar and exact fork identity preservation are unchanged.

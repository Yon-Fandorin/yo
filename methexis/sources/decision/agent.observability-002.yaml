id: agent.observability-002
revision: sha256:c3e88747d2b56be976c217839f095dc6bd1a015e49d4a5f0e453346023a69f3c
payload:
  kind: decision
  content: Chat and Transcript derive displayed history from the read-only semantic Session Journal. Request is a read-only diagnostic projection that joins the Journal's bounded correlation and availability records with optional Request Audit detail under the same Session lifecycle; neither the projection nor its detail becomes an independent authority. Chat is the editable default interaction surface and follows established coding-agent interaction by showing concise intent, meaningful tool and file activity, tests, approvals, errors, and results while collapsing repetitive exploration and long output. Transcript is the transparent chronological superset, including detailed semantic and Activity lifecycle, context, failures, and explicit gaps. Request is a full-page projection anchored to the context currently viewed in Chat or Transcript, not primarily a request-list browser. It shows the observable backend exchange, revisions, attempts, outcomes, redaction, exact observation boundary, and a typed reason when detail is unavailable. A context with no direct request says so instead of selecting a nearby request. Returning across linked views restores each view's cursor and scroll state. A future remote reader may fetch detail on demand only after a real remote consumer defines that contract, but this decision does not create a remote Request Audit interface.

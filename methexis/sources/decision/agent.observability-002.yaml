id: agent.observability-002
revision: sha256:008d9a2d5989ccaa6a4c559b50cf539701a462ec9e104e0f8bc56320cc606248
payload:
  kind: decision
  content: Chat and Transcript derive displayed history from the read-only semantic Session Journal. Request is a read-only diagnostic projection that joins the Journal's bounded correlation and availability records with optional Request Audit detail under the same Session lifecycle; neither the projection nor its detail becomes an independent authority. Chat is the editable default interaction surface and follows established coding-agent interaction by showing concise intent, meaningful tool and file activity, tests, approvals, errors, and results while collapsing repetitive exploration and long output. Transcript is the transparent chronological superset, including detailed semantic and Activity lifecycle, context, failures, and explicit gaps. Request is a full-page read-only diagnostic trace that presents all of the Journal's bounded correlation and availability records for the full Session in chronological order, not a request-list browser. It shows the observable backend exchange, revisions, attempts, outcomes, redaction, exact observation boundary, and a typed reason when detail is unavailable. An interactive surface may highlight the context currently viewed in Chat or Transcript within that trace; a highlighted context with no direct request says so instead of selecting a nearby request. Returning across linked views restores each view's cursor and scroll state. A future remote reader may fetch detail on demand only after a real remote consumer defines that contract, but this decision does not create a remote Request Audit interface. Session Usage is a read-only projection of usage receipts from completed ModelWork Activities only. Archived CLI Usage and live F4 Usage consume one shared typed projection and carry identical meaning; neither frontend independently decodes or aggregates receipts. The projection preserves receipt chronology. Each token aggregate is complete, partial, or unavailable; partial and unavailable aggregates expose covered/total receipt coverage (x/y), so missing values do not appear complete. Cache-read share includes only receipts that explicitly report cache-read token data and have a known input-token denominator; its token denominator contains known input tokens from only those eligible receipts, and it exposes eligible/total receipt coverage. A Session with no recognized completed receipts succeeds with an empty projection. For recognized receipt schemas, reported zero, absent, and unsupported remain distinct, while malformed data fails the whole projection closed. Codex aggregation uses per-turn usage only and excludes cumulative thread_total. Usage never infers cost, billing, cache hits, uncached tokens, missing attribution, or cross-provider cache-write equivalence, and never exposes raw request, response, credential, or private-reasoning content.

id: agent.observability-002
revision: sha256:697110b69364e987ad433d992418e2fab5cd56fc70962649f110ac2473811553
payload:
  kind: decision
  content: Chat and Transcript derive displayed history from the read-only semantic Session Journal. Request is a read-only diagnostic projection that joins the Journal's bounded correlation and availability records with optional Request Audit detail under the same Session lifecycle; neither the projection nor its detail becomes an independent authority. Chat is the editable default interaction surface and follows established coding-agent interaction by showing concise intent, meaningful tool and file activity, tests, approvals, errors, and results while collapsing repetitive exploration and long output. Transcript is the transparent chronological superset, including detailed semantic and Activity lifecycle, context, failures, and explicit gaps. An archived Transcript alone may select the newest positive N semantic Transcript records through an Option<NonZeroUsize> limit before rendering; selected records remain chronological and retain their original one-based record numbers. It alone may apply content none, preview, or full before rendering user input, Activity text delta or snapshot, Activity failure messages, and Turn failure messages. None emits the exact content type and full UTF-8 byte count. Preview additionally emits the Debug-quoted escaped longest complete extended-grapheme prefix whose unescaped UTF-8 encoding is at most 256 bytes and whether it was truncated. Full preserves the legacy fields byte-for-byte and emits no content metadata. Omitting the content selector defaults to full; any explicitly supplied limit or content selector, including full, is Transcript-only and Chat and Request reject it. Request is a full-page read-only diagnostic trace that presents all of the Journal's bounded correlation and availability records for the full Session in chronological order, not a request-list browser. It shows the observable backend exchange, revisions, attempts, outcomes, redaction, exact observation boundary, and a typed reason when detail is unavailable. An interactive surface may highlight the context currently viewed in Chat or Transcript within that trace; a highlighted context with no direct request says so instead of selecting a nearby request. Returning across linked views restores each view's cursor and scroll state. A future remote reader may fetch detail on demand only after a real remote consumer defines that contract, but this decision does not create a remote Request Audit interface. Session Usage is a read-only projection of usage receipts from completed ModelWork Activities only. The independent top-level `yo usage SESSION_ID` command is the sole Usage presentation and consumes the shared typed Session Usage projection without independently decoding or aggregating receipts. Usage is not a CLI or TUI view, `yo session --view usage` is invalid, and F4 has no view binding. The projection preserves receipt chronology. Each token aggregate is complete, partial, or unavailable; partial and unavailable aggregates expose covered/total receipt coverage (x/y), so missing values do not appear complete. Cache-read share includes only receipts that explicitly report cache-read token data and have a known input-token denominator; its token denominator contains known input tokens from only those eligible receipts, and it exposes eligible/total receipt coverage. A Session with no recognized completed receipts succeeds with an empty projection. For recognized receipt schemas, reported zero, absent, and unsupported remain distinct, while malformed data fails the whole projection closed without partial output. Codex aggregation uses per-turn usage only and excludes cumulative thread_total. Usage never infers cost, billing, cache hits, uncached tokens, missing attribution, or cross-provider cache-write equivalence, and never exposes raw request, response, credential, or private-reasoning content.

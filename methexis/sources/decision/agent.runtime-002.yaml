id: agent.runtime-002
revision: sha256:b2671677903e387af78072c5ce520e250013ab6bf9d2a6d7a8f54471686baa38
payload:
  kind: decision
  content: Frontends communicate with yo-core through named typed commands and events rather than manipulating Agent Backend or Session internals. An agent command is the agent-domain intent carried by the existing typed runtime flow. Commands and events identify their Session, applicable Turn, and applicable Activity or request correlation target. yo-core owns execution meaning and semantic observations, while frontends own input gestures and presentation. The first boundary uses in-process Rust types and channels, keeps backend wire names private, and defers a remote protocol until a real remote consumer exists.

payload:
  kind: decision
  content: The first executable coding loop covers app-server initialization, a new Session, prompt submission, streamed response, a completed tool Activity and file-change observation, approval round trips, Turn completion or interruption, explicit failures, and child-process cleanup. Its existing deterministic fake and environment-dependent Codex evidence remain required. Executable delivery supports exact -p/--print one-shot execution for either one ordinary durable new Session or one exact stored Session selected by --resume SESSION_ID. Both modes accept one non-empty UTF-8 input and dispatch exactly one user Submission while hiding non-final progress and publishing only the completed final AgentMessage after cleanup. Print resume preserves all previously durable Session identity, Provider/Account/Model binding, tool-registry, replay-lineage, usage, cache, and request-lineage state while appending only ordinary records for its new Turn; it rejects --continue and creation-only or binding-replacement options. It requires the newest executable durable Continuation Anchor and fails before Backend dispatch when continuation is absent, non-executable, or lossy-only. It acquires no terminal, grants no approval, performs no retry, steer, fallback, or implicit fresh-Session replacement, and keeps startup, recovery, admission, Turn, output, and cleanup failures distinguishable.

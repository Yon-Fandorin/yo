payload:
  kind: decision
  content: The first executable coding loop covers app-server initialization, a new Session, prompt submission, streamed response, a completed tool Activity and file-change observation, approval round trips, Turn completion or interruption, explicit failures, and child-process cleanup. Its existing deterministic fake and environment-dependent Codex evidence remain required. Executable delivery additionally supports exact -p/--print one-shot execution. Print creates one ordinary durable new Session, accepts one non-empty UTF-8 input from a positional prompt, piped stdin, or both in stdin-first order, and dispatches exactly one user Submission while leaving model routing, reasoning, tool policy, and internal provider-call count unchanged. It acquires no terminal, hides Thinking, Working, tool, usage, cache, and Session metadata, and writes only the final completed AgentMessage to stdout with newline framing after every earlier operation and cleanup succeeds. Startup, admission, Turn failure or interruption, a required interactive response, missing final output, write failure, and cleanup failure remain distinguishable. Print does not grant tool approval, and initial print continuation and structured output remain out of scope.

payload:
  kind: decision
  content: The Unix UI adapter uses feature-minimal Crossterm event decoding plus its EventStream readiness surface, polled directly by the terminal-owning thread through futures-core without an async runtime or periodic input timeout. Rustix owns exact termios state, while the private yo-cli process host owns the audited Nix sigaction boundary and Signal Hook default emulation; yo-tui owns terminal cleanup but not process-signal installation or replay.

  kind: decision
  content: The Unix UI adapter uses feature-minimal crossterm input and rustix-owned exact termios state, while the private yo-cli process host uses one audited nix sigaction boundary and signal-hook default emulation; yo-tui owns terminal cleanup but not process-signal installation or replay.

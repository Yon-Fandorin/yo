id: agent.tool-001
revision: sha256:42fcac7712701d2e96c65d833f4e7c4fb3b2b158d785e03ce0a7451f9feb4bf4
payload:
  kind: decision
  content: |-
    A Yo-managed model loop exposes only locally registered function tools through a frontend-independent registry and injected execution-host port. Stable tool identity, JSON-schema validation, approval, mutable-resource admission, exact call/result correlation, cancellation, and result bounds are decided before connector submission or local side effects. A tool call is attempted at most once after dispatch and is never automatically retried. Calls execute serially unless the scheduler proves their approvals and mutable resource leases independent. Agent policy may supply a non-resetting absolute execution deadline, which defaults to absent. The first local command tool instead always detects 5 minutes without stdout or stderr progress, resetting that inactivity window on each non-empty output chunk, while cancellation and cleanup remain independently finite. Provider built-in tools and direct provider MCP execution are deferred.

    The local tool boundary accepts only the closed yo.tool-schema/v1 JSON-schema subset, emits stable typed validation failure codes, and applies semantic redaction before arguments or outputs become Activities, model input, or durable replay. No concrete tool may bypass that gate.

    The list_files directory argument and every complete rendered path token use the shared at-most-1,024-UTF-8-byte, Unicode-control-free workspace-relative admission before becoming model-visible; current-directory components may select the workspace root, while absolute, parent-traversing, platform-prefix, or over-bound identities are never published.

    The first local workspace-file surface defines a distinct basic-files registry revision. New Sessions use one bounded read_files function that accepts one to eight ordered UTF-8 file windows and returns independently bounded compact JSON items with exact continuation offsets and per-item failures; a resumed Session must use the exact registry recorded in its durable replay contract or remain read-only. The surface adds automatic workspace-scoped edit_file and write_file effects: edit_file applies one batch of unique, non-overlapping exact replacements against one captured original file, while write_file atomically creates or replaces one complete UTF-8 file under an existing parent. Both preserve unrelated file contents and directory objects, reject symlink or credential targets, publish no partial mutation on validation or planning failure, and serialize only edit_file/write_file mutations dispatched through the same execution-host instance. Their exclusively created unpredictable same-parent temporary entry and named-target replacement may cause only the unavoidable parent entry and incidental metadata changes. The atomic rename is their publication point; uncoordinated external content, metadata, target-entry, or scratch-entry publishers are explicitly outside the portable lost-update and content-authenticity guarantee. list_files is deliberately shallow: it fixes only the selected directory, opens no child, retains the first at most 100,000 raw names other than exact `.` and `..` plus at most one over-bound probe, and orders the retained subset by raw bytes. Exact `.git`, symlinks, and special entries are excluded; invalid UTF-8 or control-bearing names are omitted with explicit truncation rather than rendered lossily. Each other eligible child receives at most one no-follow metadata classification, exact ENOENT skips only the disappeared child, and every other observed directory or metadata error fails the call. Completed output reserves the exact common truncation marker before retaining whole LF-terminated path lines, so no partial or ambiguous path enters model-visible history. No cross-entry snapshot or globally sorted over-bound subset is promised. The exact description is `List immediate children of one directory inside the current workspace.` in both frozen manifests; no recursive compatibility projection remains. The historical BasicFiles/v1 run_command remains Process/approval-required; a versioned workspace-confined v2 adds per-call admission plans while preserving the v1 registry and manifest bytes. Dedicated file deletion and apply_patch tools remain deferred. The exact model-visible descriptions keep only each tool's purpose, the read batch/error/continuation behavior, and concise input-field meanings; detailed filesystem safety and publication rules remain host-owned instead of recurring in every request. Current authority freezes both the preceding three-tool and new five-tool replay manifests instead of trusting durable data as its own identity, and freezes compact mutation success/error results. The mutation lock serializes only edit/write calls through one execution-host instance; run_command, other hosts or processes, and editors remain uncoordinated publishers. Every nonpublished terminal path performs one identity-checked non-retrying scratch cleanup sequence, and cleanup failure is explicit without revealing the scratch path or content. A total condition/phase precedence table fixes every mutation failure class and durable result. Executable legacy resume retains an exact four-mebibyte bounded read_file contract, including path admission, descriptor-only no-follow access, credential exclusion, UTF-8/truncation bytes, stable errors, and cancellation checks.

    An explicit bounded tools.commands configuration may extend the unchanged BasicFiles registry with Process/approval-required native or interpreted command tools. Fixed interpreter/executable/script/argv and normalized JSON stdin remain separate, with no shell interpolation or implicit scanning. A frozen registry owns per-definition argument limits, artifact/manifest budgets and a deterministic domain-separated execution-definition digest. Startup capture and cancellable final worker verification preserve original installed path semantics while explicitly excluding hostile uncoordinated artifact replacement and transitive dependency reproducibility. Existing command output, semantic admission, cancellation and finite process cleanup remain shared; one approved call permits at most one spawn. The model projection and digest jointly authenticate resumed execution without persisting config or artifact bytes. Existing fixed registry behavior and bounds remain unchanged.

    New local-tools Sessions append the exact ask_user then current request_secret_input interaction suffix after the frozen local registry, while no-tools and exact known historical projections retain their recorded form. The current public title/question/purpose schema adds one optional storage_offer object containing a stable lower-case public scope, recommendation, public reason and conditionally required 1–365 suggested day count. Offer absence means use once and no retention prompt. The object authorizes no persistence, carries no secret or answer placeholder, and the model never receives the user's local choice. The previous title/question/purpose-only definition remains a known historical projection and implies no offer. The closed suffix set is absence, historical secret-only, current secret-only, or exact ask_user plus current secret; full ordered definitions must match and historical projections are not upgraded. This reserved interaction still has no ToolId, effect, approval, execution host or command-manifest digest entry, is admitted only as the sole function call, and returns only its correlated secret value through the managed connector-only terminal path rather than local execution or durable semantic replay.

    A backend-owned ask_user accepts one bounded public question with optional ordered choices and always permits ordinary text, choice-plus-notes or an explicit payload-free unanswered result. It is reserved from local/configured tools, has no local execution/approval/digest effect, must be the sole function call in a complete successful response, and may recur in later model rounds. Its exact definition, bounds and versioned answered/unanswered output shapes are frozen in the canonical Knowledge. Unanswered supplies no answer or permission, leaves dependent decisions unresolved, and imposes no question-frequency or implicit-choice policy. Completed call/result pairs use ordinary exact replay; no-tools and historical manifests keep their exact forms.

    A future workspace-confined command profile preserves exact v1 registry and manifest bytes and selects versioned v2 registries for new Sessions. In v2, run_command uses an execution-host prepared per-call plan with automatic, approval-required, or unavailable disposition; approval binds that same complete OS-enforced scope. These guarantees apply to v2 command children, including configured commands, and do not change BasicFiles hosts or establish agent-wide Git, credential, or Session protection. The command plan permits ordinary Git metadata writes inside the selected workspace and requires explicit exact per-call writable grants for resolved gitdir/common-dir roots outside it. It exposes non-secret Yo configuration read-only only when secret subpaths are excluded, and hides credential, Yo auth/runtime-secret, and active Session data from command children. It bounds inherited descriptors, environment, IPC, network, and child processes, and fails closed when a host cannot enforce the plan. A recognized-risk approval may admit only its exact requested outside-workspace roots or network capability; secret-read and host-IPC exclusions cannot be relaxed. A network grant does not inherit host credential files, helpers, or SSH-agent authentication and does not promise every authenticated external command will work. Automatic writable caches remain inside the workspace or private per-call roots; existing external cache writes require an exact approved grant. The versioned minimum classifier keeps a single literal file deletion automatic and prompts for recognized recursive, multi-target, glob or expanded-operand deletion, find -delete or direct find/xargs deletion, mutating git clean, reset --hard, forced or discarding checkout/switch, path checkout, and worktree restore. Its published bounded shell coverage does not recursively interpret arbitrary programs or dynamically constructed commands. Unfamiliar commands and unrecognized syntax may run automatically within the baseline confined plan, while only recognized risky forms are guaranteed to prompt. Arbitrary program-internal deletion or Git-metadata damage within admitted writable roots may occur without a prompt, and path confinement does not guarantee protection against pre-existing hard-link aliases. No copy-on-write workspace or original-tree restore guarantee is claimed.

id: agent.tool-001
revision: sha256:b389a08da03fa99c06a14f2657543146269a35ee4304a1055eba629a56dda9be
payload:
  kind: decision
  content: |-
    A Yo-managed model loop exposes only locally registered function tools through a frontend-independent registry and injected execution-host port. Stable tool identity, JSON-schema validation, approval, mutable-resource admission, exact call/result correlation, cancellation, and result bounds are decided before connector submission or local side effects. A tool call is attempted at most once after dispatch and is never automatically retried. Calls execute serially unless the scheduler proves their approvals and mutable resource leases independent. Provider built-in tools and direct provider MCP execution are deferred.

    The local tool boundary accepts only the closed yo.tool-schema/v1 JSON-schema subset, emits stable typed validation failure codes, and applies semantic redaction before arguments or outputs become Activities, model input, or durable replay. No concrete tool may bypass that gate.

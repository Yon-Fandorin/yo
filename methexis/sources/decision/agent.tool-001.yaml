id: agent.tool-001
revision: sha256:a3cc254dc0f0b48fb688dacb963db6c7ec551c49ac357db67396ad009cc2840d
payload:
  kind: decision
  content: |-
    A Yo-managed model loop exposes only locally registered function tools through a frontend-independent registry and injected execution-host port. Stable tool identity, JSON-schema validation, approval, mutable-resource admission, exact call/result correlation, cancellation, and result bounds are decided before connector submission or local side effects. A tool call is attempted at most once after dispatch and is never automatically retried. Calls execute serially unless the scheduler proves their approvals and mutable resource leases independent. Agent policy may supply a non-resetting absolute execution deadline, which defaults to absent. The first local command tool instead always detects 5 minutes without stdout or stderr progress, resetting that inactivity window on each non-empty output chunk, while cancellation and cleanup remain independently finite. Provider built-in tools and direct provider MCP execution are deferred.

    The local tool boundary accepts only the closed yo.tool-schema/v1 JSON-schema subset, emits stable typed validation failure codes, and applies semantic redaction before arguments or outputs become Activities, model input, or durable replay. No concrete tool may bypass that gate.

    The first local workspace-file surface defines a distinct basic-files registry revision. New Sessions use one bounded read_files function that accepts one to eight ordered UTF-8 file windows and returns independently bounded compact JSON items with exact continuation offsets and per-item failures; a resumed Session must use the exact registry recorded in its durable replay contract or remain read-only. The surface adds automatic workspace-scoped edit_file and write_file effects: edit_file applies one batch of unique, non-overlapping exact replacements against one captured original file, while write_file atomically creates or replaces one complete UTF-8 file under an existing parent. Both preserve unrelated file contents and directory objects, reject symlink or credential targets, publish no partial mutation on validation or planning failure, and serialize only edit_file/write_file mutations dispatched through the same execution-host instance. Their exclusively created unpredictable same-parent temporary entry and named-target replacement may cause only the unavoidable parent entry and incidental metadata changes. The atomic rename is their publication point; uncoordinated external content, metadata, target-entry, or scratch-entry publishers are explicitly outside the portable lost-update and content-authenticity guarantee. Existing list_files and approval-required run_command remain; deletion and apply_patch are deferred. The exact model-visible descriptions keep only each tool's purpose, the read batch/error/continuation behavior, and concise input-field meanings; detailed filesystem safety and publication rules remain host-owned instead of recurring in every request. Current authority freezes both the preceding three-tool and new five-tool replay manifests instead of trusting durable data as its own identity, and freezes compact mutation success/error results. The mutation lock serializes only edit/write calls through one execution-host instance; run_command, other hosts or processes, and editors remain uncoordinated publishers. Every nonpublished terminal path performs one identity-checked non-retrying scratch cleanup sequence, and cleanup failure is explicit without revealing the scratch path or content. A total condition/phase precedence table fixes every mutation failure class and durable result. Executable legacy resume retains an exact four-mebibyte bounded read_file contract, including path admission, descriptor-only no-follow access, credential exclusion, UTF-8/truncation bytes, stable errors, and cancellation checks.

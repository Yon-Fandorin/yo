payload:
  kind: decision
  content: An ordinary Slice review packet binds one immutable Git diff to a verified ContextBuild from current active authority. An experimental activation-review packet may instead bind one explicitly named activation request to a prospectively verified ContextBuild for the exact proposed Checkpoint. That mode remains review-only, labels its authority prospective, and binds the activation request, proposed Checkpoint, canonical active-record transition and predecessor, stable trusted basis, every ordinary packet input, and the authority mode into its versioned ReviewId plan. Existing request, plan, manifest, delivery-profile, and verifier identifiers remain frozen; the new behavior uses the smallest new v1alphaN family. Construction captures bounded immutable inputs, rejects caller-selected refs and arbitrary future trees, final-revalidates the trusted ref, Source observations, proposal files, ContextBuild, candidate, diff, and hashes before publication or exact reuse, and never grants approval, activation, or general context eligibility.

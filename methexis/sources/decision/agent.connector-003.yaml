payload:
  kind: decision
  content: The Kimi Chat Completions Model Connector implements the exact kimi-chat-completions dialect for ProviderId kimi without adding Provider branches to the Yo-managed loop. It admits exact K3 with kimi-private-local-plaintext/v1 as the flagship reasoning path, exact kimi-k2.7-code and kimi-k2.7-code-highspeed with the same private replay profile as forced-thinking coding paths, and exact K2.6 with semantic-only/v1 as the non-thinking fallback at the normalized .ai endpoint. K3 sends top-level reasoning_effort low, high, or max and omits thinking and stream_options fields. K2.7 Code sends exact thinking.type enabled with thinking.keep all plus stream usage, omits provider-fixed sampling overrides, and requires the same schema-bound complete private assistant message for each accepted round. K2.6 sends exact thinking.type disabled plus stream usage and never carries private reasoning. All four admitted profiles send max_completion_tokens and request-local tools only after Kimi name and MFJS-subset admission. The Connector validates exact response object, model, role, fragment, finish, and tool-call evidence and projects K3 and K2.7 Code reasoning_content into a closed bounded kimi.assistant-message/v1alpha1 object with exact assistant role, content null semantics, and tool-call shape. It must equal the adjacent generic visible projection, replaces that projection as the single Kimi private-replay wire assistant message, is correlated to the exact binding and replay profile, remains unobservable, and is replayed unchanged only by that identity; malformed, missing, mismatched, or unbounded private state prevents a later request and Continuation Anchor. Its SSE terminal accepts documented finish-choice usage layouts as one exact semantic usage, requires the final DONE sentinel, and rejects ambiguity, inconsistent duplicate representations, malformed tool correlation, unsafe redirects, unbounded data, and deadline expiry. The first transport policy owns exact finite phase and resource bounds, follows at most three same-origin 307 or 308 redirects, performs no automatic retry, gives verification a ten-minute absolute deadline, and registers one cleanup boundary before credential-bearing work. Every terminal path revokes observation publication and zeroizes the credential before reporting, then performs independently bounded close and reap work in a credential-free quarantine. Secrets, private reasoning, response bodies, and tool payloads remain outside diagnostics.

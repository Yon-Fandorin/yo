id: agent.connector-003
revision: sha256:89d9397f5563706bc2d6fb28369cc6c5434df3e1ef9632569ab664335b6e084e
payload:
  kind: decision
  content: |-
    The Kimi Chat Completions Model Connector implements the exact kimi-chat-completions dialect for ProviderId kimi without adding Provider branches to the Yo-managed loop. It admits closed endpoint-and-ModelId profiles for both Kimi Open Platform at https://api.moonshot.ai/v1/ and Kimi Code membership at https://api.kimi.com/coding/v1/; credentials and profiles never fall back or interchange across those products. The Platform K3, K2.7 Code, and K2.6 variants remain unchanged. Code exact k3 and k3-256k use the K3 reasoning-effort request plus preserved Thinking keep all with conservative Yo output hard capability 131072, while exact kimi-for-coding and kimi-for-coding-highspeed use the K2.7 thinking-enabled-and-preserved request with conservative output hard capability 32768. Every Code request sends stream_options.include_usage true so the required final semantic usage is requested for Code K3 and K2.7 alike. Every Code request sends its typed caller-supplied cache-affinity hint as prompt_cache_key only to the exact Code origin: the backend supplies stable per-Session values and the service coordinator supplies ephemeral verification-task values; Platform requests remain unchanged. Every private Code variant requires kimi-private-local-plaintext/v1 and the same schema-bound complete private assistant message as its Platform family. Every admitted profile sends a positive request-local max_completion_tokens no greater than its hard capability and request-local tools only after Kimi name and MFJS-subset admission. The Connector validates exact response object, model, role, fragment, finish, usage, tool-call evidence, and complete private projection, and replays the private assistant message unchanged only under the same exact complete binding identity and replay profile. Its finite transport and resource policy, same-origin redirects, no automatic retry, ten-minute verification deadline, cleanup before outcome, visibility exclusions, and secret-zeroization rules apply identically to both endpoints.

    The Connector treats optional non-negative usage.cached_tokens documented by Kimi as cache-read input tokens already included in prompt_tokens. It preserves whether that exact field was reported or absent, rejects a value greater than prompt_tokens, requires repeated usage placements to agree including cache telemetry, and does not infer cache writes, uncached tokens, cost, or a separate hit state.

    The optional complete-binding image_input_profile kimi-code-png-advisory/v1 is admitted only for the exact existing Code endpoint and four Code ModelIds, with unchanged thinking, private replay, tools, limits and output-cap rules. Absence retains existing string-only user content. Under the image profile, an image-bearing user message is an ordered Chat-style content array of exact text parts and image_url parts whose URL is data:image/png;base64, followed by canonical RFC 4648 base64 of the admitted immutable PNG, with no detail or extra image field. The same typed input snapshot is reused through ordinary, retained, resumed and forked context and summary image parts. Ordinary image requests preserve existing complete input, replay and transport bounds without introducing a separate total-image-history count or image-part-array byte ceiling. The distinct ephemeral summary source remains subject to the model-loop owner's 64-occurrence and 16MiB complete-source limits. No path, remote URL, file upload, alternate format or vision capability inference is admitted. The typed counter projection replaces only each known image part's image_url.url with the empty string, preserves its keys and order and every other complete request field, and separately returns ordered immutable image descriptors; this counter-only projection is never transported and does not search arbitrary JSON or tokenize base64. Policy kimi-code-image-advisory/v1 returns advisory input estimate T+2000*N and a separate once-per-request reserve of 1024 when N is positive, otherwise zero. All planning uses their checked sum, preserving non-image complete-payload accounting and provider usage as distinct immutable measured telemetry. The policy does not prove server acceptance or an upper bound, add a counter endpoint, broaden Platform bindings, or authorize automatic retry, image removal or cross-product fallback on a 4xx.

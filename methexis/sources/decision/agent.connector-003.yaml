payload:
  kind: decision
  content: 'The Kimi Chat Completions Model Connector implements the exact kimi-chat-completions dialect for ProviderId kimi without adding Provider branches to the Yo-managed loop. It admits closed endpoint-and-ModelId profiles for both Kimi Open Platform at https://api.moonshot.ai/v1/ and Kimi Code membership at https://api.kimi.com/coding/v1/; credentials and profiles never fall back or interchange across those products. The Platform K3, K2.7 Code, and K2.6 variants remain unchanged. Code exact k3 and k3-256k use the K3 reasoning-effort request plus preserved Thinking keep all with conservative Yo output hard capability 131072, while exact kimi-for-coding and kimi-for-coding-highspeed use the K2.7 thinking-enabled-and-preserved request with conservative output hard capability 32768. Every Code request sends its typed caller-supplied cache-affinity hint as prompt_cache_key only to the exact Code origin: the backend supplies stable per-Session values and the service coordinator supplies ephemeral verification-task values; Platform requests remain unchanged. Every private Code variant requires kimi-private-local-plaintext/v1 and the same schema-bound complete private assistant message as its Platform family. Every admitted profile sends a positive request-local max_completion_tokens no greater than its hard capability and request-local tools only after Kimi name and MFJS-subset admission. The Connector validates exact response object, model, role, fragment, finish, usage, tool-call evidence, and complete private projection, and replays the private assistant message unchanged only under the same exact complete binding identity and replay profile. Its finite transport and resource policy, same-origin redirects, no automatic retry, ten-minute verification deadline, cleanup before outcome, visibility exclusions, and secret-zeroization rules apply identically to both endpoints.'

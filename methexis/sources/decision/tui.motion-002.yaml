payload:
  kind: decision
  content: The built-in Rich loading marker uses rib's compact Braille loader sequence ⠋ ⠙ ⠹ ⠸ ⠼ ⠴ ⠦ ⠧ ⠇ ⠏, while ASCII uses | / - \\. A configured marker profile may provide a non-empty sequence of frame strings whose complete grapheme clusters each validate as width one or two under the selected Surface width profile. A frame's terminal-cell width is the checked sum of its validated cluster widths, and the marker column reserves the maximum such frame width. Each current frame is left-aligned and any unused reserved cells are blank, so frame changes never move the Working label or alter fitting geometry. The built-in marker frame interval is 80 milliseconds and any configured marker interval below the selected repaint interval is invalid. Frame selection is floor(elapsed / marker interval) modulo frame count, so late wakes skip missed frames rather than replaying them. The built-in shimmer repaint interval remains exactly 16 milliseconds; adaptive cadence is deferred until runtime evidence requires it. For elapsed fraction q in [0,1), a two-second sweep position p = -10 + q * (N + 20) crosses ten virtual padding cells on each side of an N-grapheme activity label. Grapheme i uses a raised-cosine intensity within distance five of p and zero outside it. The current marker frame uses the same equation with N = 1 and i = 0, and every grapheme in that frame receives the resulting single pulse style. TrueColor linearly blends appearance-resolved RGB endpoints with factor 0.9 * intensity and rounds each channel to the nearest integer. The process host classifies color capability before appearance publication; TrueColor enables the ramp while Limited or Unknown uses a bounded dim/default/bold fallback. Reduced motion freezes the first marker frame and activity text without timed repaint. One shared ActivityMotionFrame resolver supplies marker selection and intensity to shell Working, the marker, and typed selection-panel activity titles. Appearance owns the resolved capability, marker frames, reserved cell width, frame and repaint timing, endpoints, fallback roles, and motion mode so future user configuration can replace them without changing layout code. Motion may replace content only inside the fixed marker region and otherwise preserves text, geometry, fitting, input, interruption semantics, and committed-frame consistency. Braille reduces star-overhang exposure but cell-width reservation cannot guarantee a font's ink bounds, which remain terminal-smoke evidence.

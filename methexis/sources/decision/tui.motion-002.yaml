payload:
  kind: decision
  content: The initial built-in activity-motion profile uses a fixed one-cell Rich marker ✦ and ASCII marker *. Its exact repaint interval is 16 milliseconds and configurable animated intervals below 16 milliseconds are invalid. Late wakes select the current elapsed-time phase and skip missed frames rather than replaying them; adaptive cadence is deferred until runtime evidence requires it. For elapsed fraction q in [0,1), a two-second sweep position p = -10 + q * (N + 20) crosses ten virtual padding cells on each side of an N-grapheme activity label. Grapheme i uses a raised-cosine intensity within distance five of p and zero outside it. The marker uses the same equation with N = 1 and i = 0, producing a smooth color pulse without shape changes. TrueColor linearly blends appearance-resolved RGB endpoints with factor 0.9 * intensity and rounds each channel to the nearest integer. The process host classifies color capability before appearance publication; TrueColor enables the ramp while Limited or Unknown uses a bounded dim/default/bold fallback. Reduced motion is static. One shared ActivityMotionFrame resolver supplies intensity to shell Working, the marker, and typed selection-panel activity titles. Appearance owns the resolved capability, marker, timing, endpoints, fallback roles, and motion mode so future terminal-palette or user configuration can replace them without changing layout code. Motion changes style only and preserves text, geometry, fitting, input, interruption semantics, and committed-frame consistency.

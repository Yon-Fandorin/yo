  content: The initial built-in activity-motion profile holds each marker frame for 120 milliseconds. Rich uses the exact ping-pong cycle ·, ✢, ✳, ✶, ✻, ✽, ✽, ✻, ✶, ✳, ✢, · and ASCII uses the exact cycle ., *. Motion changes only the decorative marker and preserves independently supplied non-marker chrome semantics. The profile model permits a one-frame non-animated future candidate without changing runner scheduling.

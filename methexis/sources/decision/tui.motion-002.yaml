payload:
  kind: decision
  content: The initial built-in activity-motion profile holds each logical frame for 120 milliseconds. Rich uses the exact marker ping-pong cycle ·, ✢, ✳, ✶, ✻, ✽, ✽, ✻, ✶, ✳, ✢, · and ASCII uses the exact marker cycle ., *. A fixed-width sheen may move one emphasized grapheme at a time across the visible Working label or a typed activity panel-title status while preserving text, geometry, fitting, input, and interruption semantics. Dynamic indicators share the runner motion sample. A one-frame profile disables marker and sheen motion, and a sheen with fewer than two visible graphemes requests no timed redraw.

payload:
  kind: decision
  content: The initial built-in activity-motion profile holds each logical frame for 120 milliseconds. Rich uses the exact marker ping-pong cycle ·, ✢, ✳, ✶, ✻, ✽, ✽, ✻, ✶, ✳, ✢, · and ASCII uses the exact marker cycle ., *. The built-in marker uses a stable non-bold, non-dim appearance-resolved accent so changing star shapes does not combine with font-weight distortion. A fixed-width sheen moves one peak grapheme from the first visible grapheme through the last and wraps to the first, with an intermediate trail on up to one adjacent grapheme on each side, across the visible Working label or a typed activity panel-title status. The trail is clipped at label edges. Built-in muted, trail, peak, and marker roles use only the terminal default or palette-indexed colors; RGB remains reserved for later explicit theme configuration. One shared ActivityMotionFrame resolver supplies the peak and optional trail indices to every renderer. Marker and sheen preserve text, geometry, fitting, input, and interruption semantics and share the runner motion sample. A one-frame profile disables marker and sheen motion, and a sheen with fewer than two visible graphemes requests no timed redraw.

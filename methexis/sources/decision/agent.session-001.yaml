id: agent.session-001
revision: sha256:69c3802dbaa47b00199bfdeca949a476429e93272e38e89a70ee7650a67c1091
payload:
  kind: decision
  content: |-
    A Yo Session is one durable user-task identity identified by UUIDv7. Backend, model, transport, and backend Session locator are ordered versioned binding epochs within that Session. Every transition closes the prior epoch, every anchor names its epoch, and Journal consumers preserve epoch boundaries. Only a deliberate user fork creates a child Session and records its parent plus a source anchor or its explicit absence. Non-empty forks use a verified backend-native fork or the same exact and explicitly approved lossy replay rules as replacement bindings. History viewing remains separate from executable continuation. A Continuation Anchor identifies an accepted backend request, its stable outcome, the committed semantic Journal boundary, and the versioned binding and locator. Request Audit detail is never required to construct or validate it. Resume selects the newest anchor and never reconnects an older locator as though it contained later history. With no anchor, yo opens the Session read-only and may offer only an explicitly confirmed empty fork. Native resume verifies and continues the existing binding. When native resume fails, exact semantic replay may create a replacement binding in the same Yo Session while recording the transition, replay boundary, backend and model identities, and known provider-cache loss. Exact replay preserves committed roles, order, text, and tool relationships under the complete binding's explicit replay_profile. semantic-only/v1 forbids private state, while kimi-private-local-plaintext/v1 declares one hidden versioned provider-private extension eligible only for the same exact binding and profile; missing, cross-epoch, or mismatched private state makes exact replay unavailable. Any source Anchor containing private state requires lossy_handoff when the target cannot consume the exact same item, even if the target itself is semantic-only, unless a reviewed lossless conversion exists. A lossy handoff requires one explicit user approval and a visible context-loss Journal boundary while preserving original durable history. Its disclosure names private-state schema, presence, size, and preservation capability without revealing contents. Yo never silently performs a lossy handoff, resends an uncertain request, or labels a replacement binding as native resume.

    Each backend binding explicitly selects one versioned continuation strategy: exact replay executed by the local client or a managed Session server, or backend-managed state. Every exact-replay binding carries its normalized replay_profile in durable binding evidence; legacy absence means semantic-only/v1, while kimi-private-local-plaintext/v1 declares the Kimi private assistant schema shared by the admitted K3 and K2.7 Code profiles. Exact replay has one semantic contract independent of executor location; backend-managed state verifies the backend session identity and does not claim a replay delta. Managed-server replay remains deferred until its repository and retention evidence exists.

payload:
  kind: decision
  content: Execution continuation and history viewing are separate capabilities. A Continuation Anchor identifies an accepted backend request, its correlated stable resumable outcome, the fully committed semantic Journal boundary, and the versioned backend Session locator needed to continue. Those identities and the locator are bounded Session Journal correlation data, not optional Request Audit detail. Request payloads, headers, revision or attempt evidence, and other diagnostic detail are never required to construct or validate an Anchor. Resume selects the newest durable Continuation Anchor; incomplete, unaccepted, or uncommitted suffixes remain diagnostic evidence only. With no durable anchor, yo opens the saved Session read-only and may offer only an explicitly confirmed empty child Session that records its parent and the absence of a source anchor; it never replays or resends the suffix. A recovery snapshot may support a later anchor only after durable publication completes and every anchor condition is satisfied; the snapshot alone does not create one. A backend with Native Resume reconnects through the anchor's versioned Session locator and verifies the returned identity. Failure opens the saved Session read-only and asks whether to continue in a new child Session. User-authorized continuation creates explicit parent-child lineage, keeps the parent immutable, and seeds only the committed semantic boundary through a backend-supported exact replay; unsupported fidelity is disclosed before starting. Yo never silently creates a replacement Session, resends an uncertain request, or presents a new Session as native resume.

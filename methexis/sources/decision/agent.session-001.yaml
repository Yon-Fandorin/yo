  kind: decision
  content: A backend_native_model_rebind/v1alpha1 may preserve same-host same-account conversational state only through a distinct state-preserving native-fork locator. Model mutation and exact confirmation occur solely on the candidate; the source locator is never mutated or reused. Yo publishes the prepared candidate as a new binding epoch atomically, while any fork, mutation, identity, confirmation, or publication failure preserves the executable source and leaves the unbound candidate without continuation authority. Other Host-to-Managed, Managed-to-Host, cross-Host, and non-native same-Host replacement uses transformed-semantic-handoff/v1alpha1 with one explicit loss confirmation.

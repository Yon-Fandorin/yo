payload:
  kind: decision
  content: Execution continuation and history viewing are separate capabilities. A Continuation Anchor identifies an accepted backend request, its correlated stable resumable outcome, the fully committed semantic journal boundary, and the versioned backend session locator needed to continue. Resume selects the newest durable Continuation Anchor; incomplete, unaccepted, or uncommitted suffixes remain diagnostic evidence only. With no durable anchor, yo opens the saved session read-only and may offer only an explicitly confirmed empty child session that records its parent and the absence of a source anchor; it never replays or resends the suffix. A recovery snapshot may support a later anchor only after durable publication completes and every anchor condition is satisfied; the snapshot alone does not create one. A backend with Native Resume reconnects through the anchor's versioned session locator and verifies the returned identity. Failure opens the saved session read-only and asks whether to continue in a new child session. User-authorized continuation from an anchor creates explicit parent-child lineage and seeds only the committed semantic boundary through a backend-supported exact replay; unsupported fidelity is disclosed before starting. Yo never silently creates a replacement session, resends an uncertain request, or presents a new session as native resume.

schema: methexis.source/v1alpha1
id: agent.session-001
revision: sha256:5351e29ca017025832c40404fcabeccab7151d565a510fb9708784ce95349242
payload:
  kind: decision
  content: |-
    A Yo Session is one durable user-task identity identified by UUIDv7. Backend, model, transport, and backend Session locator are ordered versioned binding epochs within that Session. Every transition closes the prior epoch, every anchor names its epoch, and Journal consumers preserve epoch boundaries. Only a deliberate user fork creates a child Session and records its parent plus a source anchor or its explicit absence. Non-empty forks use a verified backend-native fork or the same exact and explicitly approved lossy replay rules as replacement bindings. History viewing remains separate from executable continuation. A Continuation Anchor identifies an accepted backend request, its stable outcome, the committed semantic Journal boundary, and the versioned binding and locator. Request Audit detail is never required to construct or validate it. Resume selects the newest anchor and never reconnects an older locator as though it contained later history. With no anchor, yo opens the Session read-only and may offer only an explicitly confirmed empty fork. Native resume verifies and continues the existing binding. When native resume fails, exact semantic replay may create a replacement binding in the same Yo Session while recording the transition, replay boundary, backend and model identities, and known provider-cache loss. Exact replay preserves committed roles, order, text, and tool relationships under the complete binding's explicit replay_profile. semantic-only/v1 forbids private state, while kimi-private-local-plaintext/v1 declares one hidden versioned provider-private extension eligible only for the same exact binding and profile; missing, cross-binding-epoch, or mismatched private state makes exact replay unavailable. Any source Anchor containing private state requires lossy_handoff when the target cannot consume the exact same item, even if the target itself is semantic-only, unless a reviewed lossless conversion exists. A lossy handoff requires one explicit user approval and a visible context-loss Journal boundary while preserving original durable history. Its disclosure names private-state schema, presence, size, and preservation capability without revealing contents. Yo never silently performs a lossy handoff, resends an uncertain request, or labels a replacement binding as native resume.

    Each backend binding explicitly selects one versioned continuation strategy: exact replay executed by the local client or a managed Session server, or backend-managed state. Every exact-replay binding carries its normalized replay_profile in durable binding evidence; legacy absence means semantic-only/v1, while kimi-private-local-plaintext/v1 declares the Kimi private assistant schema shared by the admitted K3 and K2.7 Code profiles. Exact replay has one semantic contract independent of executor location; backend-managed state verifies the backend session identity and does not claim a replay delta. Managed-server replay remains deferred until its repository and retention evidence exists.

    One monotonic context epoch is Session-global and independent of backend binding epochs. The initial binding starts context epoch 1, every later binding inherits the current value unchanged, and only a durable same-binding context checkpoint advances it by exactly one; a policy change or binding transition does not. Each accepted model request identifies the context epoch current at its dispatch. A Turn may span context epochs only when a checkpoint is committed between complete correlated semantic groups and before its next request; its one terminal replay delta, resumable outcome, and Continuation Anchor use the newest epoch and latest accepted request, while earlier requests remain historical evidence in their original epochs. Once a checkpoint exists it replaces the earlier general newest-Anchor rule for model-context reconstruction: recovery starts from its exact system/tools replay contract, synthetic user-role body, and exact retained groups, then applies only successor-epoch delta suffixes through the newest matching Anchor. Its source Anchor remains provenance, historical records at or before the source boundary stay valid, and only records appended afterward with the superseded epoch are stale. A checkpoint with no later accepted request is a sufficient reconstruction root; a later accepted request without a completed matching Anchor remains uncertain and read-only. The cumulative replay bound measures the reconstructed root and successor deltas, not the summarized prefix. A checkpoint neither changes binding-transition cache evidence nor infers Provider cache preservation or loss; only cache-read tokens reported by later actual ModelWork usage are evidence of a cache read. The persisted monotonic `context_policy_changed` revision for `yo.context-policy/v1alpha1`, when enabled with `portable-summary/v1alpha1`, is the standing automatic approval for the exact bounded compaction pipeline and does not ask again at each pressure event; an explicit `/compact` is the matching manual invocation. This is the sole exception to per-handoff approval and covers only the exact source boundary, visible structured summary, retained semantic suffix, disclosure-only Session-scoped artifact receipts, dropped-private disclosure, measurements, exact replay contract, and successor context epoch atomically committed by `yo.context-checkpoint/v1alpha1`. Private items may be dropped only from the summarized prefix; a retained private group remains exact and indivisible across the context-epoch increment because its binding epoch stays unchanged, while the synthetic user-role summary requires no private assistant counterpart. A replacement binding sources the newest executable reconstruction: a successor Anchor whose lineage includes the checkpoint, or the checkpoint directly when it has no later accepted request; it never falls back to the pre-checkpoint provenance Anchor. `exact-replay-only/v1alpha1` and disabled compaction authorize no automatic or manual loss. Every replacement-driven lossy handoff, including Provider, Model, connector, endpoint, replay-profile, or schema change, still requires one explicit confirmation and cannot reuse context-compaction policy.

payload:
  kind: decision
  content: A Yo Session is one durable user-task identity identified by UUIDv7. Backend, model, transport, and backend Session locator are ordered versioned binding epochs within that Session. Every transition closes the prior epoch, every anchor names its epoch, and Journal consumers preserve epoch boundaries. Only a deliberate user fork creates a child Session and records its parent plus a source anchor or its explicit absence. Non-empty forks use a verified backend-native fork or the same exact and explicitly approved lossy replay rules as replacement bindings. History viewing remains separate from executable continuation. A Continuation Anchor identifies an accepted backend request, its stable outcome, the committed semantic Journal boundary, and the versioned binding and locator. Request Audit detail is never required to construct or validate it. Resume selects the newest anchor and never reconnects an older locator as though it contained later history. With no anchor, yo opens the Session read-only and may offer only an explicitly confirmed empty fork. Native resume verifies and continues the existing binding. When native resume fails, exact semantic replay may create a replacement binding in the same Yo Session while recording the transition, replay boundary, backend and model identities, and known provider-cache loss. Exact replay preserves committed roles, order, text, and tool relationships but does not promise provider-private state or identical output. A lossy handoff requires one explicit user approval and a visible context-loss Journal boundary while preserving original durable history. Yo never silently performs a lossy handoff, resends an uncertain request, or labels a replacement binding as native resume.

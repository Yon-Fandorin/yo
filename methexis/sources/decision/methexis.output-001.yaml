payload:
  kind: decision
  content: Successful create-checkpoint and propose-activation operations report a reproducible semantic delta between the candidate Checkpoint and the active Checkpoint captured from the same pinned trusted snapshot. The compact result binds the trusted commit, both Checkpoint identities and hashes, the candidate artifact locator, per-unit before/after revisions or absence, per-root before/after presence, candidate closure count, and unchanged-unit count. It omits unchanged closure detail from success output while failures retain complete affected-identifier evidence.

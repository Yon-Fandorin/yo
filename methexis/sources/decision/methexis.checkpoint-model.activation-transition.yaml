id: methexis.checkpoint-model.activation-transition
revision: sha256:6651c9634b9c0bb6148b9267189b407fc04f8f0f4daf4f9289e7e0854f3f9fa4
payload:
  kind: decision
  content: >-
    A tracked active-Checkpoint record points to one exact Checkpoint and content
    hash. Activation is a separately reviewed Git change that adds or updates
    the immutable Checkpoint and active record together and becomes authoritative
    only when the accepted commit is reachable from the configured trust anchor.
    Replacement records bind the exact prior trusted active-record hash as a
    compare-and-swap predecessor, with no predecessor for initial activation and
    no force path. Proposal requires the current trusted commit and reproducible
    Checkpoint lineage. Before integration, the transition must obtain and obey
    a passing result from the current Source-freshness guard owned by SOT-006;
    the guard's input, status, demotion, context-exclusion, and failure semantics
    remain outside this decision. A non-passing result rejects the prospective
    activation. Integrated authority requires the Checkpoint-owned basis commit
    to remain readable and ancestral, the Checkpoint to reproduce, the current
    approved closure to match, and the SOT-006 guard to pass before the
    Checkpoint is derived active.

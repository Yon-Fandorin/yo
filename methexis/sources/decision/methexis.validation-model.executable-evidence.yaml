  content: Checkpoint activation verifies approval and Source freshness, complete required closure, exclusion of replaced knowledge, current executable evidence, and reproducible evidence for the approval's declared review basis. Canonical approval reproduces its exact English revision directly; Projection approval additionally reproduces the referenced Korean Projection. Content-addressed reuse and affected-only staleness remain unchanged.

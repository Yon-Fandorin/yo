id: methexis.projection-model.korean-review
revision: sha256:051baf7734b890170422928469ffe1d0f437a0567424e468dd3545762fedb7ee
payload:
  kind: decision
  content: Methexis uses Source and canonical English Knowledge as the semantic authoring and agent-review surface. The complete semantic-first-ko-on-demand/v1 capability selects the current operation path and adds no durable authority lineage; without it, the exact-human-approved legacy flow remains controlling. Under the capability, author-revision changes only Source and Knowledge. After the exact semantic candidate clears review, project-review creates or replaces one Korean Projection only on human request. The Projection binds exact RevisionId, profile, compiler, request lineage, and bytes; stale or directly edited files fail validation. Human approval binds the revision and Projection hash. Legacy artifacts remain valid for their exact approved revisions without bulk migration.

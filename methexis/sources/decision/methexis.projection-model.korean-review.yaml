id: methexis.projection-model.korean-review
revision: sha256:25844581c9b9d743ee7ba7b88884dc29135842ae0f8d08ec9c5393c9359b343d
payload:
  kind: decision
  content: Methexis keeps one generated Korean review Projection per KnowledgeId under methexis/review-projections. It binds the exact RevisionId, Projection profile, compiler identity, deterministic request lineage, and exact reviewed file bytes. Direct edits, revision drift, and lineage drift are structural failures; replacement is regenerated only from an explicit request.

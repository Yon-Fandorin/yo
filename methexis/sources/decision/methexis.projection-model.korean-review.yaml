id: methexis.projection-model.korean-review
revision: sha256:434651c2f922ce8133ce5f589234d70d1b49ca14a82d3756b1e716aaef2ddcbf
payload:
  kind: decision
  content: Canonical English Knowledge is the semantic review surface. With canonical-approval-on-demand-projection/v1, Korean Projection is optional and created only on explicit human request when additional Korean understanding is wanted and no fresh exact-revision Projection exists. Canonical approval neither requires nor generates it. Projection-backed approval still binds exact lineage; stale optional Projection is ineligible evidence but does not block canonical approval, while malformed or directly edited Projection fails closed. Existing Projection approvals remain valid.

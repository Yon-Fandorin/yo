payload:
  kind: decision
  content: The initial static TUI input chrome reserves a transient work row above the prompt and places host-known metrics plus presentation mode below it. Active Esc and Ctrl+C both interrupt; unavailable status data is omitted; narrow layouts drop typed low-priority segments without wrapping; time-driven motion remains a later Slice.

payload:
  kind: decision
  content: 'The static TUI input chrome reserves a transient work row above the prompt, then places host-known metrics and fitted key help with the presentation mode below it. Active Esc and Ctrl+C both interrupt except in Chat for an outstanding ordinary nonsecret question advertising allow_unanswered: Esc sends the exact no-answer response and Ctrl+C interrupts. Context-specific hints show both meanings when they fit; hidden or narrow question geometry never changes no answer into interruption. A visible local palette keeps dismissal priority. Idle Esc remains unhandled. Input policy exposes semantic interrupt, configured-newline, and empty-prompt-exit availability; one TUI terminal-notation owner renders familiar Esc, caret-control, and modifier-prefix labels, while GUI frontends may choose platform notation. If the footer cannot fit, interruption help moves into the work row before decorative motion; if neither row fits both labels, the visual hint may disappear without changing dispatch. After the prompt and transcript floor, row priority is work, metrics, footer; within an active footer, interruption outlives mode, newline, exit, and decoration, with newline preferred over empty-prompt exit. A concrete visible prompt overlay may reuse the reserved work row plus adjacent transcript cells without relayout: fitting is decided before suppression, Esc dismisses only the overlay, and Ctrl+C bypasses overlay bindings to interrupt the active Turn. Closing or non-presentation restores the work row from current state. Unavailable status data is omitted; narrow layouts drop typed low-priority segments without wrapping; time-driven motion is governed separately.'

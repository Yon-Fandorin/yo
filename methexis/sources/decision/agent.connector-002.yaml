payload:
  kind: decision
  content: The provider-neutral OpenAI Chat Completions Model Connector implements the explicit openai-chat-completions API dialect over HTTPS with SSE streaming. It is selected only through the effective binding's dialect-derived connector identity, appends chat/completions to a normalized base URL, sends bearer authorization, and never probes or falls back to Responses. It projects exact replay as ordered system, user, and assistant messages; an assistant message preserves visible content, visible refusal, and correlated tool_calls as independent fields, followed by exact tool-result messages. Each request carries admitted request-local tool exposure. Enabled exposure is valid only under local-tools/v1 and sends the frozen registry's declared function tools and automatic tool choice; disabled exposure omits both, is mandatory under no-tools/v1 and for connection verification, and preserves exact semantic replay without changing the durable binding policy. It sends streaming usage and an output-token cap. The stream translates one correlated choice of content, refusal, optional reasoning_content, indexed tool-call deltas, finish reason, usage, and the mandatory final [DONE] sentinel into connector-neutral observations. A refusal is a completed visible assistant response, not a transport failure, and remains in exact replay. A length finish is a typed incomplete failure excluded from replay and every Continuation Anchor. Absent or null intermediate usage is ignored; exactly one non-null final usage record is required. The connector rejects ambiguous choice or tool correlation, missing usage or terminal evidence, data after [DONE], unsafe redirects, unbounded data, and retry after any admitted response item. It enforces finite transport-progress and event-delivery deadlines and applies a non-resetting absolute request deadline only when the agent supplies one; agent model work defaults that absolute deadline to absent. Provider-specific models, endpoints, defaults, optional parameters, and runtime deadline policy remain outside connector identity.

payload:
  kind: decision
  content: |-
    The provider-neutral OpenAI Chat Completions Model Connector implements the explicit openai-chat-completions API dialect over HTTPS with SSE streaming. It is selected only through the effective binding's dialect-derived connector identity, appends chat/completions to a normalized base URL, sends bearer authorization, and never probes or falls back to Responses. It projects exact replay as ordered system, user, and assistant messages; an assistant message preserves visible content, visible refusal, and correlated tool_calls as independent fields, followed by exact tool-result messages. Each request carries admitted request-local tool exposure. Enabled exposure is valid only under local-tools/v1 and sends the frozen registry's declared function tools and automatic tool choice; disabled exposure omits both, is mandatory under no-tools/v1 and for connection verification, and preserves exact semantic replay without changing the durable binding policy. It sends streaming usage. When the effective profile has a known hard max_output_tokens, it sends a positive request-local max_tokens no greater than it; when that profile field is absent because Yo does not know the maximum, it omits max_tokens rather than guessing a number. The stream translates one correlated choice of content, refusal, optional reasoning_content, indexed tool-call deltas, finish reason, usage, and the mandatory final [DONE] sentinel into connector-neutral observations. A refusal is a completed visible assistant response, not a transport failure, and remains in exact replay. A length finish is a typed incomplete failure excluded from replay and every Continuation Anchor. Absent or null intermediate usage is ignored; exactly one non-null final usage record is required after semantic choice finish. Its choices is either empty or contains one index-zero accounting choice repeating the exact prior finish_reason with a delta restricted to optional assistant role and empty content (absent or null fields are also allowed). No other accounting delta fields, new output, changed finish status, or repeated tool execution is admitted; native_finish_reason remains non-authoritative transport metadata. Usage-before-finish, duplicate usage in either shape, malformed accounting choices, ordinary post-finish choices, or missing [DONE] fail closed under unchanged numeric and transport bounds. The connector rejects ambiguous choice or tool correlation, missing usage or terminal evidence, data after [DONE], unsafe redirects, unbounded data, and retry after any admitted response item. It enforces finite transport-progress and event-delivery deadlines and applies a non-resetting absolute request deadline only when the agent supplies one; agent model work defaults that absolute deadline to absent. Provider-specific models, endpoints, defaults, optional parameters, and runtime deadline policy remain outside connector identity.

    ## Admitted PNG request projection

    An effective binding carrying a separately reviewed image-input profile may
    use this connector only after complete-envelope admission by the service owner
    and the connector's defensive check. The initial additional service envelope
    is `openrouter-free-png-advisory/v1` from `agent.model.service-binding`; the
    connector remains provider-neutral and acquires no Provider-named dialect or
    implicit capability. An absent profile retains the existing text-only bytes
    and rejection of image-bearing inputs. An unknown or mismatched profile fails
    before transport, and no remote capability flag supplies executable policy.

    For each admitted multimodal user input, the connector emits exactly one
    `user` message whose `content` is the original ordered array. Each text part is
    `{"type":"text","text":<exact text>}`; each image part is
    `{"type":"image_url","image_url":{"url":<PNG data URL>}}`. The data URL is
    `data:image/png;base64,` followed by canonical padded standard base64 of the
    already admitted immutable PNG snapshot. Repeated images remain separate
    occurrences. No path, remote URL, re-read, resize, thumbnail, generated caption,
    reordering or deduplication may replace those bytes. Historical multimodal
    inputs use the same exact projection on every continuation and fresh-process
    resume. System, assistant, refusal, tool-call and result semantics remain as
    specified above; hidden reasoning and provider-private replay remain excluded.

    Image-bearing summary sources use the same array encoding with their exact
    versioned manifest as the first text part followed by the exact ordered image
    occurrences. The connector validates the complete source manifest and matching
    snapshot descriptors under the managed-loop summary contract before transport.
    The existing ordinary-input limits, separate 64-image/16-MiB complete summary
    source limits, and request/replay limits all apply. The first excess rejects;
    no truncation, split summary, dropped occurrence or retry repairs an oversized
    request. The request-local tools-disabled rule also applies to image summaries.

    The admitted service policy carries only its closed declared request options;
    the connector serializes them without permitting replacement of model,
    messages, streaming, usage, output-cap or tool-exposure fields. For the initial
    service envelope these are the exact routing fields owned by service-binding,
    and they remain present even for requests with no images. Arbitrary optional
    parameters remain unsupported. The image-free tokenization projection retains
    every serialized non-image field and each image-bearing user message, replacing
    its content array with the ordered text parts only; image parts and their data
    URLs are omitted rather than counted as text or replaced with fake captions.
    The connector separately returns typed immutable descriptors for every image
    occurrence in request order. The selected backend policy supplies advisory
    image cost without inspecting arbitrary JSON or making a remote estimate.

    PNG admission does not relax the existing streaming grammar, bounded transport,
    usage, cancellation, or failed/incomplete-response Anchor exclusion. The
    additional image profile permits no automatic resend or provider/model fallback,
    including before the first response item; this narrows the general bounded
    pre-response retry permission for this profile. A JSON error in an HTTP 200
    response or a stream error is a failed request, never a completed assistant
    response or evidence that images should be removed. The additional projection
    MUST activate with its compatible service-binding and managed-loop accounting
    revisions before it can admit image transport.

    ### QwenCloud general PNG request policy

    The additional `qwencloud-general-png-advisory/v1` envelope is admitted only
    under the service-binding owner's exact endpoint, model and complete profile.
    It reuses the preceding ordered PNG, history, tool-result and image-summary
    projection with no new dialect. Both declared boolean options
    `enable_thinking: false` and `preserve_thinking: false` are serialized exactly
    at the top level on every request, including requests with zero images; neither
    SDK-only `extra_body` wrapping nor arbitrary optional-parameter passthrough is
    admitted. The image-free tokenization projection retains both options and all
    other final serialized non-image fields. Thinking and provider-private replay
    remain disabled; unexpected remote reasoning cannot become replay authority.

    For enabled request-local tool exposure, this envelope serializes the frozen
    function registry and exact `tool_choice: auto`; disabled exposure omits both.
    The existing OpenRouter image envelope continues to use automatic selection
    without explicit `tool_choice`, as required by its own admitted service policy.
    Selection comes from typed policy derived by complete-envelope admission, not
    a blanket rule for image-bearing requests or a Provider branch in the backend.
    The positive selected per-request output cap remains `max_tokens` and never
    exceeds the admitted 131072 maximum. Reasoning-effort overrides fail under this
    empty-reasoning envelope. No conflicting output/tool field or relaxed options
    may replace the admitted policy.

    In addition to the unchanged ordinary-input, replay and summary-source limits,
    the complete QwenCloud request admits at most 250 PNG occurrences, at most
    16,777,216 total canonical PNG bytes, and at most 33,554,432 encoded JSON request
    bytes. Counts include repetitions and retained history, not only the newest
    input. These finite local media/transport limits are checked on the actual
    complete projection before dispatch and also during tokenization/admission;
    image-free counting must not bypass them. A limit or checked-arithmetic overflow
    fails the request before transport. No truncation, image removal, splitting,
    fallback or resend repairs it. The already accepted separate summary cap of
    64 image occurrences and 16 MiB complete canonical source bytes still applies.
    Image preparation/admission failures preserve the existing draft behavior;
    failed historical replay or summary does not publish a fabricated successor.

    PNG support does not change the existing single-choice SSE grammar, exact
    correlation, mandatory final usage and `[DONE]`, deadlines, bounded decoding,
    cancellation or failed/incomplete-response Anchor exclusion. Its first
    activation MUST include the matching service-binding and managed-loop
    accounting revisions. Runtime support, projection tests and actual service
    evidence remain separate: direct API image success alone does not establish
    the Yo attachment, submission, compaction and fresh-resume journey.

payload:
  kind: decision
  content: A grapheme write is atomic and never shifts surrounding cells; the primitive owns non-shifting physical cell overwrite and footprint cleanup, while wrapping, ellipsis, logical text-sequence insertion, deletion, replacement, and width-changing reflow belong to the upper text model and layout.

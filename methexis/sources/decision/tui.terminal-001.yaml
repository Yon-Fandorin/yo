payload:
  kind: decision
  content: Inline mode publishes only a contiguous prefix of final Chat transcript items to native main-screen scrollback after the matching persistent rows and compact live viewport have been flushed, retains complete semantic history, advances publication by stable item identity and final revision, renders only the unpublished suffix and interactive chrome in a height-bounded active viewport during FollowTail, freezes publication for detached or diagnostic views, emits only the unpublished session suffix after restoration on normal or typed-termination exit, and leaves fatal failure and Fullscreen behavior unchanged; post-flush geometry observation acknowledges a proven complete persistent prefix independently from live-viewport ownership so resize reprepares only the unpublished live suffix without replaying or reflowing published history, while recoverable partial writes use exact unbuffered terminal-stream progress and an expected-effect ledger to restart reversible owned output or preserve an irreversible exact prefix and resume its remainder, allowing duplicate replay only after exact reconciliation is impossible, never advancing semantic publication on an unproven commit, and treating ungrounded parser state as fatal.

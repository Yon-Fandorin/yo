payload:
  kind: decision
  content: Inline mode owns one active main-screen viewport below persistent scrollback and a logical bottom anchor, may leave the physical terminal cursor at the prompt caret between frames, redraws in place across ordinary size changes without an absolute cursor-position query, restores cursor visibility on every exit, and re-anchors without erasing unowned output only when ownership can no longer be trusted.

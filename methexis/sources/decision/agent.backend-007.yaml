id: agent.backend-007
revision: sha256:0173528a6b1f486aa92f90b12d2f4b3f76f3ba23ad53248de3a0aa9f9267dc45
payload:
  kind: decision
  content: Agent integration is classified independently by orchestration ownership, connector, execution target, transport, workspace host, and tool-execution host. A Delegated Agent Backend connects to an external coding-agent host such as Codex app-server, Grok Build ACP, or Kimi Code, which owns its agent loop, tools, and backend session. A Yo-managed Backend keeps that ownership in yo and reaches a model service through a Model Connector. Generic backend contracts, replay types, and the bounded opaque provider-private replay envelope belong to the independent yo-backend foundation, while yo-core specializes the provider-neutral AgentBackend port and never depends on a concrete backend. Concrete backends remain the flat yo-backend-managed, yo-backend-delegated-codex, and yo-backend-delegated-grok crates. yo-core separately owns only provider-neutral Model Connector ports, shared Connector semantic types, and the closed api_dialect-to-Connector identity registry. Concrete dialect implementations remain flat yo-connector-openai-responses, yo-connector-openai-chat-completions, and yo-connector-kimi crates under crates/connectors; they depend on yo-core, may depend on yo-backend only for its neutral replay contract, never depend on one another, and neither yo-core, yo-backend, nor yo-backend-managed depends on them. A concrete Connector alone decodes and validates its provider-private payload and returns a connector-neutral validated visible projection beside the opaque bounded replay envelope; the managed backend checks only neutral envelope identity, epoch, bounds, and projection equality. An internal yo-connector-transport crate may share bounded HTTPS and SSE byte mechanics only, without dialect, Provider policy, model profile, semantic replay meaning, or provider-private interpretation. yo-cli maps an already derived exact Connector identity to a concrete factory and injects it into the managed backend and model-service verification path without Provider probing or fallback. Every Agent Backend and Model Connector reports only its exact observable request boundary. External-review delivery keeps a ManagedModel and a Delegated HostTarget as disjoint first-class identities and never invents Provider or Account coordinates for a host. The exact yo.delegated-review-execution/v1alpha1 profile is selected by print-mode --sandbox read-only, permits only host-owned read-only inspection, and is distinct from managed no-tools. Codex disables web search and fixes approvalPolicy never plus a read-only network-disabled sandbox on create, resume, and every Turn. Grok launches ACP with its read-only sandbox, dontAsk, only Read and Grep built-ins, web and subagents disabled, and no Yo-supplied MCP servers. The durable host binding freezes that profile and resume restores it without downgrade. External review sends one immutable packet in one fresh isolated host Session. Finding-resolution delivery resumes that exact Session with one immutable packet per step. Frozen authorizations retain one direct resolution; a separately versioned bounded-multihop authorization may permit an explicit finite maximum, and egress must count the immutable review-delta chain and bind each step to the immediately preceding delivery receipt. The first step beyond the authorized maximum must fail before host delivery. Every step forbids retry, steer, fallback, target switch, and a second host request. Claims state the actual host-owned tool surface and host-request identity; they never report managed tool_execution false or infer Provider usage that Yo cannot observe.

id: agent.backend-007
revision: sha256:347f5f6817cd685426c1388acb3d4833ab6ef04e579388d138674c08681ad625
payload:
  kind: decision
  content: Agent integration is classified independently by orchestration ownership, connector, execution target, transport, workspace host, and tool-execution host. A Delegated Agent Backend connects to an external coding-agent host such as Codex app-server, Grok Build ACP, or Kimi Code, which owns its agent loop, tools, and backend session. A Yo-managed Backend keeps that ownership in yo and reaches a model service through a Model Connector. Generic backend contracts, replay types, and the bounded opaque provider-private replay envelope belong to the independent yo-backend foundation, while yo-core specializes the provider-neutral AgentBackend port and never depends on a concrete backend. Concrete backends remain the flat yo-backend-managed, yo-backend-delegated-codex, and yo-backend-delegated-grok crates. yo-core separately owns only provider-neutral Model Connector ports, shared Connector semantic types, and the closed api_dialect-to-Connector identity registry. Concrete dialect implementations remain flat yo-connector-openai-responses, yo-connector-openai-chat-completions, and yo-connector-kimi crates under crates/connectors; they depend on yo-core, may depend on yo-backend only for its neutral replay contract, never depend on one another, and neither yo-core, yo-backend, nor yo-backend-managed depends on them. A concrete Connector alone decodes and validates its provider-private payload and returns a connector-neutral validated visible projection beside the opaque bounded replay envelope; the managed backend checks only neutral envelope identity, epoch, bounds, and projection equality. An internal yo-connector-transport crate may share bounded HTTPS and SSE byte mechanics only, without dialect, Provider policy, model profile, semantic replay meaning, or provider-private interpretation. yo-cli maps an already derived exact Connector identity to a concrete factory and injects it into the managed backend and model-service verification path without Provider probing or fallback. Every Agent Backend and Model Connector reports only its exact observable request boundary. External-review delivery keeps a ManagedModel and a Delegated HostTarget as disjoint first-class identities and never invents Provider or Account coordinates for a host. The exact yo.delegated-review-execution/v1alpha1 profile is selected by print-mode --sandbox read-only, permits only host-owned read-only inspection, and is distinct from managed no-tools. Codex disables web search and fixes approvalPolicy never plus a read-only network-disabled sandbox on create, resume, and every Turn. Grok prefers its native read-only sandbox with dontAsk, only Read and Grep built-ins, web and subagents disabled, and no Yo-supplied MCP servers. When request-free admission proves that the Linux host cannot start that native profile, bounded immutable-packet external review may instead select exact yo-bwrap-read-only/v1alpha1. The outer profile uses a read-only root and workspace, private runtime and temporary mounts, namespace and capability isolation, masked host runtime sockets, and only exact Grok state plus Session-repository writable binds; it launches Grok with sandbox off, dontAsk, an empty tool registry, web and subagents disabled, and no Yo-supplied MCP servers. The backend re-attests the exact marker, a read-only sentinel mount, and blocked workspace writes before ACP spawn, so an environment marker alone cannot select the fallback. Unsupported or incomplete outer isolation fails closed, native remains preferred, and the receipt records the actual selected isolation. The durable host binding freezes that profile and resume restores it without downgrade. External review sends one immutable packet in one fresh isolated host Session. Finding-resolution delivery resumes that exact Session with one immutable packet per step. Frozen authorizations retain one direct resolution; a separately versioned bounded-multihop authorization may permit an explicit finite maximum, and egress must count the immutable review-delta chain and bind each step to the immediately preceding delivery receipt. The first step beyond the authorized maximum must fail before host delivery. Every step forbids retry, steer, fallback, target switch, and a second host request. Claims and receipts state the actual selected execution isolation, host-owned tool surface, and host-request identity; they never report managed tool_execution false or infer Provider usage that Yo cannot observe.

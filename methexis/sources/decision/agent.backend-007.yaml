id: agent.backend-007
revision: sha256:3263653b2cae2683b0c0a7181f58e0d8124bd6b059db41deeebafa3123b0d270
payload:
  kind: decision
  content: Agent integration is classified independently by orchestration ownership, connector, execution target, transport, workspace host, and tool-execution host. A Delegated Agent Backend connects to an external coding-agent host such as Codex app-server, Grok Build ACP, or Kimi Code, which owns its agent loop, tools, and backend session. A Yo-managed Backend keeps that ownership in yo and reaches a model service through a Model Connector. Generic backend contracts, replay types, and the bounded opaque provider-private replay envelope belong to the independent yo-backend foundation, while yo-core specializes the provider-neutral AgentBackend port and never depends on a concrete backend. Concrete backends remain the flat yo-backend-managed, yo-backend-delegated-codex, and yo-backend-delegated-grok crates. yo-core separately owns only provider-neutral Model Connector ports, shared Connector semantic types, and the closed api_dialect-to-Connector identity registry. Concrete dialect implementations remain flat yo-connector-openai-responses, yo-connector-openai-chat-completions, and yo-connector-kimi crates under crates/connectors; they depend on yo-core, may depend on yo-backend only for its neutral replay contract, never depend on one another, and neither yo-core, yo-backend, nor yo-backend-managed depends on them. A concrete Connector alone decodes and validates its provider-private payload and returns a connector-neutral validated visible projection beside the opaque bounded replay envelope; the managed backend checks only neutral envelope identity, epoch, bounds, and projection equality. An internal yo-connector-transport crate may share bounded HTTPS and SSE byte mechanics only, without dialect, Provider policy, model profile, semantic replay meaning, or provider-private interpretation. yo-cli maps an already derived exact Connector identity to a concrete factory and injects it into the managed backend and model-service verification path without Provider probing or fallback. Every Agent Backend and Model Connector reports only its exact observable request boundary.

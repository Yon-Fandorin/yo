id: agent.backend-007
revision: sha256:e8a41776fd9854d6651c837d1a2e24683a1b12606ac0f9bdcf0757631c9e73e0
payload:
  kind: decision
  content: Agent integration is classified independently by orchestration ownership, connector, execution target, transport, workspace host, and tool-execution host. A Delegated Agent Backend connects to an external coding-agent host such as Codex app-server, Grok Build ACP, or Kimi Code, which owns its agent loop, tools, and backend session. A Yo-managed Backend keeps that ownership in yo and reaches a model service through a Model Connector such as OpenAI or Kimi. Provider names identify model services, not delegated agent processes. Local and Remote are execution placements rather than distinct backend kinds, and transport choices such as stdio, SSH, WebSocket, HTTP, or SSE do not redefine session semantics. Generic backend lifecycle, capability, failure, evidence, replay, and bounded process mechanisms belong to the yo-backend foundation crate, which is independent of yo-core. yo-core specializes that contract as the provider-neutral AgentBackend semantic port. The flat concrete crates yo-backend-managed, yo-backend-delegated-codex, and yo-backend-delegated-grok depend on the foundation and yo-core; yo-core never depends on them, and host wire interpretation never enters the foundation. Every Agent Backend reports the exact observation boundary available to Request diagnostics, through its Connector where one exists, and never claims visibility into a downstream request owned by another process or service.

payload:
  kind: decision
  content: Any local active pointer is only a reconstructible non-authoritative cache. It is bound to the Git tree identity and active-Checkpoint hash, replaced crash-safely, and discarded on mismatch. Concurrent authority changes are serialized by the repository merge and review workflow rather than a runtime database lock.

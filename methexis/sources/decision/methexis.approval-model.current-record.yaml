payload:
  kind: decision
  content: Each KnowledgeId has at most one current approval record under methexis/approvals. A nonmatching current revision is Draft, Git history retains old approvals instead of unbounded per-revision files, identical writes are idempotent, and replacing different bytes requires the exact prior RevisionId with no force path. Working-tree or branch records are proposal evidence only and grant effective approval only after trusted integration.

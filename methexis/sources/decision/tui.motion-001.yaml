payload:
  kind: decision
  content: Live TUI decorative motion uses one runner-owned monotonic epoch per terminal generation. Terminal-independent frame preparation receives an explicit elapsed sample and reports whether a visible dynamic indicator can change at least one completed cell on a later logical frame; only that demand arms deadline-derived redraws. Multiple visible indicators share the epoch and request the shortest positive period. Late wakes skip missed frames, event and time redraws coalesce, idle and zero-size surfaces do not churn, completed Surface consumers remain clock-free, and no background animation thread is introduced.

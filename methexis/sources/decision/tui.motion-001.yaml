payload:
  kind: decision
  content: Live TUI activity motion uses one runner-owned monotonic epoch per terminal generation. Terminal-independent frame preparation receives an explicit elapsed sample and reports whether a dynamic marker was actually painted; only that demand arms deadline-derived redraws. Late wakes skip missed frames, event and time redraws coalesce, idle and zero-size surfaces do not churn, completed Surface consumers remain clock-free, and no background animation thread is introduced.

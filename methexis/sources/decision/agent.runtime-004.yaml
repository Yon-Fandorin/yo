payload:
  kind: decision
  content: A normal prompt that the initial TUI classifies while an observed Turn is active is submitted as an exact-turn steer intent carrying that TurnRef, not as a generic submission whose meaning may be reclassified from newer worker state. The agent Session admits it only when the same TurnRef remains active; a finished, absent, or different active Turn fails explicitly and never turns that retained intent into StartTurn, including when the worker applied TurnFinished before the frontend polled it. Retry and dispatch backpressure preserve the exact TurnRef. A response to an outstanding approval or agent-requested input remains an exactly correlated Activity response rather than a steer or new Turn. Queuing a later Turn is a distinct future operation, and an unsupported steer fails explicitly instead of silently becoming a queue. Nonsecret interview working copies preserve captured batch identity and ordered answers independently from submitted Session history. Live submission remains an exact Activity response. Recovery and reopening never restore a dead RPC or undo work; an explicit editable preview action starts a new Session and initial Turn, preserving backend/model admission and refusing busy or over-64-KiB requests without truncation, fallback or automatic retry. Secret values remain excluded from durable storage, v1 profiles remain nonsecret-only, and incomplete legacy captures remain excluded. Durable copy UUIDv4 identity is independent from captured batch revision and mutable CAS generation. Live final submission binds its exact successful Activity response and response Activity, while only the explicit new-conversation StartTurn uses an observed accepted model request. A typed secret interview question may accept only request-bound free text with no choices or notes through a separate fixed-state editor after classification. The live command value never enters ordinary input, working copies, previews, Journal, export, logs or diagnostics and is replaced before semantic commit by a payload-free receipt after successful backend command acceptance, while an adapter may retain the same bytes only for a current secret-containing batch until final aggregate response write. After an attempted write, ambiguous failure discards the value and forbids automatic or same-request retry. Recovery keeps public material and a re-entry-required marker but blocks the ordinary new-conversation send path for any secret batch. Provider retention, derived model or tool output, clipboard, swap, process memory and crash dumps remain outside this Yo-local guarantee; this is not credential storage.

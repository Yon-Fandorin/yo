payload:
  kind: decision
  content: |-
    A normal prompt that the initial TUI classifies while an observed Turn is active is submitted as an exact-turn steer intent carrying that TurnRef, not as a generic submission whose meaning may be reclassified from newer worker state. The agent Session admits it only when the same TurnRef remains active; a finished, absent, or different active Turn fails explicitly and never turns that retained intent into StartTurn, including when the worker applied TurnFinished before the frontend polled it. Retry and dispatch backpressure preserve the exact TurnRef. A response to an outstanding approval or agent-requested input remains an exactly correlated Activity response rather than a steer or new Turn. Queuing a later Turn is a distinct future operation, and an unsupported steer fails explicitly instead of silently becoming a queue. An admitted interview may keep one internal editable draft for its live request, discoverable only in the same selected Session and matching workspace. Live submission remains an exact Activity response. A dead request permits only viewing or discarding its draft; answers never become a new message or conversation. Successful sealed submission deletes the temporary draft while conversation history remains. On recovery, an exact verified durable answer seal makes any leftover matching draft cleanup-only before live/dead classification: its content stays unavailable, no continue or view action is offered, and Yo completes durable deletion before presenting contextual draft actions. Submitted interviews are not reopened, and normal UI exposes no interview UUID archive, global list, recovery, reopen or send-as-new-message action. The recognized contextual draft format is exactly `yo.interview-draft/v1`. Canonical v1-v3 working-copy files retain their separately contracted non-contextual behavior, but contextual draft discovery does not list, continue, view, migrate, reopen or submit them. Repository maintenance may inspect canonical v3 only to expire its exact-bound recovery references. No other schema is decoded or admitted as a working copy; unsupported, malformed, incomplete or mismatched records fail closed, remain untouched with a bounded diagnostic, and are never migrated or promoted. V3 recovery references retain only their exact seven-day lifecycle. Durable copy identity remains internal and independent from captured batch revision and mutable CAS generation.

    A typed secret interview question may accept only request-bound free text with no choices or notes through a separate fixed-state editor after classification. The live value never enters ordinary input, interview drafts, previews, Journal, export, logs or diagnostics and is replaced before semantic commit by a payload-free receipt after successful backend command acceptance, while an adapter may retain the same bytes only for a current secret-containing batch until final aggregate response write. Leaving an unsubmitted question, replacing its exact request, cancellation, or Turn termination discards its process-local editor value; a durable retained entry follows its separate lifecycle and never refills automatically. After an attempted write, ambiguous failure discards the value and forbids automatic or same-request retry. Every secret batch still blocks any ordinary new-conversation send path.

    A Yo-managed request may optionally carry a public storage offer with a stable secret scope, recommendation, optional suggested days and reason. Absence means use once with no retention prompt or durable write. Presence lets Yo show a local choice whose initial selection is always use once: use once, store for a user-selected 1–365 days, or store until deleted. The model never sees the local choice and never sees the secret in order to decide it; choosing retention never submits. Delegated backends remain unsupported until equivalent typed metadata exists. Durable entries use the owner-only fixed-size XChaCha20-Poly1305 vault discipline but are separate from interview drafts and bind exact Provider, Model, stable authenticated account identity and the public scope. Behavior-bearing public metadata is independently authenticated before listing or use. One entry per destination and scope is published through a fsynced encrypted entry and an authenticated two-slot `current`/`previous` metadata transition with directory fsync after each rename; the durable previous mapping and both ciphertexts survive every ambiguous successor publication. Every create or replacement first publishes a durable authenticated transition barrier naming the absent or exact prior identities and the successor by fsyncing the barrier file before atomic destination-must-be-absent rename and parent-directory fsync; create, replace and delete barriers use the same exact empty-plaintext XChaCha20-Poly1305 construction with independent nonces. Before any later mutation, Yo must completely resolve and durably remove an existing valid stable barrier; an invalid or unavailable barrier blocks mutation, and no new barrier or metadata-slot rename may overwrite existing recovery evidence. Startup authenticates every named metadata and ciphertext file needed for authority or cleanup. It requires the barrier plus a new successful file-and-directory fsync before a visible ambiguous successor gains authority, aborts a create whose `current` was never published by durably removing only authenticated barrier-named successor files before removing the barrier, restores an absent replace `current` only from the barrier's exact valid `previous`, rolls back an unstarted replace successor when the exact prior generation remains in `current` with no `previous`, and leaves every authentication failure or unbarriered previous slot untouched. A valid delete barrier suppresses availability and resumes only its exact tombstone-and-cleanup sequence from each matching slot state; after both metadata slots are absent it durably removes any remaining authenticated barrier-named ciphertext before removing the barrier. When a valid replace barrier and its exact successor `current` remain after the named `previous` has already been removed, startup treats that as post-commit cleanup: it freshly fsyncs `current` and the metadata directory, completes only the barrier-named prior-ciphertext cleanup, and durably removes the barrier without rollback or previous-generation republication; failure keeps the barrier and remaining evidence for the same bounded recovery. The old ciphertext is removed only after the new current mapping is durable, and the barrier is removed last. Deletion or expiry publishes a distinct authenticated delete barrier, then an authenticated tombstone; the barrier suppresses all recovery until prior metadata and ciphertext are durably absent. A matching later genuine live request may offer the value, but explicit local recovery only fills the hidden editor and a fresh submit press is still required. Timed entries expire; until-deleted entries survive completion and restart. A dedicated local Secrets view lists only authenticated public title, scope, destination and retention metadata and supports deletion without revealing or copying values. Ciphertext inspected without its separate key remains protected, while a reader or backup with both is outside the guarantee. Deletion is logical availability, not a physical-erasure claim. Provider retention, transformed, encoded, partial or semantically derived model or tool output, clipboard, swap, process memory, crash dumps, filesystem history and backups remain outside the Yo-local guarantee; this is not credential storage.

    For a Yo-managed native secret request, the TUI additionally shows the exact selected Provider and Model and warns that explicit submission sends the value to that destination, which may retain it, and that submission permits at most one fully buffered, exact-secret-echo-screened final answer before the current Session becomes unavailable for later Turn, model replacement or resume even when no answer arrives; every request requires fresh explicit submission and a backend that cannot meet the typed Session-terminal, non-persistent, no-retry contract remains unsupported.

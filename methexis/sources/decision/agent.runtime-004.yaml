payload:
  kind: decision
  content: A normal prompt that the initial TUI classifies while an observed Turn is active is submitted as an exact-turn steer intent carrying that TurnRef, not as a generic submission whose meaning may be reclassified from newer worker state. The agent Session admits it only when the same TurnRef remains active; a finished, absent, or different active Turn fails explicitly and never turns that retained intent into StartTurn, including when the worker applied TurnFinished before the frontend polled it. Retry and dispatch backpressure preserve the exact TurnRef. A response to an outstanding approval or agent-requested input remains an exactly correlated Activity response rather than a steer or new Turn. Queuing a later Turn is a distinct future operation, and an unsupported steer fails explicitly instead of silently becoming a queue.

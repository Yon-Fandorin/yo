payload:
  kind: decision
  content: A normal prompt that the initial TUI classifies while an observed Turn is active is submitted as an exact-turn steer intent carrying that TurnRef, not as a generic submission whose meaning may be reclassified from newer worker state. The agent Session admits it only when the same TurnRef remains active; a finished, absent, or different active Turn fails explicitly and never turns that retained intent into StartTurn, including when the worker applied TurnFinished before the frontend polled it. Retry and dispatch backpressure preserve the exact TurnRef. A response to an outstanding approval or agent-requested input remains an exactly correlated Activity response rather than a steer or new Turn. Queuing a later Turn is a distinct future operation, and an unsupported steer fails explicitly instead of silently becoming a queue. Nonsecret interview working copies preserve captured batch identity and ordered answers independently from submitted Session history. Live submission remains an exact Activity response. Recovery and reopening never restore a dead RPC or undo work; an explicit editable preview action starts a new Session and initial Turn, preserving backend/model admission and refusing busy or over-64-KiB requests without truncation, fallback or automatic retry. Secret recovery remains off by default; an explicit per-answer opt-in may publish only a random recovery reference in a v3 working copy and a fixed-size XChaCha20-Poly1305 vault entry under a dedicated owner-only recovery key. Its stable non-secret destination binding includes exact Provider, Model and a live authenticated account identity for managed backends, or exact host kind, observed Provider, Model and authenticated account identity for delegated hosts; a configured account-slot name alone is insufficient, and a missing stable authenticated identity makes recovery unsupported. Exact destination, public batch and question bindings plus a new genuine live request and fresh submit press are required to decrypt and reuse it; dead RPC, StartTurn, any destination-component replacement, ambiguous match and legacy v1/v2 copies receive no recovery authority. Ordered vault-first/copy-CAS publication, final-seal or explicit/expiry cleanup and fail-closed key/path checks keep ciphertext, key, value, hash, length and backend request identity outside public persistence. Durable copy UUIDv4 identity is independent from captured batch revision and mutable CAS generation. Live final submission binds its exact successful Activity response and response Activity, while only the explicit new-conversation StartTurn uses an observed accepted model request. A typed secret interview question may accept only request-bound free text with no choices or notes through a separate fixed-state editor after classification. The live command value never enters ordinary input, working copies, previews, Journal, export, logs or diagnostics and is replaced before semantic commit by a payload-free receipt after successful backend command acceptance, while an adapter may retain the same bytes only for a current secret-containing batch until final aggregate response write. After an attempted write, ambiguous failure discards the value and forbids automatic or same-request retry. Without opt-in, recovery keeps only public material and a re-entry-required marker; every secret batch still blocks the ordinary new-conversation send path. Ciphertext inspected or copied without the separately captured recovery key remains protected, but a backup or reader that obtains both key and vault is outside the guarantee regardless of their configured paths. Provider retention, transformed, encoded, partial or semantically derived model or tool output, clipboard, swap, process memory and crash dumps remain outside this Yo-local guarantee; this is not credential storage. For a Yo-managed native secret request, the TUI additionally shows the exact selected Provider and Model and warns that explicit submission sends the value to that destination, which may retain it, and that submission permits at most one fully buffered, exact-secret-echo-screened final answer before the current Session becomes unavailable for later Turn, model replacement or resume even when no answer arrives; every request requires fresh explicit submission and a backend that cannot meet the typed Session-terminal, non-persistent, no-retry contract remains unsupported.

payload:
  kind: decision
  content: |-
    Routing uses stable ProviderId, AccountId, and ModelId with one durable connections.yaml owner for external accounts, catalog and OpenRouter discovery seeds, complete model definitions, preference, and warning-only per-model last_failure observations; config.yaml owns no model state. User-authored grouped definitions enter only through explicit bounded yo connect --from with an absolute file path or exact stdin marker -, while credential-file paths are absolute. One document carries one Provider-and-Account credential scope and either bounded multiple models, a closed catalog, or the exact zero-model OpenRouter discovery-seed form, contains no secret, fails atomically on any invalid or duplicate member, and commits all-or-nothing after one preview and confirmation. Re-import replaces that pair's whole definition group rather than merging, preserves observations only for exact unchanged bindings, and never invents a preference; a removed preferred target is cleared. The profile algebra keeps explicit endpoint and closed whole-field overrides but removes connection-only verification_profile. A complete profile may carry a positive max_output_tokens as a known hard maximum; absence records that Yo does not know a trustworthy numeric maximum and a compatible Connector must omit its output-limit field. The agent runtime never guesses a number; for a known maximum it may select a smaller positive request-local cap without changing durable binding, replay identity, or binding epoch. Presence, absence, and the known number participate in exact complete-binding equality. External connect performs no model request and proves no authentication, entitlement, request acceptance, or semantic terminal; an explicitly chosen dynamic catalog may perform only its bounded inventory request. Actual model use reports a closed typed outcome and the exact private CredentialRevision used or observed without holding the repository lock during the remote request. A brief operation-locked writer first resolves any pending operation journal, then re-reads both repositories and CAS-records last_failure only when the same exact current binding and CredentialRevision remain current, while success clears it under the same fence; unresolved recovery skips observation mutation and removed, replaced, or credential-stale outcomes are discarded. Observation state never changes binding identity or routing, and cancellation, local tool failure, cleanup failure, secrets, request bodies, response bodies, and raw provider errors are excluded. Credential/public connect and disconnect remain recoverable through the secret-free journal, while preference and observation writes remain single-repository CAS operations. No manual/managed provenance, model-config composition, legacy decoder, migration, dual write, dedicated retired-shape classifier, or versioned compatibility branch remains. Each stored complete model binding also carries one provider-neutral operator activation state outside complete-binding identity, catalog availability, credentials, failure observation, and deletion. Enabled is the compatible absent-field state; disabled is encoded only as exact `enabled: false`, while present true, null, and other values are invalid. A prior binary therefore continues to read an all-enabled snapshot and fails closed on a snapshot containing a disabled binding; enabling removes the field and restores the compatible shape. Under the shared recovered operation lane, exact enable and disable are idempotent single-repository CAS operations that make no provider request and neither read nor mutate credential bytes. Disabling an exact preferred ModelTarget clears that preference in the same public mutation without choosing a fallback. Exact credential rotation and grouped re-import preserve activation only for an unchanged coordinate with exact complete-binding equality; a changed complete binding is a new enabled binding.

    An explicitly selected optional image_input_profile extends complete managed binding identity without changing the meaning or bytes of any legacy text-only profile. Absence permits only the existing text input path; it never infers image support from ModelId, tokenizer_profile, dialect, a new catalog release, or remote image metadata. The first present closed value kimi-code-png-advisory/v1 is valid only for the already admitted exact Kimi Code endpoint-and-ModelId envelope and pairs canonical PNG input with explicit advisory policy kimi-code-image-advisory/v1. A present null, unknown value, or incompatible binding fails before publication or transport. Profile inheritance and whole-field replacement match existing profile fields, and an omitted field cannot clear an inherited value. Presence, absence and exact value participate in complete binding equality and binding-epoch transitions. Selected-model media evidence, connector support and reviewed resource limits still gate each image request; unsupported or unknown images never disable otherwise eligible legacy text requests. Existing bindings do not gain this profile automatically. New profiles for other managed services require reviewed capability, wire and accounting contracts, while the common image input remains usable by separately contracted delegated hosts without inventing a model-service account for them.

    ### OpenRouter free PNG profile

    The additional closed image profile `openrouter-free-png-advisory/v1` admits
    only ProviderId `openrouter`, any valid explicitly selected AccountId, normalized
    endpoint `https://openrouter.ai/api/v1`, the dialect-derived
    `openai-chat-completions` Connector, and exact ModelId
    `nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free`. The remaining complete
    profile is exactly tokenizer `utf8-bytes/v1`, input limit 256000, known output
    maximum 65536, empty reasoning parameters, `semantic-only/v1` replay, and either
    `local-tools/v1` or `no-tools/v1` under the existing request-local exposure rule.
    Its accounting policy is `openrouter-free-image-advisory/v1` with explicit
    `advisory_estimate` quality; neither the text counter nor that planning policy
    claims to implement the remote model's tokenizer.

    The complete profile's `optional_request_parameters` is exactly
    `{"provider":{"only":["nvidia"],"allow_fallbacks":false,"require_parameters":true,"max_price":{"prompt":0,"completion":0,"request":0,"image":0}}}`,
    with integer zero values under the existing variant-exact structured-value
    algebra. These declared routing fields are sent on every request, including
    text-only, tools-disabled verification, continuation and image summary. They
    are not a general arbitrary-parameter passthrough. Missing, relaxed, additional
    or conflicting options, a different model or endpoint, private replay, or any
    other complete-envelope mismatch rejects before publication and transport.
    The service admits the complete envelope and supplies typed request policy;
    the selected Connector defensively verifies that same admitted envelope.
    Provider policy remains outside the generic managed model loop.

    A new or replacement binding may select this profile only in an explicit
    connection plan that discloses the exact free route, advisory accounting and
    image support. The first implementation exposes it through an explicit
    `yo connect --from` definition using the existing reviewed plan/commit flow.
    Discovery metadata alone cannot attach this profile; existing stored bindings,
    historical epochs and ordinary text-only discovery profiles remain unchanged.
    Selecting another model requires a separately admitted complete binding, never
    a fallback or suffix-based inference. The free suffix and zero-price routing
    restrictions are a dispatch policy, not a promise of provider availability.
    A provider capacity or price rejection remains a visible failure and never
    relaxes those restrictions or causes image stripping or an automatic resend.

    The profile reuses the accepted ordered immutable PNG input, replay, summary
    source, pressure and checkpoint shapes without a storage migration. Missing
    profile support rejects image dispatch while preserving the existing draft
    behavior. The first activation MUST select compatible reviewed revisions of
    this service-binding owner, the Chat Completions Connector and the managed-loop
    accounting owner together, alongside the already compatible image-input,
    continuation, persistence and checkpoint contracts. No member may independently
    activate image admission against an older member lacking this profile.

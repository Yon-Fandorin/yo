revision: sha256:a660cdac95dd01394f1f4506d51f00ffa07b01230424f1709bc7c9d21a08edbf
payload:
  kind: decision
  content: Model routing uses stable Provider, Account, and Model identities with separate mutable display names. Provider identifies the model-service group, Account selects one local credential and entitlement scope within that Provider, and Model identifies the exact wire model. Credential resolution uses the ProviderId and AccountId pair. Public catalog configuration selects an explicit API dialect but does not select a connector implementation. OpenAI-compatible is only a family description and never replaces the exact dialect. The initially supported dialects are openai-responses and openai-chat-completions, selected explicitly and never by probing or fallback. Runtime resolution deterministically maps the dialect to one admitted built-in connector implementation and records its identity in the complete effective binding together with Provider, Account, Model, dialect, and normalized endpoint. Missing or ambiguous mappings fail before startup. OpenRouter and QwenCloud are initial first-class configured Providers that share the provider-neutral backend; a Provider is not bound to one dialect or made into a backend type. Tenant behavior is deferred, while credential and binding resolution remain injectable so caller-owned tenant scope can be added without changing these identities.

id: agent.model-001
revision: sha256:b50cec2c8a723e80adae6b99b76d3b0b826d8fe2452db140616c8968c490e82a
payload:
  kind: decision
  content: Routing uses stable ProviderId, AccountId, and ModelId with one durable connections.yaml owner for external accounts, catalog and OpenRouter discovery seeds, complete model definitions, preference, and warning-only per-model last_failure observations; config.yaml owns no model state. User-authored grouped definitions enter only through explicit bounded yo connect --from with an absolute file path or exact stdin marker -, while credential-file paths are absolute. One document carries one Provider-and-Account credential scope and either bounded multiple models, a closed catalog, or the exact zero-model OpenRouter discovery-seed form, contains no secret, fails atomically on any invalid or duplicate member, and commits all-or-nothing after one preview and confirmation. Re-import replaces that pair's whole definition group rather than merging, preserves observations only for exact unchanged bindings, and never invents a preference; a removed preferred target is cleared. The profile algebra keeps explicit endpoint and closed whole-field overrides but removes connection-only verification_profile. External connect performs no model request and proves no authentication, entitlement, request acceptance, or semantic terminal; an explicitly chosen dynamic catalog may perform only its bounded inventory request. Actual model use reports a closed typed outcome and the exact private CredentialRevision used or observed without holding the repository lock during the remote request. A brief operation-locked writer first resolves any pending operation journal, then re-reads both repositories and CAS-records last_failure only when the same exact current binding and CredentialRevision remain current, while success clears it under the same fence; unresolved recovery skips observation mutation and removed, replaced, or credential-stale outcomes are discarded. Observation state never changes binding identity or routing, and cancellation, local tool failure, cleanup failure, secrets, request bodies, response bodies, and raw provider errors are excluded. Credential/public connect and disconnect remain recoverable through the secret-free journal, while preference and observation writes remain single-repository CAS operations. No manual/managed provenance, model-config composition, legacy decoder, migration, dual write, dedicated retired-shape classifier, or versioned compatibility branch remains.

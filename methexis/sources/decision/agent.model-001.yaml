payload:
  kind: decision
  content: 'Routing uses stable ProviderId, AccountId, and ModelId with explicit Provider-and-Account endpoints, resolved base profiles plus closed whole-field model overrides, direct complete-binding equality, and lossless typed attribution rather than profile digests. Manual config and managed snapshots compose only when complete bindings are equal. A serialized credential-changing connect verifies one in-memory CandidateSecret against every retained binding of its exact pair, then commits credential first and exact public state second through a secret-free recoverable journal; new wire-v1 journals retain an empty required profile_digests list while legacy valid values remain readable and ignored for recovery. Interactive OpenRouter account discovery uses one authenticated bounded /models/user snapshot and retains every valid returned ModelId in a terminal-safe controlling-TTY inventory. Current runtime availability is derived separately: text-input and text-output models are selectable, models that cannot support Yo''s exact tool request use the exact no-tools/v1 policy instead of being hidden, unsupported capabilities remain visible but disabled with a concise reason until reviewed runtime support makes the same identity eligible, and malformed capability evidence remains disabled until the provider supplies valid metadata. The durable tool policy is a maximum; ordinary local-tools agent requests expose one frozen registry, no-tools requests expose none, and every connection-verification request exposes none without changing binding identity. The first no-tools activation selects this service-binding revision and both compatible conditional Connector revisions in one forward Checkpoint. QwenCloud plan onboarding uses a closed built-in catalog profile as a release-owned candidate inventory: the catalog atomically owns its exact Provider, normalized endpoint, complete base profile, model membership, and per-model overrides, but never claims account entitlement. One locally selected exact catalog Model enters the existing candidate-secret verification and recoverable commit path; a catalog update never rewrites existing managed bindings. General and workspace QwenCloud without a catalog remain explicit ModelTarget configuration. Kimi Platform onboarding uses the closed kimi-platform-ai/v1 catalog adapter, its exact .ai endpoint, one authenticated bounded /models snapshot, and release-owned complete behavior overlays. Every valid returned ModelId remains visible. Exact K3 is the recommended flagship binding with a reviewed 1,048,576-token ceiling, 131,072-token output reserve, reasoning effort low/high/max, and exact replay_profile kimi-private-local-plaintext/v1. Exact kimi-k2.7-code and kimi-k2.7-code-highspeed are available forced-thinking coding bindings with a 262,144-token ceiling, 32,768-token output reserve, thinking.type enabled with thinking.keep all, and the same private replay profile. Exact K2.6 remains an available thinking-disabled fallback with semantic-only/v1. K2.5 retirement, other unreviewed forced-thinking K2, malformed, generic kimi-k2.7, and unknown profiles remain visible but disabled until their distinct profiles are reviewed, and manual configuration cannot bypass any admitted envelope. K3 and K2.7 Code Sessions retain bounded kimi.assistant-message/v1alpha1 state unencrypted in the user-only local repository, never expose it through frontend or diagnostic projections, and replay it only under the same exact binding and replay profile. Missing legacy replay_profile decodes only as semantic-only/v1, so an older private-replay Kimi coordinate remains quarantined. A manual K3 or K2.7 Code profile must author the private profile explicitly; a managed binding receives it only after the captured plan discloses and confirms plaintext retention. The first K3 activation selects service, Connector, backend, continuation, repository, Journal, persistence-format, and session-selection revisions as one compatible set. The first K2.7 Code activation selects the revised service, Connector, backend loop, continuation, repository, persistence-format, and session-selection contracts together while reusing the already compatible Session Journal and private-item schema. The gate applies to newly planned additions and replacements: recovery still completes an older valid journal''s exact planned public bytes, then quarantines any unsupported recovered or stored binding as decodable and removable but never selectable, verifiable, or routable. Remote membership never proves entitlement, so the same CandidateSecret must verify the selected exact binding before mutation. Exact non-interactive ModelTarget connect remains paired --credential-file plus --yes. Disconnect derives preserve or remove from the captured prospective effective binding set, publishes public removal first, and removes a credential only when no binding still depends on the pair. Preference-only publication uses one public CAS without a journal. One operation lock resolves pending recovery before every connect, disconnect, or preference mutation; config changes abort before a new intent, exact retries are idempotent, private credential revisions and secrets never reach user-visible state, and TenantId, rotation, generic remote discovery, runtime documentation scraping, background catalog refresh, and failover remain deferred.'

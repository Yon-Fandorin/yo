id: agent.model-001
revision: sha256:ed24127c7ba464e414d4572cfce39c5aa1b727b1d5c319cd641e35556336b302
payload:
  kind: decision
  content: 'Model routing uses stable Provider, Account, and Model coordinates plus explicit resolved connection and profile values. A Provider-and-Account binding may provide one base profile above its models; each model may replace named fields, with structured fields replaced whole and no implicit defaults. Equality compares the resolved typed fields directly without RFC 8785 canonicalization or a durable profile digest. Operator config is read-only, captured as a bounded command-local snapshot on every invocation, and never pinned into managed state. Equal manual and managed identities coalesce; unequal identities at one coordinate fail visibly. ConnectionRepository owns managed bindings and preference by prepared revision CAS. Preference-only Local Codex first publication and explicit default set or clear run under the shared lock after pending recovery and use one atomic public CAS without an operation journal or credential revision. A caller-unknown result requires inspecting current preference: repeating an explicit default command is new authorization, while Local Codex publishes only from a fresh unset capture. Credential-adding or -replacing connect verifies every retained and prospective binding using only the newly disclosed in-memory secret, then uses a typed credential-first write-ahead operation. Disconnect derives secret preservation or removal from the captured post-public effective binding set and uses a distinct public-first recovery table. Operation kind, credential action, planned revisions, and exact non-secret public bytes are durable before mutation, so recovery distinguishes expected, planned, and conflicting states without guessing or a duplicate profile digest. Credential revisions remain private; user outcomes expose only ConnectionRevision. Future tenant scope remains injected.'

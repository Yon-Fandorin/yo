payload:
  kind: decision
  content: 'Routing uses stable ProviderId, AccountId, and ModelId with one durable connections.yaml owner for external accounts, catalog and OpenRouter discovery seeds, complete model definitions, preference, and warning-only per-model last_failure observations; config.yaml owns no model state. User-authored grouped definitions enter only through explicit bounded yo connect --from with an absolute file path or exact stdin marker -, while credential-file paths are absolute. One document carries one Provider-and-Account credential scope and either bounded multiple models, a closed catalog, or the exact zero-model OpenRouter discovery-seed form, contains no secret, fails atomically on any invalid or duplicate member, and commits all-or-nothing after one preview and confirmation. Re-import replaces that pair''s whole definition group rather than merging, preserves observations only for exact unchanged bindings, and never invents a preference; a removed preferred target is cleared. The profile algebra keeps explicit endpoint and closed whole-field overrides but removes connection-only verification_profile. A complete profile may carry a positive max_output_tokens as a known hard maximum; absence records that Yo does not know a trustworthy numeric maximum and a compatible Connector must omit its output-limit field. The agent runtime never guesses a number; for a known maximum it may select a smaller positive request-local cap without changing durable binding, replay identity, or binding epoch. Presence, absence, and the known number participate in exact complete-binding equality. External connect performs no model request and proves no authentication, entitlement, request acceptance, or semantic terminal; an explicitly chosen dynamic catalog may perform only its bounded inventory request. Actual model use reports a closed typed outcome and the exact private CredentialRevision used or observed without holding the repository lock during the remote request. A brief operation-locked writer first resolves any pending operation journal, then re-reads both repositories and CAS-records last_failure only when the same exact current binding and CredentialRevision remain current, while success clears it under the same fence; unresolved recovery skips observation mutation and removed, replaced, or credential-stale outcomes are discarded. Observation state never changes binding identity or routing, and cancellation, local tool failure, cleanup failure, secrets, request bodies, response bodies, and raw provider errors are excluded. Credential/public connect and disconnect remain recoverable through the secret-free journal, while preference and observation writes remain single-repository CAS operations. No manual/managed provenance, model-config composition, legacy decoder, migration, dual write, dedicated retired-shape classifier, or versioned compatibility branch remains. Each stored complete model binding also carries one provider-neutral operator activation state outside complete-binding identity, catalog availability, credentials, failure observation, and deletion. Enabled is the compatible absent-field state; disabled is encoded only as exact `enabled: false`, while present true, null, and other values are invalid. A prior binary therefore continues to read an all-enabled snapshot and fails closed on a snapshot containing a disabled binding; enabling removes the field and restores the compatible shape. Under the shared recovered operation lane, exact enable and disable are idempotent single-repository CAS operations that make no provider request and neither read nor mutate credential bytes. Disabling an exact preferred ModelTarget clears that preference in the same public mutation without choosing a fallback. Exact credential rotation and grouped re-import preserve activation only for an unchanged coordinate with exact complete-binding equality; a changed complete binding is a new enabled binding.'

payload:
  kind: decision
  content: 'Routing uses stable ProviderId, AccountId, and ModelId with explicit Provider-and-Account endpoints, resolved base profiles plus closed whole-field model overrides, direct complete-binding equality, and lossless typed attribution rather than profile digests. Manual config and managed snapshots compose only when complete bindings are equal. A serialized credential-changing connect verifies one in-memory CandidateSecret against every retained binding of its exact pair, then commits credential first and exact public state second through a secret-free recoverable journal; new wire-v1 journals retain an empty required profile_digests list while legacy valid values remain readable and ignored for recovery. Interactive OpenRouter account discovery uses one authenticated bounded /models/user snapshot and retains every valid returned ModelId in a terminal-safe controlling-TTY inventory. Current runtime availability is derived separately: text-input and text-output models are selectable, models that cannot support Yo''s exact tool request use the exact no-tools/v1 policy instead of being hidden, unsupported capabilities remain visible but disabled with a concise reason until reviewed runtime support makes the same identity eligible, and malformed capability evidence remains disabled until the provider supplies valid metadata. The durable tool policy is a maximum; ordinary local-tools agent requests expose one frozen registry, no-tools requests expose none, and every connection-verification request exposes none without changing binding identity. The first no-tools activation selects this service-binding revision and both compatible conditional Connector revisions in one forward Checkpoint. QwenCloud plan onboarding uses a closed built-in catalog profile as a release-owned candidate inventory: the catalog atomically owns its exact Provider, normalized endpoint, complete base profile, model membership, and per-model overrides, but never claims account entitlement. One locally selected exact catalog Model enters the existing candidate-secret verification and recoverable commit path; a catalog update never rewrites existing managed bindings. General and workspace QwenCloud without a catalog remain explicit ModelTarget configuration. Exact non-interactive ModelTarget connect remains paired --credential-file plus --yes. Disconnect derives preserve or remove from the captured prospective effective binding set, publishes public removal first, and removes a credential only when no binding still depends on the pair. Preference-only publication uses one public CAS without a journal. One operation lock resolves pending recovery before every connect, disconnect, or preference mutation; config changes abort before a new intent, exact retries are idempotent, private credential revisions and secrets never reach user-visible state, and TenantId, rotation, generic remote discovery, runtime documentation scraping, Alibaba management credentials, background catalog refresh, and failover remain deferred.'

payload:
  kind: decision
  content: 'Routing uses stable ProviderId, AccountId, and ModelId with explicit Provider-and-Account endpoints, resolved base profiles plus closed whole-field model overrides, direct complete-binding equality, and lossless typed attribution rather than profile digests. Manual config and managed snapshots compose only when complete bindings are equal. Yo-owned configuration and model-service state use one current pre-version YAML shape decoded by a shared bounded safe-Rust parser; duplicate keys, merge keys, multiple documents, unknown aliases, alias cycles, and configured structural or alias-expansion limit breaches fail closed. A serialized credential-changing connect verifies one in-memory CandidateSecret against every retained binding of its exact pair, then commits credential first and exact public state second through a secret-free recoverable journal; the current pre-version journal records only fields used by recovery and rejects retired version and profile_digests fields. Interactive OpenRouter account discovery uses one authenticated bounded /models/user snapshot and retains every valid returned ModelId in a terminal-safe controlling-TTY inventory. Current runtime availability is derived separately: text-input and text-output models are selectable, models that cannot support Yo''s exact tool request use the exact no-tools/v1 policy instead of being hidden, unsupported capabilities remain visible but disabled with a concise reason until reviewed runtime support makes the same identity eligible, and malformed capability evidence remains disabled until the provider supplies valid metadata. The durable tool policy is a maximum; ordinary local-tools agent requests expose one frozen registry, no-tools requests expose none, and every connection-verification request exposes none without changing binding identity. The first no-tools activation selects this service-binding revision and both compatible conditional Connector revisions in one forward Checkpoint. QwenCloud plan onboarding uses a closed built-in catalog profile as a release-owned candidate inventory: the catalog atomically owns its exact Provider, normalized endpoint, complete base profile, model membership, and per-model overrides, but never claims account entitlement. One locally selected exact catalog Model enters the existing candidate-secret verification and recoverable commit path; a catalog update never rewrites existing managed bindings. General and workspace QwenCloud without a catalog remain explicit ModelTarget configuration. Kimi onboarding keeps two closed dynamic catalog adapters under ProviderId kimi: kimi-platform-ai/v1 owns the .ai Open Platform endpoint and Platform ModelIds, while kimi-code-membership/v1 owns the .com/coding/v1 subscription endpoint and exact Code ModelIds; their credentials, entitlement, and billing authority never fall back or interchange. Both use one authenticated bounded /models snapshot and retain every valid returned ModelId visibly. The Platform overlay remains unchanged. The Code overlay recommends exact k3-256k for everyday coding, admits exact k3 at its membership-dependent 256K-to-1M context, and admits exact kimi-for-coding plus kimi-for-coding-highspeed as forced-thinking K2.7 coding paths. Code K3 uses exact remote context evidence from 256K through 1M according to membership, a conservative Yo output reserve of 131,072, reasoning effort low/high/max with catalog default high, preserved Thinking with keep all, and kimi-private-local-plaintext/v1. Code K2.7 uses exact 262,144 input, conservative output reserve 32,768, thinking enabled with keep all, and the same private replay profile. Unknown Code rows remain visible but disabled, and manual configuration cannot mix endpoint and ModelId families or bypass the closed envelope. K3 and K2.7 Code Sessions retain bounded kimi.assistant-message/v1alpha1 state unencrypted in the user-only local repository, never expose it through frontend or diagnostic projections, and replay it only under the same exact binding and replay profile. Missing legacy replay_profile decodes only as semantic-only/v1, so an older private-replay Kimi coordinate remains quarantined. A manual K3 or K2.7 Code profile must author the private profile explicitly; a managed binding receives it only after the captured plan discloses and confirms plaintext retention. The first K3 activation selects service, Connector, backend, continuation, repository, Journal, persistence-format, and session-selection revisions as one compatible set. The first K2.7 Code activation selects the revised service, Connector, backend loop, continuation, repository, persistence-format, and session-selection contracts together while reusing the already compatible Session Journal and private-item schema. The first Kimi Code membership activation selects the revised service, Kimi Connector, Yo-managed backend cache-affinity owner, and session-selection contracts together while reusing the already generic exact-binding private replay, storage, and continuation owners. The gate applies to newly planned additions and replacements: recovery completes only a valid current-shape journal''s exact planned public bytes, then quarantines any unsupported recovered or stored binding as decodable and removable but never selectable, verifiable, or routable; preceding pre-release YAML files are not migrated or decoded and instead fail with reset-and-reconnect guidance. Remote membership never proves entitlement, so the same CandidateSecret must verify the selected exact binding before mutation. Code verification supplies one ephemeral verification-task cache-affinity hint without persisting it. Exact non-interactive ModelTarget connect remains paired --credential-file plus --yes. Disconnect derives preserve or remove from the captured prospective effective binding set, publishes public removal first, and removes a credential only when no binding still depends on the pair. Preference-only publication uses one public CAS without a journal. One operation lock resolves pending recovery before every connect, disconnect, or preference mutation; config changes abort before a new intent, exact retries are idempotent, private credential revisions and secrets never reach user-visible state, and TenantId, rotation, generic remote discovery, runtime documentation scraping, background catalog refresh, and failover remain deferred.'

payload:
  kind: decision
  content: Routing uses stable ProviderId, AccountId, and ModelId with explicit Provider-and-Account endpoints, resolved base profiles plus closed whole-field model overrides, direct complete-binding equality, and lossless typed attribution rather than profile digests. Manual config and managed snapshots compose only when complete bindings are equal. A serialized credential-changing connect verifies one in-memory CandidateSecret against every retained binding of its exact pair, then commits credential first and exact public state second through a secret-free recoverable journal; new wire-v1 journals retain an empty required profile_digests list while legacy valid values remain readable and ignored for recovery. Interactive external connect uses controlling-TTY confirmation and no-echo input. Non-interactive external connect requires one exact ModelTarget plus paired --credential-file and --yes options; --yes authorizes only the captured plan and revisions, and the owner-only stable file is read before verification without entering the journal or repository. Disconnect derives preserve or remove from the captured prospective effective binding set, publishes public removal first, and removes a credential only when no binding still depends on the pair. Preference-only publication uses one public CAS without a journal. One operation lock resolves pending recovery before every connect, disconnect, or preference mutation; config changes abort before a new intent, exact retries are idempotent, private credential revisions and secrets never reach user-visible state, and TenantId, rotation, and failover remain deferred.

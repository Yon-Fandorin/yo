payload:
  kind: decision
  content: 'Model routing uses stable Provider, Account, and Model coordinates plus exact yo.binding-profile/v1 identity. Operator config is read-only, captured as a bounded command-local snapshot on every invocation, and never pinned into managed state. Equal manual and managed identities coalesce; unequal identities at one coordinate fail visibly. ConnectionRepository owns managed bindings and preference by prepared revision CAS. Preference-only Local Codex first publication and explicit default set or clear run under the shared lock after pending recovery and use one atomic public CAS without an operation journal or credential revision. A caller-unknown result requires inspecting current preference: repeating an explicit default command is new authorization, while Local Codex publishes only from a fresh unset capture. Credential-adding or -replacing connect verifies every retained and prospective binding using only the newly disclosed in-memory secret, then uses a typed credential-first write-ahead operation. Disconnect derives secret preservation or removal from the captured post-public effective binding set and uses a distinct public-first recovery table. Operation kind, credential action, planned revisions, and non-secret public bytes are durable before mutation, so recovery distinguishes expected, planned, and conflicting states without guessing. Credential revisions remain private; user outcomes expose only ConnectionRevision. Future tenant scope remains injected.'

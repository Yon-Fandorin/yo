  kind: decision
  content: The canonical relation vocabulary is closed to depends_on, constrained_by, validated_by, applies_to, and supersedes, with typed targets and compiler meanings. Weak related_to signals are advisory Librarian discovery data and never affect SOT eligibility or invalidation.

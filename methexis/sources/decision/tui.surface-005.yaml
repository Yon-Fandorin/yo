  content: The initial yo-unicode-17.0-narrow/v1 profile uses Unicode 17.0 data, renders supported grapheme clusters in one or two cells with explicit emoji and East Asian Width rules, rejects zero-width clusters and controls, and is shared by terminal and HTML.

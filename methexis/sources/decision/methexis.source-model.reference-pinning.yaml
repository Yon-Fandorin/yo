payload:
  kind: decision
  content: A KnowledgeUnit pins every Source by exact SourceId and SourceRevision. Source changes never advance implicitly; an author must select the new SourceRevision, producing a new Knowledge revision that requires exact review, approval, and Checkpoint activation.

name: Unix compile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yo-cli:
    name: yo-cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - name: Compile yo-cli
        run: cargo check --locked -p yo-cli --all-targets
      - name: Lint workspace
        # 기존 절대 경로 정리 동안 이 경고만 엄격 검사에서 제외
        run: cargo clippy --locked --workspace --all-targets -- -D warnings -A clippy::absolute_paths

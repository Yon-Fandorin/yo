[package]
name = "yo-cli"
version = "0.0.0"
edition.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "yo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
jiff = { version = "=0.2.35", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.0"
tiktoken-rs = "=0.12.0"
unicode-segmentation = "=1.13.3"
yo-core = { path = "../yo-core" }
yo-tui = { path = "../yo-tui" }
yo-yaml = { path = "../../shared/yo-yaml" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
nix = { version = "=0.31.3", default-features = false, features = ["dir", "fs", "process", "signal", "term"] }
rustix = { version = "=1.1.4", default-features = false, features = ["std", "termios"] }
signal-hook = { version = "=0.3.18", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["fs", "process", "term"] }

# The workspace defaults are repeated so only narrow, reviewed Unix syscall
# boundaries can lower unsafe_code from deny to allow.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

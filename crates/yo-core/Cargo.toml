[package]
name = "yo-core"
version = "0.0.0"
edition.workspace = true
repository.workspace = true
publish = false

[dependencies]
yo-backend = { path = "../backends/foundation" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
yo-yaml = { path = "../../shared/yo-yaml" }
sha2 = "0.11.0"
getrandom = "0.4.3"
chacha20 = "0.9.1"
chacha20poly1305 = "0.10.1"
poly1305 = { version = "0.8.0", features = ["zeroize"] }
zeroize = "1.9.0"
jiff = { version = "=0.2.35", default-features = false, features = ["std"] }
libc = "=0.2.189"
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process", "std"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.13.3"
icu_properties = { version = "=2.2.0", features = ["compiled_data"] }
url = "=2.5.8"
tokio-util = "=0.7.19"

[lints]
workspace = true

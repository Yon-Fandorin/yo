[package]
name = "yo-core"
version = "0.0.0"
edition.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
yo-yaml = { path = "../../shared/yo-yaml" }
sha2 = "0.11.0"
getrandom = "0.4.3"
jiff = { version = "=0.2.35", default-features = false, features = ["std"] }
futures-util = "=0.3.33"
libc = "=0.2.189"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rustix = { version = "=1.1.4", default-features = false, features = ["process", "std"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.13.3"
icu_properties = { version = "=2.2.0", features = ["compiled_data"] }
url = "=2.5.8"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = "=0.7.19"

[lints]
workspace = true

[package]
name = "methexis"
version = "0.0.0"
edition.workspace = true
repository.workspace = true
publish = false

[lib]
name = "methexis"
path = "src/lib.rs"

[[bin]]
name = "methexis"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_norway = "0.9.42"
serde_json = "1.0.140"
sha2 = "0.11.0"
tiktoken-rs = "=0.12.0"
